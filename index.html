/* =========================================================
   DERIVED / COMPUTED HELPERS (dues, totals)
   ========================================================= */

// Fixed metadata keys on a fee-scale row — every OTHER key on the row is a fee head/column.
// `feeCategories` is a single JSON sidecar column: { [feeType]: { category, months } } — set from
// the Master Fee Form's Category field, kept as ONE extra column rather than one per head.
const FEE_META_KEYS = ["id", "kind", "year", "className", "section", "designation", "note", "createdAt", "updatedAt", "feeCategories"];
function feeHeadsOf(row) {
  return Object.keys(row).filter(k => !FEE_META_KEYS.includes(k) && row[k] !== "" && row[k] !== null && row[k] !== undefined);
}
function feeCategoriesOf(row) {
  if (!row.feeCategories) return {};
  if (typeof row.feeCategories === "object") return row.feeCategories;
  try { return JSON.parse(row.feeCategories) || {}; } catch (e) { return {}; }
}

// Returns a student's CURRENT status — class, section, subject, roll, session — sourced from
// their Promotion sheet record (kept up to date on every promotion) when one exists, falling
// back to their original Admission Form values for students who somehow have no Promotion row yet.
function getCurrentStatus(student, promotions) {
  const promo = (promotions || []).find(p => p.studentId === student.id);
  if (promo) {
    return {
      className: promo.className, section: promo.section,
      subjectGroup: promo.subjectGroup, roll: promo.roll, session: promo.session,
    };
  }
  return {
    className: student.className, section: student.section,
    subjectGroup: student.subjectGroup, roll: student.roll, session: student.session,
  };
}

function yearFromSession(session, fallback) {
  if (!session) return fallback;
  const match = String(session).match(/\d{4}/);
  return match ? match[0] : String(session);
}

// A student's year-by-year class history drives which year's Master Fee rules apply.
// Combines the archived ClassHistory sheet (one row per past promotion, i.e. what class they
// were in before each promotion) with their current Promotion sheet record (what class they're
// in now) — together these give the full year-by-year progression needed for fee calculation.
function getClassHistory(student, promotions, classHistories) {
  const admissionYear = student.admissionDate ? new Date(student.admissionDate).getFullYear() : CURRENT_YEAR;
  const past = (classHistories || [])
    .filter(h => h.studentId === student.id)
    .map(h => ({ year: yearFromSession(h.session, String(admissionYear)), className: h.className, section: h.section, roll: h.roll, subjectGroup: h.subjectGroup }))
    .filter(e => e.className);
  const current = getCurrentStatus(student, promotions);
  const currentEntry = { year: yearFromSession(current.session, String(CURRENT_YEAR)), className: current.className, section: current.section, roll: current.roll, subjectGroup: current.subjectGroup };
  if (!currentEntry.className) return past.length ? past : [{ year: String(admissionYear), className: student.className, section: student.section, roll: student.roll, subjectGroup: student.subjectGroup }];
  return [...past, currentEntry];
}

// Every student who was enrolled in `className` during `year`, using their full class history
// (current Promotion + archived ClassHistory) rather than just their CURRENT class — so Marks
// Entry / Result / Marksheet keep working correctly for past years too. Returns each student
// with that year's className/section/roll merged in, sorted by roll.
function studentsInClassYear(students, promotions, classHistories, className, year) {
  if (!className || !year) return [];
  return (students || [])
    .map(s => {
      const history = getClassHistory(s, promotions, classHistories);
      const entry = history.find(h => h.className === className && String(h.year) === String(year));
      return entry ? { ...s, className: entry.className, section: entry.section, roll: entry.roll } : null;
    })
    .filter(Boolean)
    .sort((a, b) => (Number(a.roll) || 0) - (Number(b.roll) || 0) || str(a.roll).localeCompare(str(b.roll)));
}

// Returns [{feeType, amount, category, months}] for one class-history entry (a specific year + class),
// using that year's Master Fee row — a section-specific row overrides "All Sections" for the same year+class.
function applicableFeeHeadsForEntry(entry, feeRules) {
  const sameClassRules = (feeRules || []).filter(f => f.className === entry.className);
  let rulesForYearClass = sameClassRules.filter(f => String(f.year) === String(entry.year));
  // No fee rule was entered for this exact year (e.g. the year field on the Master Fee row
  // doesn't line up with the year computed from the student's session/class history) — rather
  // than showing "No fee rules set for this class", fall back to the closest year that DOES
  // have a rule for this class: prefer the latest year at or before this one, otherwise the
  // earliest year after it, so a class already set up in Master Fee is never treated as empty.
  if (rulesForYearClass.length === 0 && sameClassRules.length > 0) {
    const years = [...new Set(sameClassRules.map(f => Number(f.year) || 0))];
    const entryYearNum = Number(entry.year) || 0;
    const atOrBefore = years.filter(y => y <= entryYearNum);
    const fallbackYear = atOrBefore.length ? Math.max(...atOrBefore) : Math.min(...years);
    rulesForYearClass = sameClassRules.filter(f => (Number(f.year) || 0) === fallbackYear);
  }
  const allSectionsRow = rulesForYearClass.find(f => !f.section);
  const specificRow = rulesForYearClass.find(f => f.section === entry.section);
  const map = {};
  const cats = {};
  if (allSectionsRow) { feeHeadsOf(allSectionsRow).forEach(h => { map[h] = Number(allSectionsRow[h]) || 0; }); Object.assign(cats, feeCategoriesOf(allSectionsRow)); }
  if (specificRow) { feeHeadsOf(specificRow).forEach(h => { map[h] = Number(specificRow[h]) || 0; }); Object.assign(cats, feeCategoriesOf(specificRow)); }
  // A fee rule row DOES exist for this year+class, but it was saved against a specific section
  // that doesn't match this student's section, and there's no "All Sections" row either — rather
  // than silently showing nothing (which looks like "the fee I just added isn't showing"), fall
  // back to using whatever row IS there so a newly added Master Fee rule is never invisible.
  if (!allSectionsRow && !specificRow && rulesForYearClass.length > 0) {
    rulesForYearClass.forEach(row => { feeHeadsOf(row).forEach(h => { map[h] = Number(row[h]) || 0; }); Object.assign(cats, feeCategoriesOf(row)); });
  }
  return Object.entries(map).map(([feeType, amount]) => ({
    feeType, amount, category: (cats[feeType] && cats[feeType].category) || "Yearly", months: (cats[feeType] && cats[feeType].months) || [],
  }));
}

/* =========================================================
   ACTIVATION (Deactivate / Reactivate) HELPERS
   An "activations" row: { id, studentId, status: "Deactivate"|"Reactivate", date, ... }
   ========================================================= */

// Builds the student's list of ON (active-enrollment) date ranges, starting from their
// Admission Date. A Deactivate event closes the current ON range at that date. A Reactivate
// event opens a new ON range starting at that date. If the student is currently ON (last event
// was Reactivate, or there is no Deactivate event yet), the final range is left open-ended
// (end: null) — the caller fills that in with "today" or the Invoice Date as needed.
function getActiveRanges(student, activations) {
  const events = (activations || [])
    .filter(a => a.studentId === student.id && a.date)
    .slice()
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  const ranges = [];
  const start0 = student.admissionDate || null;
  if (!start0) return ranges;
  let start = start0, open = true;
  events.forEach(ev => {
    if (ev.status === "Deactivate" && open) {
      ranges.push({ start, end: ev.date });
      open = false;
    } else if (ev.status === "Reactivate" && !open) {
      start = ev.date;
      open = true;
    }
  });
  if (open) ranges.push({ start, end: null });
  return ranges;
}

// Current Active/Inactive status for a student, plus their most recent activation event —
// used by the Activation Form/list and the Students list "Status" column.
function getActivationStatus(student, activations) {
  const events = (activations || [])
    .filter(a => a.studentId === student.id && a.date)
    .slice()
    .sort((a, b) => new Date(a.date) - new Date(b.date));
  if (events.length === 0) return { status: "Active", lastEvent: null, events };
  const last = events[events.length - 1];
  return { status: last.status === "Deactivate" ? "Inactive" : "Active", lastEvent: last, events };
}

// Fraction (0..1) of days within [rangeStart, rangeEnd] the student was Active, per their
// activation history — deactivated stretches (month after Deactivate through month before
// Reactivate) are excluded from the fee period. No activation rows at all = always active (1).
function activeDayFraction(student, activations, rangeStart, rangeEnd) {
  if (!rangeStart || !rangeEnd) return 1;
  const rs = new Date(rangeStart), re = new Date(rangeEnd);
  const totalDays = Math.max(1, (re - rs) / 86400000);
  const activeRanges = getActiveRanges(student, activations);
  if (activeRanges.length === 0) return 1;
  let activeDays = 0;
  activeRanges.forEach(r => {
    const as = new Date(r.start);
    const ae = r.end ? new Date(r.end) : re;
    const s = as > rs ? as : rs;
    const e = ae < re ? ae : re;
    if (e > s) activeDays += (e - s) / 86400000;
  });
  return Math.max(0, Math.min(1, activeDays / totalDays));
}

// Each Master Fee head now carries a Category (set in the Master Fee Form) that says exactly
// how it should be counted: "Monthly" (once per active month), "Half Yearly" (once per active
// half-year term), "3 Times" (once per each of its selected months, if that month was active),
// "Yearly" (once for the year, if any month was active — the default/legacy behavior), or
// "Admission Year" (charged exactly once in total, only in the calendar year the student was
// admitted — e.g. a one-time Admission/ID Card fee that should never repeat in later years).
const FEE_CATEGORIES = ["Monthly", "Half Yearly", "Yearly", "3 Times", "Admission Year"];
const MONTH_NAMES = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

// Which calendar months (as "YYYY-MM" strings) inside [rangeStart, rangeEnd] the student was
// Active for at least part of the month, per their Deactivate/Reactivate history. No activation
// history at all = every month in range counts as active.
function activeMonthsInRange(student, activations, rangeStart, rangeEnd) {
  if (!rangeStart || !rangeEnd) return [];
  const rs = new Date(rangeStart), re = new Date(rangeEnd);
  if (re < rs) return [];
  const activeRanges = getActiveRanges(student, activations);
  const hasActivationHistory = activations && activations.some(a => a.studentId === student.id);
  const months = [];
  let cursor = new Date(rs.getFullYear(), rs.getMonth(), 1);
  const stop = new Date(re.getFullYear(), re.getMonth(), 1);
  while (cursor <= stop) {
    const monthStart = new Date(cursor.getFullYear(), cursor.getMonth(), 1);
    const monthEnd = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 0);
    const winStart = monthStart > rs ? monthStart : rs;
    const winEnd = monthEnd < re ? monthEnd : re;
    const isActive = !hasActivationHistory || activeRanges.some(r => {
      const as = new Date(r.start);
      const ae = r.end ? new Date(r.end) : re;
      return as <= winEnd && ae >= winStart;
    });
    if (isActive) months.push(`${cursor.getFullYear()}-${String(cursor.getMonth() + 1).padStart(2, "0")}`);
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }
  return months;
}

// Counts how many times a fee head is actually payable within [periodStart, periodEnd], per
// its Category, using the student's active months in that window.
function occurrencesForHead(h, student, activations, periodStart, periodEnd) {
  const activeMonths = activeMonthsInRange(student, activations, periodStart, periodEnd);
  const year = String(periodStart).slice(0, 4);
  const category = h.category || "Yearly";
  if (category === "Admission Year") {
    const admissionYear = student.admissionDate ? String(new Date(student.admissionDate).getFullYear()) : null;
    return (admissionYear && admissionYear === year && activeMonths.length > 0) ? 1 : 0;
  }
  if (category === "Monthly") return activeMonths.length;
  if (category === "Half Yearly") {
    const term1 = activeMonths.some(m => m >= `${year}-01` && m <= `${year}-06`);
    const term2 = activeMonths.some(m => m >= `${year}-07` && m <= `${year}-12`);
    return (term1 ? 1 : 0) + (term2 ? 1 : 0);
  }
  if (category === "3 Times") {
    const months = h.months || [];
    return months.filter(m => activeMonths.includes(`${year}-${String(m).padStart(2, "0")}`)).length;
  }
  return activeMonths.length > 0 ? 1 : 0; // Yearly
}

// Per-year-per-class-per-head breakdown: [{ year, className, section, head, charged, paid, waived, due }].
// A student who changed class year to year gets one line group per (year, class) — each priced by
// that year's Master Fee rules. Repeating the same class across two years produces two separate lines.
// Payments/waivers are no longer stored on the student record at all — they live solely as
// line items inside that student's saved Invoice records (Invoice sheet, one row per invoice).
// This pulls and flattens all of a student's invoice line-items across their full invoice history.
function studentPaidRows(student, invoices) {
  const studentInvoices = (invoices || []).filter(inv => inv.studentId === student.id);
  return studentInvoices.flatMap(inv => Array.isArray(inv.rows) ? inv.rows : []);
}

// Per-year-per-class-per-head breakdown: [{ year, className, section, head, charged, paid, waived, due }].
// Due is the total charged (per Master Fee, year by year per the student's Promotion/ClassHistory
// progression) minus everything paid/waived to date across ALL of that student's invoices for that head+year+class.
// Each head's Category (Monthly/Half Yearly/Yearly/3 Times) decides how many times its amount is
// charged within the elapsed period, and `activations` (Deactivate/Reactivate history) decides
// which months count as "active" for that counting — exactly as the Activation workflow intends.
// `asOfDate` (optional, defaults to today) is the "Invoice Date" boundary for the current year's line.
function studentFeeBreakdown(student, feeRules, invoices, promotions, classHistories, activations, asOfDate) {
  const history = getClassHistory(student, promotions, classHistories);
  const paidRows = studentPaidRows(student, invoices);
  const today = asOfDate || new Date().toISOString().slice(0, 10);
  const lines = [];
  history.forEach(entry => {
    const heads = applicableFeeHeadsForEntry(entry, feeRules);
    const yearStart = `${entry.year}-01-01`;
    const yearEndCalendar = `${entry.year}-12-31`;
    const yearEnd = yearEndCalendar < today ? yearEndCalendar : today;
    const periodStart = (student.admissionDate && student.admissionDate > yearStart) ? student.admissionDate : yearStart;
    heads.forEach(h => {
      const matching = paidRows.filter(r => r.head === h.feeType && String(r.year) === String(entry.year) && r.className === entry.className);
      const paid = sumBy(matching, r => r.payment);
      const waived = sumBy(matching, r => r.waiver);
      const perOccurrence = Number(h.amount) || 0;
      const occurrences = periodStart <= yearEnd ? occurrencesForHead(h, student, activations, periodStart, yearEnd) : 0;
      const charged = perOccurrence * occurrences;
      lines.push({
        year: entry.year, className: entry.className, section: entry.section,
        head: h.feeType, category: h.category || "Yearly", charged, paid, waived, due: Math.max(0, charged - paid - waived),
      });
    });
  });
  return lines;
}

function studentDueFromRules(student, feeRules, invoices, promotions, classHistories, activations, asOfDate) {
  return sumBy(studentFeeBreakdown(student, feeRules, invoices, promotions, classHistories, activations, asOfDate), r => r.due);
}

// Legacy fallback (kept for any old records without fee-rule linkage)
function studentDue(student) {
  const totalFee = Number(student.totalFee) || 0;
  const paid = Number(student.paidAmount) || 0;
  return Math.max(0, totalFee - paid);
}
function teacherDue(teacher) {
  const totalSalary = (Number(teacher.basicSalary) || 0) + (Number(teacher.allowance) || 0);
  const paid = Number(teacher.paidAmount) || 0;
  return Math.max(0, totalSalary - paid);
}

// Per-head breakdown for a teacher's payable amounts, from their Join Date through `asOfDate`
// (defaults to today), minus every salary payment made so far — same Category-aware (Monthly/
// Half Yearly/Yearly/3 Times) occurrence counting as student fees, applied year by year across
// however many years the teacher has been employed. If resigned, stops counting at Resign Date.
// Uses the Master Fee "Teacher Fee Scale" row matching their designation (heads as columns) when
// available; otherwise falls back to the two legacy components (Basic Salary, Allowance) as a flat total.
function teacherFeeBreakdown(teacher, teacherFeeRules, asOfDate) {
  const rowsForDesignation = (teacherFeeRules || []).filter(f => f.designation === teacher.designation);
  const payments = teacher.payments || [];
  const today = asOfDate || new Date().toISOString().slice(0, 10);
  const periodEndOverall = (teacher.status === "Resigned" && teacher.resignDate && teacher.resignDate < today) ? teacher.resignDate : today;
  const periodStartOverall = teacher.joinDate || periodEndOverall;

  if (rowsForDesignation.length > 0 && periodStartOverall && periodStartOverall <= periodEndOverall) {
    const startYear = Number(periodStartOverall.slice(0, 4));
    const endYear = Number(periodEndOverall.slice(0, 4));
    const totals = {}; // head -> { charged, year (most recent used, for display) }
    for (let y = startYear; y <= endYear; y++) {
      const row = rowsForDesignation.find(f => String(f.year) === String(y))
        || rowsForDesignation.find(f => String(f.year) === String(CURRENT_YEAR))
        || [...rowsForDesignation].sort((a, b) => Number(b.year || 0) - Number(a.year || 0))[0];
      if (!row) continue;
      const heads = feeHeadsOf(row);
      if (heads.length === 0) continue;
      const cats = feeCategoriesOf(row);
      const yearStart = `${y}-01-01`, yearEndCal = `${y}-12-31`;
      const periodStart = periodStartOverall > yearStart ? periodStartOverall : yearStart;
      const periodEnd = periodEndOverall < yearEndCal ? periodEndOverall : yearEndCal;
      if (periodStart > periodEnd) continue;
      heads.forEach(h => {
        const category = (cats[h] && cats[h].category) || "Monthly"; // salaries default to Monthly, unlike student fees
        const months = (cats[h] && cats[h].months) || [];
        const occurrences = occurrencesForHead({ category, months }, teacher, [], periodStart, periodEnd);
        const charged = (Number(row[h]) || 0) * occurrences;
        if (!totals[h]) totals[h] = { charged: 0, year: y };
        totals[h].charged += charged;
        totals[h].year = y;
      });
    }
    const results = Object.entries(totals).map(([head, t]) => {
      const paid = sumBy(payments.filter(p => p.head === head), p => p.amount);
      return { head, year: t.year, charged: t.charged, paid, due: Math.max(0, t.charged - paid) };
    });
    if (results.length > 0) return results;
  }

  // Fallback: legacy basicSalary/allowance/paidAmount fields, paidAmount applied to Basic first.
  // (No date-based counting available for this fallback — it's a flat one-time total.)
  const basic = Number(teacher.basicSalary) || 0;
  const allowance = Number(teacher.allowance) || 0;
  const totalPaid = Number(teacher.paidAmount) || 0;
  const paidToBasic = Math.min(totalPaid, basic);
  const paidToAllowance = Math.min(Math.max(0, totalPaid - basic), allowance);
  return [
    { head: "Basic Salary", charged: basic, paid: paidToBasic, due: Math.max(0, basic - paidToBasic) },
    { head: "Allowance", charged: allowance, paid: paidToAllowance, due: Math.max(0, allowance - paidToAllowance) },
  ].filter(r => r.charged > 0);
}

function teacherDueFromRules(teacher, teacherFeeRules, asOfDate) {
  return sumBy(teacherFeeBreakdown(teacher, teacherFeeRules, asOfDate), r => r.due);
}

function sumBy(arr, fn) { return arr.reduce((s, x) => s + (Number(fn(x)) || 0), 0); }

function withinRange(dateStr, range) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  const now = new Date();
  if (range === "daily") {
    return d.toDateString() === now.toDateString();
  }
  if (range === "monthly") {
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }
  if (range === "yearly") {
    return d.getFullYear() === now.getFullYear();
  }
  if (range === "total") return true;
  return true;
}

function Dashboard({ data, setActiveModule }) {

  const totalExpense = sumBy(finance.filter(f => f.type === "expense"), f => f.amount);

  const classCounts = {};
  students.forEach(s => { classCounts[s.className] = (classCounts[s.className] || 0) + 1; });

  return (
    <div>
      <div className="grid grid-4" style={{ marginBottom: 20 }}>

        <StatCard label="This Month's Expense" value={"৳" + money(monthExpense)} sub={`All-time: ৳${money(totalExpense)}`} accent="var(--red)" />
      </div>

      <div className="grid grid-2" style={{ marginBottom: 20 }}>
        <div className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <h3 style={{ fontSize: 15 }}>Outstanding Dues</h3>

          </div>
          <div className="kv-row"><span className="k">Student fee dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(studentDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Teacher salary dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(teacherDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Total outstanding</span><span className="v">৳{money(studentDueTotal + teacherDueTotal)}</span></div>
        </div>

        <div className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <h3 style={{ fontSize: 15 }}>Students by Class</h3>
            <button className="link-btn" onClick={() => setActiveModule("students")}>Manage →</button>
          </div>
          {Object.keys(classCounts).length === 0 ? (
            <EmptyState title="No students yet" sub="Add your first student to see class-wise distribution." />
          ) : (
            CLASSES.filter(c => classCounts[c]).map(c => (
              <div className="kv-row" key={c}><span className="k">{c}</span><span className="v">{classCounts[c]} students</span></div>
            ))
          )}
        </div>
      </div>

      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
          <h3 style={{ fontSize: 15 }}>Recent Transactions</h3>
          <button className="link-btn" onClick={() => setActiveModule("finance")}>View finance →</button>
        </div>
        {recentFinance.length === 0 ? (
          <EmptyState title="No transactions recorded" sub="Income and expense entries will appear here." />
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Date</th><th>Type</th><th>Doc No</th><th>{"Provider / Spender"}</th><th>Amount</th></tr></thead>
              <tbody>
                {recentFinance.map(f => (
                  <tr key={f.id}>
                    <td>{fmtDate(f.date)}</td>
                    <td><span className={`badge ${f.type === "income" ? "badge-green" : "badge-red"}`}>{f.type}</span></td>
                    <td className="mono">{f.docNo || "—"}</td>
                    <td>{(f.type === "income" ? f.provider : f.spender) || "—"}</td>
                    <td className="mono">৳{money(f.amount)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
    </div>
  );
}

function generateStudentId(existingStudents) {
  const year = new Date().getFullYear();
  const nums = (existingStudents || [])
    .map(s => s.studentId || "")
    .filter(id => id.startsWith(`STU-${year}-`))
    .map(id => parseInt(id.split("-")[2], 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `STU-${year}-${String(next).padStart(4, "0")}`;
}

function generateStaffId(existingTeachers) {
  const nums = (existingTeachers || [])
    .map(t => t.staffId || "")
    .filter(id => id.startsWith("STF-"))
    .map(id => parseInt(id.split("-")[1], 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `STF-${String(next).padStart(4, "0")}`;
}

function generateFormNo(existingStudents) {
  const nums = (existingStudents || [])
    .map(s => s.admissionFormNo || "")
    .filter(id => id.startsWith("ADM-"))
    .map(id => parseInt(id.split("-")[1], 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `ADM-${String(next).padStart(4, "0")}`;
}

function generateInvoiceNo(existingInvoices) {
  const nums = (existingInvoices || [])
    .map(inv => inv.invoiceNo || "")
    .filter(id => id.startsWith("INV-STU-"))
    .map(id => parseInt(id.split("-")[2], 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `INV-STU-${String(next).padStart(4, "0")}`;
}

// Auto-numbers Finance documents — "INV-0001", "INV-0002"… for Invoices (income) and
// "EXP-0001", "EXP-0002"… for Expense Vouchers — each series counted independently.
function generateFinanceDocNo(financeList, type, prefixOverride) {
  const prefix = prefixOverride || (type === "income" ? "INV" : "EXP");
  const nums = (financeList || [])
    .filter(f => f.type === type)
    .map(f => f.docNo || "")
    .filter(id => id.startsWith(prefix + "-"))
    .map(id => parseInt(id.split("-").pop(), 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `${prefix}-${String(next).padStart(4, "0")}`;
}

function nextRollForClass(students, className, excludeId) {
  const rolls = (students || [])
    .filter(s => s.className === className && s.id !== excludeId)
    .map(s => parseInt(s.roll, 10))
    .filter(n => !isNaN(n));
  return rolls.length ? Math.max(...rolls) + 1 : 1;
}

const ADDRESS_FIELDS = ["co", "village", "union", "ward", "po", "upazila", "district"];
const emptyAddress = () => ({ co: "", village: "", union: "", ward: "", po: "", upazila: "", district: "" });
const addrKey = (prefix, field) => prefix + field.charAt(0).toUpperCase() + field.slice(1);

// One printable line from a student's Permanent Address fields (co, village, union, ward,
// post office, upazila, district) — used on the Protyon (Certificate).
function formatPermanentAddress(student) {
  return ADDRESS_FIELDS.map(f => student[addrKey("permanent", f)]).filter(Boolean).join(", ");
}

function generateCertificateNo(existingCertificates) {
  const year = new Date().getFullYear();
  const nums = (existingCertificates || [])
    .map(c => c.certificateNo || "")
    .filter(id => id.startsWith(`CRT-${year}-`))
    .map(id => parseInt(id.split("-")[2], 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `CRT-${year}-${String(next).padStart(4, "0")}`;
}

const emptyStudent = (existingStudents) => {
  const studentId = generateStudentId(existingStudents);
  const student = {
    id: studentId, studentId, admissionFormNo: generateFormNo(existingStudents),
    name: "", fatherName: "", motherName: "", dob: "", gender: "Male",
    className: "One", section: SECTIONS[0], subjectGroup: SUBJECT_GROUPS[0],
    roll: String(nextRollForClass(existingStudents, "One")), session: "",
    admissionDate: new Date().toISOString().slice(0,10),
    previousInstitute: "", previousClass: "",
    bloodGroup: "", nidOrBirthNo: "", phone: "",
    guardianName: "", guardianRelation: GUARDIAN_RELATIONS[0], guardianPhone: "",
    sameAsPresent: false,
    photoUrl: "", status: "Active",
  };
  ADDRESS_FIELDS.forEach(f => { student[addrKey("present", f)] = ""; student[addrKey("permanent", f)] = ""; });
  return student;
};

// Backward compatibility: older records stored presentAddress/permanentAddress as one nested
// JSON object per address. New records save each address line as its own column instead — this
// pulls any old nested data into the new flat fields so existing students still edit correctly.
function migrateAddressFields(s) {
  const out = { ...s };
  ["present", "permanent"].forEach(prefix => {
    const nested = s[`${prefix}Address`];
    if (nested && typeof nested === "object") {
      ADDRESS_FIELDS.forEach(f => {
        const key = addrKey(prefix, f);
        if (!out[key]) out[key] = nested[f] || "";
      });
    }
  });
  return out;
}

      || str(s.name).toLowerCase().includes(query.toLowerCase())
      || str(s.roll).toLowerCase().includes(query.toLowerCase())
      || str(s.studentId).toLowerCase().includes(query.toLowerCase());
    const matchC = !classFilter || getCurrentStatus(s, promotions).className === classFilter;
    return matchQ && matchC;
  });

  function openNew() { setEditing(emptyStudent(students)); }
  function openEdit(s) {
    const current = getCurrentStatus(s, promotions);
    setEditing({ ...s, className: current.className, roll: current.roll, section: current.section, subjectGroup: current.subjectGroup, session: current.session });
  }
  async function handleSave(record) {
    const saved = await save("students", record);
    // The List/Promotion views show a student's CURRENT class/roll/section/subject/session
    // via their Promotion record (getCurrentStatus prefers it over the student record itself),
    // so it must be kept in sync every time the Admission Form is saved — not just on brand-new
    // admissions — otherwise an edit updates the student record but the List still shows the
    // old class/roll/section until a Promotion is separately run.
    if (saved) {
      await save("promotions", {
        id: saved.id, studentId: saved.id, name: saved.name,
        roll: saved.roll, className: saved.className, section: saved.section,
        subjectGroup: saved.subjectGroup, session: saved.session,
      });
    }
    setEditing(null);
    return saved;
  }

  // Deleting from All Admission is a SOFT delete: the student's full record (with their current
  // class/roll/section snapshotted in) is archived into Deleted Students first, then removed from
  // both Students and Promotion — so a promoted/graduated student doesn't linger in the Promotion
  // sheet pointing at a student that no longer exists in the main list.
  async function handleDeleteStudent(s) {
    const current = getCurrentStatus(s, promotions);
    const archived = { ...s, ...current, deletedAt: new Date().toISOString() };
    await save("deletedStudents", archived);
    await remove("promotions", s.id);
    await remove("students", s.id);
  }

  return (
    <div>
      <div className="section-actions">
        {tab === "list" && <button className="btn btn-primary no-print" onClick={openNew}><Icon.plus />New Admission</button>}
        {tab === "promotion" && <button className="btn btn-primary no-print" onClick={() => setPromotionFormOpen(true)}><Icon.plus />Open Promotion Form</button>}
      </div>

      {/* Section switching is handled entirely by the sidebar's Students submenu now. */}

      {tab === "list" && (
        <StudentListTab students={filtered} query={query} setQuery={setQuery} classFilter={classFilter} setClassFilter={setClassFilter}
          onEdit={openEdit} onDelete={handleDeleteStudent} onPrint={(s) => setPrintStudent(s)} feeRules={feeRules} invoices={invoices}
          promotions={promotions} classHistories={classHistories} activations={activations} config={config} />
      )}
      {tab === "promotion" && (
        <PromotionTab students={students} promotions={promotions} save={save} config={config} formOpen={promotionFormOpen} setFormOpen={setPromotionFormOpen} />
      )}
      {tab === "classHistory" && (
        <ClassHistoryTab students={students} classHistories={classHistories} promotions={promotions} save={save} remove={remove} config={config} />
      )}
      {tab === "activation" && (
        <ActivationTab students={students} promotions={promotions} activations={activations} save={save} config={config} />
      )}
      {tab === "office" && (
        <OfficeInformationTab students={students} promotions={promotions} classHistories={classHistories} config={config} />
      )}
      {tab === "deleted" && (
        <DeletedStudentsTab deletedStudents={deletedStudents} save={save} remove={remove} config={config} />
      )}

      {editing && (
        <StudentFormModal student={editing} students={students} onClose={() => setEditing(null)} onSave={handleSave} config={config} />
      )}
      {printStudent && <AdmissionFormPrintModal student={printStudent} config={config} onClose={() => setPrintStudent(null)} />}
    </div>
  );
}

// Delete Students: a soft-delete archive. Every student removed from All Admission lands here
// (with their class/roll/section snapshotted at the moment of deletion) instead of being lost —
// from here staff can permanently erase a mistaken/duplicate record, reprint their Admission
// Form for reference, or Restore them (which re-creates both their Students and Promotion rows).
function DeletedStudentsTab({ deletedStudents, save, remove, config }) {
  const [query, setQuery] = useState("");
  const [printStudent, setPrintStudent] = useState(null);
  const toast = useToast();

  const filtered = deletedStudents.filter(s => !query
    || str(s.name).toLowerCase().includes(query.toLowerCase())
    || str(s.roll).toLowerCase().includes(query.toLowerCase())
    || str(s.studentId).toLowerCase().includes(query.toLowerCase()));

  async function permanentlyDelete(s) {
    if (!confirm(`Permanently delete ${s.name}'s record? This cannot be undone.`)) return;
    await remove("deletedStudents", s.id);
  }

  async function restore(s) {
    if (!confirm(`Restore ${s.name} back to All Admission?`)) return;
    const { deletedAt, ...record } = s;
    const saved = await save("students", record);
    if (saved) {
      await save("promotions", {
        id: saved.id, studentId: saved.id, name: saved.name,
        roll: saved.roll, className: saved.className, section: saved.section,
        subjectGroup: saved.subjectGroup, session: saved.session,
      });
    }
    await remove("deletedStudents", s.id);
    toast && toast(`${s.name} restored`, "success");
  }

  return (
    <div className="card card-flush">
      <div className="no-print" style={{ padding: "16px 18px 0" }}>
        <div className="search-row">
          <input className="search-input" placeholder="Search by name, roll, or Student ID…" value={query} onChange={(e) => setQuery(e.target.value)} />
        </div>
      </div>
      {filtered.length === 0 ? (
        <EmptyState title="No deleted students" sub="Students removed from All Admission appear here and can be restored." />
      ) : (
        <div className="table-wrap">
          <table>
            <thead>
              <tr><th>Photo</th><th>Student ID</th><th>Name</th><th>Class</th><th>Section</th><th>Deleted At</th><th className="no-print"></th></tr>
            </thead>
            <tbody>
              {filtered.map(s => (
                <tr key={s.id}>
                  <td>
                    <div style={{ width: 34, height: 34, borderRadius: 7, overflow: "hidden", background: "var(--paper)", border: "1px solid var(--line)", display: "flex", alignItems: "center", justifyContent: "center" }}>
                      {s.photoUrl ? <img src={s.photoUrl} alt="" style={{ width: "100%", height: "100%", objectFit: "cover" }} /> : <Icon.students width={14} height={14} style={{ opacity: 0.35 }} />}
                    </div>
                  </td>
                  <td className="mono">{s.studentId || "—"}</td>
                  <td>{s.name}</td>
                  <td>{s.className || "—"}</td>
                  <td>{s.section || "—"}</td>
                  <td>{s.deletedAt ? fmtDate(s.deletedAt) : "—"}</td>
                  <td className="no-print">
                    <div style={{ display: "flex", gap: 6 }}>
                      <button className="btn btn-sm btn-icon" title="Delete permanently" onClick={() => permanentlyDelete(s)}><Icon.trash /></button>
                      <button className="btn btn-sm btn-icon" title="Print" onClick={() => setPrintStudent(s)}><Icon.print /></button>
                      <button className="btn btn-sm btn-icon" title="Restore" onClick={() => restore(s)}><Icon.refresh /></button>
                    </div>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      {printStudent && <AdmissionFormPrintModal student={printStudent} config={config} onClose={() => setPrintStudent(null)} />}
    </div>
  );
}

// Promotion: pick a Class + Year to find every student currently there (via their Promotion
// record), then bulk-assign each student's New Roll (and, if needed, New Section/Subject) for

function PromotionTab({ students, promotions, save, config, formOpen, setFormOpen }) {
  const [query, setQuery] = useState("");

  const rows = students.map(s => ({ student: s, current: getCurrentStatus(s, promotions) }));

    const matchQ = !query
      || str(student.name).toLowerCase().includes(query.toLowerCase())
      || str(current.roll).toLowerCase().includes(query.toLowerCase())
      || str(student.studentId).toLowerCase().includes(query.toLowerCase());
    const matchC = !classFilter || current.className === classFilter;
    return matchQ && matchC;
  });

  function handlePrint() { window.print(); }

  return (
    <div>
      <div className="card card-flush">
        <div className="no-print" style={{ padding: "16px 18px 0" }}>
          <div className="search-row">
            <input className="search-input" placeholder="Search by name, roll, or Student ID…" value={query} onChange={(e) => setQuery(e.target.value)} />
            <select className="filter-select" value={classFilter} onChange={(e) => setClassFilter(e.target.value)}>
              <option value="">All Classes</option>

          <div className="table-wrap">
            <PrintDocHead config={config} headline={`Student Status${classFilter ? ` — ${classFilter}` : ""}`} />
            <table>
              <thead><tr><th>Student ID</th><th>Name</th><th>Class</th><th>Section</th><th>Subject</th><th>Roll</th><th>Session</th></tr></thead>
              <tbody>
                {filtered.map(({ student, current }) => (
                  <tr key={student.id}>
                    <td className="mono">{student.studentId}</td>
                    <td>{student.name}</td>
                    <td>{current.className || "—"}</td>
                    <td>{current.section || "—"}</td>
                    <td>{current.subjectGroup || "—"}</td>
                    <td className="mono">{current.roll || "—"}</td>
                    <td>{current.session || "—"}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>

// The actual promotion action: pick Current Class+Year to find matching students, set each
// one's New Roll (and Section/Subject if needed) for the New Class+Year, then submit. After
// submitting, shows the updated (post-promotion) info for confirmation before closing.
function PromotionFormModal({ students, promotions, save, onClose }) {
  const [fromClass, setFromClass] = useState("One");
  const [fromYear, setFromYear] = useState(String(CURRENT_YEAR));
  const [toClass, setToClass] = useState("Two");
  const [toYear, setToYear] = useState(String(CURRENT_YEAR + 1));
  const [rowEdits, setRowEdits] = useState({}); // { studentId: { roll, section, subjectGroup } }
  const [saving, setSaving] = useState(false);
  const [promoted, setPromoted] = useState(null); // array of updated records, shown after submit
  const toast = useToast();

  const candidates = students
    .map(s => ({ student: s, current: getCurrentStatus(s, promotions) }))
    .filter(({ current }) => current.className === fromClass && yearFromSession(current.session, "") === fromYear);

  function updateRow(studentId, key, val) {
    setRowEdits(prev => ({ ...prev, [studentId]: { ...prev[studentId], [key]: val } }));
  }
  function getRowValue(studentId, key, fallback) {
    return (rowEdits[studentId] && rowEdits[studentId][key] !== undefined) ? rowEdits[studentId][key] : fallback;
  }

  async function handlePromote() {
    if (candidates.length === 0) { toast && toast("No students found for that class/year", "error"); return; }
    setSaving(true);
    const updatedRecords = [];
    for (const { student, current } of candidates) {
      const newRoll = getRowValue(student.id, "roll", "");
      const newSection = getRowValue(student.id, "section", SECTIONS.includes(current.section) ? current.section : SECTIONS[0]);
      const newSubject = getRowValue(student.id, "subjectGroup", current.subjectGroup || SUBJECT_GROUPS[0]);

      // Archive the pre-promotion state into ClassHistory (append-only log).
      await save("classHistories", {
        id: null, studentId: student.id, name: student.name,
        className: current.className, roll: current.roll, section: current.section,
        subjectGroup: current.subjectGroup, session: current.session,
      });
      // Update the Promotion record to the new class/year values.
      const updated = {
        id: student.id, studentId: student.id, name: student.name,
        roll: newRoll, className: toClass, section: newSection,
        subjectGroup: newSubject, session: toYear,
      };
      await save("promotions", updated);
      updatedRecords.push(updated);
    }
    setRowEdits({});
    setSaving(false);
    setPromoted(updatedRecords);
    toast && toast(`Promoted ${candidates.length} student(s) to ${toClass} (${toYear})`, "success");
  }

  return (
    <Modal title="Promotion Form" onClose={onClose} size="lg"
      footer={promoted ? (
        <button className="btn btn-primary" onClick={onClose}>Done</button>
      ) : (
        <>
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" disabled={saving || candidates.length === 0} onClick={handlePromote}>
            {saving ? "Promoting…" : `Promote ${candidates.length ? `(${candidates.length})` : ""}`}
          </button>
        </>
      )}>
      {promoted ? (
        <div>
          <EmptyState title="Promotion complete" sub={`${promoted.length} student(s) updated — here is their new status.`} />
          <div className="table-wrap">
            <table>
              <thead><tr><th>Student ID</th><th>Name</th><th>New Class</th><th>New Section</th><th>New Subject</th><th>New Roll</th><th>New Session</th></tr></thead>
              <tbody>
                {promoted.map(p => (
                  <tr key={p.id}>
                    <td className="mono">{p.studentId}</td>
                    <td>{p.name}</td>
                    <td>{p.className}</td>
                    <td>{p.section}</td>
                    <td>{p.subjectGroup}</td>
                    <td className="mono">{p.roll || "—"}</td>
                    <td>{p.session}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      ) : (
        <div>
          <div className="form-grid cols-3" style={{ marginBottom: 16 }}>
            <Field label="Current Class"><select value={fromClass} onChange={(e) => setFromClass(e.target.value)}>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
            <Field label="Current Year"><input type="number" value={fromYear} onChange={(e) => setFromYear(e.target.value)} /></Field>
            <div />
            <Field label="New Class"><select value={toClass} onChange={(e) => setToClass(e.target.value)}>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
            <Field label="New Year"><input type="number" value={toYear} onChange={(e) => setToYear(e.target.value)} /></Field>
          </div>

          {candidates.length === 0 ? (
            <EmptyState title="No students found" sub={`No students are currently in ${fromClass} for year ${fromYear}.`} />
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr><th>ID</th><th>Name</th><th>Current Roll</th><th>Current Section</th><th>Current Subject</th><th>New Roll</th><th>New Section</th><th>New Subject</th></tr>
                </thead>
                <tbody>
                  {candidates.map(({ student, current }) => (
                    <tr key={student.id}>
                      <td className="mono">{student.studentId}</td>
                      <td>{student.name}</td>
                      <td className="mono">{current.roll || "—"}</td>
                      <td>{current.section || "—"}</td>
                      <td>{current.subjectGroup || "—"}</td>
                      <td><input type="text" style={{ width: 80, padding: "5px 8px", border: "1px solid var(--line)", borderRadius: 6 }} value={getRowValue(student.id, "roll", "")} onChange={(e) => updateRow(student.id, "roll", e.target.value)} placeholder="Roll" /></td>
                      <td>
                        <select style={{ padding: "5px 8px", border: "1px solid var(--line)", borderRadius: 6 }} value={getRowValue(student.id, "section", current.section)} onChange={(e) => updateRow(student.id, "section", e.target.value)}>
                          {SECTIONS.map(s => <option key={s}>{s}</option>)}
                        </select>
                      </td>
                      <td>
                        <select style={{ padding: "5px 8px", border: "1px solid var(--line)", borderRadius: 6 }} value={getRowValue(student.id, "subjectGroup", current.subjectGroup || SUBJECT_GROUPS[0])} onChange={(e) => updateRow(student.id, "subjectGroup", e.target.value)}>
                          {SUBJECT_GROUPS.map(s => <option key={s}>{s}</option>)}
                        </select>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </Modal>
  );
}

/* =========================================================
   CLASS HISTORY TAB — read-only archive of every past promotion,
   one row per (student, year/class) that they have since been promoted OUT of.
   ========================================================= */
function ClassHistoryTab({ students, classHistories, promotions, save, remove, config }) {
  const [query, setQuery] = useState("");
  const [classFilter, setClassFilter] = useState("");
  const [editing, setEditing] = useState(null);
  function handlePrint() { window.print(); }

  const studentById = {};
  students.forEach(s => { studentById[s.id] = s; });

  const rows = (classHistories || [])
    .map(h => ({ h, student: studentById[h.studentId] }))
    .filter(r => r.student)
    .filter(r => {
      const matchQ = !query
        || str(r.student.name).toLowerCase().includes(query.toLowerCase())
        || str(r.h.roll).toLowerCase().includes(query.toLowerCase())
        || str(r.student.studentId).toLowerCase().includes(query.toLowerCase());
      const matchC = !classFilter || r.h.className === classFilter;
      return matchQ && matchC;
    })
    .sort((a, b) => new Date(b.h.createdAt || 0) - new Date(a.h.createdAt || 0));

  return (
    <div className="card card-flush">
      <div className="no-print" style={{ padding: "16px 18px 0" }}>
        <div className="search-row">
          <div style={{ position: "relative", flex: 1, minWidth: 200 }}>
            <input className="search-input" placeholder="Search by name, roll, or Student ID…" value={query} onChange={(e) => setQuery(e.target.value)} />
          </div>
          <select className="filter-select" value={classFilter} onChange={(e) => setClassFilter(e.target.value)}>
            <option value="">All Classes</option>
            {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
          </select>
          <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>
        </div>
      </div>
      {rows.length === 0 ? (
        <EmptyState title="No class history yet" sub="Records appear here after a student is promoted through the Promotion Form." />
      ) : (
        <div className="table-wrap">
          <PrintDocHead config={config} headline="Student Class History" />
          <table>
            <thead>
              <tr><th>Student ID</th><th>Name</th><th>Class</th><th>Section</th><th>Subject</th><th>Roll</th><th>Session</th><th className="no-print"></th></tr>
            </thead>
            <tbody>
              {rows.map(({ h, student }, i) => (
                <tr key={h.id || i}>
                  <td className="mono">{student.studentId}</td>
                  <td>{student.name}</td>
                  <td>{h.className}</td>
                  <td>{h.section}</td>
                  <td>{h.subjectGroup || "—"}</td>
                  <td className="mono">{h.roll || "—"}</td>
                  <td>{h.session}</td>
                  <td className="no-print">
                    <div style={{ display: "flex", gap: 6 }}>
                      <button className="btn btn-sm btn-icon" title="Edit" onClick={() => setEditing({ ...h })}><Icon.edit /></button>

function ActivationFormModal({ students, promotions, activations, save, onClose }) {
  const [studentId, setStudentId] = useState("");
  const [status, setStatus] = useState("Deactivate");
  const [date, setDate] = useState(new Date().toISOString().slice(0, 10));
  const [saving, setSaving] = useState(false);
  const toast = useToast();

  const student = students.find(s => s.id === studentId);
  const current = student ? getCurrentStatus(student, promotions) : null;
  const activationInfo = student ? getActivationStatus(student, activations) : null;

  function handlePick(s) {
    setStudentId(s.id);
    const info = getActivationStatus(s, activations);
    setStatus(info.status === "Active" ? "Deactivate" : "Reactivate");
  }

  async function handleSave() {
    if (!student) return;
    setSaving(true);
    await save("activations", {
      id: null, studentId: student.id, name: student.name,
      className: current.className, roll: current.roll, section: current.section,
      subjectGroup: current.subjectGroup, session: current.session,
      admissionDate: student.admissionDate, status, date,
    });
    setSaving(false);
    toast && toast(`${status === "Deactivate" ? "Deactivated" : "Reactivated"} ${student.name}`, "success");
    onClose();
  }

  return (
    <Modal title="Activation Form" onClose={onClose} size="lg"
      footer={<>
        <button className="btn" onClick={onClose}>Cancel</button>
        <button className="btn btn-primary" disabled={!student || saving} onClick={handleSave}>{saving ? "Saving…" : "Save"}</button>
      </>}>
      {!student ? (
        <StudentPicker students={students} label="Select Student ID / Name" onPick={handlePick} />
      ) : (
        <div className="form-grid cols-2">
          <Field label="Student ID"><input type="text" value={student.studentId} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Name"><input type="text" value={student.name} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Class"><input type="text" value={current.className || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Roll"><input type="text" value={current.roll || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Section"><input type="text" value={current.section || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Subject"><input type="text" value={current.subjectGroup || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Session"><input type="text" value={current.session || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Admission Date (Auto)"><input type="text" value={fmtDate(student.admissionDate)} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Status">
            <select value={status} onChange={(e) => setStatus(e.target.value)}>
              <option value="Deactivate" disabled={activationInfo.status === "Inactive"}>Deactivate</option>
              <option value="Reactivate" disabled={activationInfo.status === "Active"}>Reactivate</option>
            </select>
          </Field>
          <Field label="Date"><input type="date" value={date} onChange={(e) => setDate(e.target.value)} /></Field>
          <div span2 style={{ gridColumn: "1 / -1" }}>
            <button className="btn btn-sm" onClick={() => setStudentId("")}>← Choose a different student</button>
          </div>
        </div>
      )}
    </Modal>
  );
}

function InvoiceListPrintModal({ invoices, students, config, onClose }) {
  const [mode, setMode] = useState("class"); // 'class' | 'search'

  const matches = query.trim() ? students.filter(s =>
    str(s.name).toLowerCase().includes(query.toLowerCase())

    || str(s.studentId).toLowerCase().includes(query.toLowerCase())

  const [selectedStudent, setSelectedStudent] = useState(null);

  const rows = mode === "class"
    ? invoices.filter(inv => inv.className === classFilter)

  return (

        <div className="no-print" style={{ marginBottom: 16 }}>

            {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}

        </div>
      )}
      {mode === "search" && (
        <div className="no-print" style={{ marginBottom: 16 }}>
          <Field label="Search Student" hint="by name, roll, or Student ID">
            <input className="search-input" value={query} onChange={(e) => { setQuery(e.target.value); setSelectedStudent(null); }} placeholder="Type to search…" />
          </Field>
          {matches.length > 0 && (
            <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 8 }}>

        ) : (
          <div className="table-wrap">

              <thead>

function invoiceRowsFromBreakdown(breakdown, waiverAmounts, payAmounts, lineKey) {
  const multiYear = new Set(breakdown.map(r => r.year)).size > 1;
  return breakdown.map((r, i) => ({
    no: i + 1,
    key: lineKey(r),
    description: multiYear ? `${r.head} (${r.year})` : r.head,
    head: r.head, year: r.year, className: r.className,
    amountDue: r.due,
    waiver: waiverAmounts ? (Number(waiverAmounts[lineKey(r)]) || 0) : (r.waiver || 0),
    payment: payAmounts ? (Number(payAmounts[lineKey(r)]) || 0) : (r.payment || 0),
  }));
}

function StudentInvoiceModal({ students, initialStudent, config, feeRules, invoices, promotions, classHistories, activations, onSave, saveInvoice, onClose }) {
  const [selected, setSelected] = useState(initialStudent || null);
  const [query, setQuery] = useState("");
  const [payAmounts, setPayAmounts] = useState({}); // { lineKey: amountString }
  const [waiverAmounts, setWaiverAmounts] = useState({}); // { lineKey: amountString }
  const [saving, setSaving] = useState(false);
  const [showPrint, setShowPrint] = useState(false);
  const [submittedInvoice, setSubmittedInvoice] = useState(null);
  usePrintChrome({ hideWatermark: true, hideFooter: true }); // invoice draws its own centered watermark + credit line
  const toast = useToast();

  const matches = query.trim() ? students.filter(s =>
    str(s.name).toLowerCase().includes(query.toLowerCase())
    || str(s.roll).toLowerCase().includes(query.toLowerCase())
    || str(s.studentId).toLowerCase().includes(query.toLowerCase())
  ).slice(0, 20) : [];

  // Student's CURRENT class/roll/section — always sourced from the Promotion sheet, not the
  // (possibly stale) Admission Form values on the raw student record.
  const current = selected ? getCurrentStatus(selected, promotions) : null;
  const displayStudent = selected ? { ...selected, ...current } : null;

  const breakdown = selected ? studentFeeBreakdown(selected, feeRules, invoices, promotions, classHistories, activations) : [];
  const lineKey = (r) => `${r.year}::${r.className}::${r.head}`;
  const rows = invoiceRowsFromBreakdown(breakdown, waiverAmounts, payAmounts, lineKey);
  const subtotal = sumBy(rows, r => r.amountDue);
  const waiverTotal = sumBy(rows, r => r.waiver);
  const paymentTotal = sumBy(rows, r => r.payment);
  const dueAfter = Math.max(0, subtotal - waiverTotal - paymentTotal);

  async function submitPayments() {
    if (waiverTotal === 0 && paymentTotal === 0) { toast && toast("Enter a payment or waiver amount", "error"); return; }
    setSaving(true);
    const today = new Date().toISOString().slice(0,10);

    // Payments/waivers are never stored on the student record — they live only as line items
    // inside this invoice (Invoice sheet). Due is always derived by summing a student's full
    // invoice history, so nothing needs to be written back to the Students sheet here.
    const invoiceNo = generateInvoiceNo(invoices);
    const invoiceRecord = {
      id: invoiceNo,
      invoiceNo,
      studentId: selected.id,
      studentDisplayId: selected.studentId,
      studentName: selected.name,
      className: current.className,
      section: current.section,
      roll: current.roll,
      photoUrl: selected.photoUrl,
      date: today,
      rows,
      subtotal, waiverTotal, paymentTotal, dueAfter,
    };
    let savedInvoiceRecord = invoiceRecord;
    if (saveInvoice) {
      const res = await saveInvoice(invoiceRecord);
      savedInvoiceRecord = res || invoiceRecord;
    }
    setSubmittedInvoice(savedInvoiceRecord);
    setPayAmounts({});
    setWaiverAmounts({});
    setSaving(false);
    toast && toast("Invoice saved", "success");
    // Submit → immediately show the print preview, in the same official format.
    setShowPrint(true);
  }

  return (
    <Modal title="Fee Invoice" onClose={onClose} size="lg"
      footer={selected && !showPrint ? (
        <>
          <button className="btn" onClick={() => { setSelected(null); setPayAmounts({}); setWaiverAmounts({}); }}>← Search Another Student</button>
          <button className="btn btn-primary" disabled={saving} onClick={submitPayments}>Submit</button>
        </>
      ) : showPrint ? (
        <>
          <button className="btn" onClick={() => { setShowPrint(false); setSelected(null); }}>← New Invoice</button>
          <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print / Save as PDF</button>
        </>
      ) : (
        <button className="btn" onClick={onClose}>Close</button>
      )}>
      {showPrint && submittedInvoice ? (
        <InvoiceDocPrint config={config} student={displayStudent} invoiceNo={submittedInvoice.invoiceNo} date={submittedInvoice.date}
          rows={submittedInvoice.rows} subtotal={submittedInvoice.subtotal} waiverTotal={submittedInvoice.waiverTotal}
          paymentTotal={submittedInvoice.paymentTotal} dueAfter={submittedInvoice.dueAfter} />
      ) : !selected ? (
        <div>
          <Field label="Search Student" hint="by name, roll, or Student ID">
            <input className="search-input" autoFocus value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Type to search…" />
          </Field>
          <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
            {matches.map(s => { const c = getCurrentStatus(s, promotions); return (
              <button key={s.id} className="btn" style={{ justifyContent: "flex-start", textAlign: "left" }} onClick={() => setSelected(s)}>
                <strong style={{ marginRight: 8 }}>{s.name}</strong>
                <span style={{ color: "var(--slate-soft)", fontSize: 12.5 }}>{c.className}{c.section} · Roll {c.roll || "—"} · <span className="mono">{s.studentId}</span></span>
              </button>
            ); })}
            {query.trim() && matches.length === 0 && <EmptyState title="No matching students" sub="Try a different name, roll, or Student ID." />}
            {!query.trim() && <EmptyState title="Search for a student" sub="Type a name, roll number, or Student ID above to load their fee invoice." />}
          </div>
        </div>
      ) : (
        <div>
          <div className="grid grid-2" style={{ marginBottom: 18 }}>
            <div className="kv-row"><span className="k">Student ID</span><span className="v mono">{selected.studentId || "—"}</span></div>
            <div className="kv-row"><span className="k">Student</span><span className="v">{selected.name}</span></div>
            <div className="kv-row"><span className="k">Class / Section</span><span className="v">{current.className} — {current.section}</span></div>
            <div className="kv-row"><span className="k">Roll</span><span className="v">{current.roll || "—"}</span></div>
          </div>

          {rows.length === 0 ? (
            <EmptyState title="No fee rules set for this class" sub={`Add fee heads for ${current.className} in Master Fee first.`} />
          ) : (
            <div className="table-wrap">
              <table style={{ width: "100%", marginBottom: 16 }}>
                <thead><tr><th style={{ textAlign: "center" }}>Sl</th><th style={{ textAlign: "center" }}>Description</th><th style={{ textAlign: "center" }}>Amount Due</th><th style={{ textAlign: "center" }}>Waiver</th><th style={{ textAlign: "center" }}>Payment</th></tr></thead>
                <tbody>
                  {breakdown.map((r, i) => {
                    const key = lineKey(r);
                    const multiYear = new Set(breakdown.map(b => b.year)).size > 1;
                    const description = multiYear ? `${r.head} (${r.year})` : r.head;
                    return (
                      <tr key={key}>
                        <td style={{ textAlign: "center" }}>{i + 1}</td>
                        <td>{description}<span style={{ marginLeft: 6, fontSize: 10.5, color: "var(--slate-soft)" }}>({r.category})</span></td>
                        <td style={{ textAlign: "center", color: r.due > 0 ? "var(--red)" : "var(--moss)" }} className="mono">৳{money(r.due)}</td>
                        <td style={{ textAlign: "center" }}>
                          {r.due > 0 ? (
                            <input type="number" placeholder="0" value={waiverAmounts[key] || ""} onChange={(e) => setWaiverAmounts(p => ({ ...p, [key]: e.target.value }))} style={{ width: 90, padding: "6px 9px", border: "1px solid var(--line)", borderRadius: 6, fontSize: 13, textAlign: "center", margin: "0 auto", display: "block" }} />
                          ) : <span style={{ color: "var(--slate-soft)", fontSize: 12 }}>—</span>}
                        </td>
                        <td style={{ textAlign: "center" }}>
                          {r.due > 0 ? (
                            <input type="number" placeholder="0" value={payAmounts[key] || ""} onChange={(e) => setPayAmounts(p => ({ ...p, [key]: e.target.value }))} style={{ width: 90, padding: "6px 9px", border: "1px solid var(--line)", borderRadius: 6, fontSize: 13, textAlign: "center", margin: "0 auto", display: "block" }} />
                          ) : <span style={{ color: "var(--slate-soft)", fontSize: 12 }}>—</span>}
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>
          )}

          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <div style={{ minWidth: 240 }}>
              <div className="kv-row"><span className="k">Subtotal</span><span className="v mono">৳{money(subtotal)}</span></div>
              <div className="kv-row"><span className="k">Waiver</span><span className="v mono">৳{money(waiverTotal)}</span></div>
              <div className="kv-row"><span className="k">Paid</span><span className="v mono">৳{money(paymentTotal)}</span></div>
              <div className="kv-row" style={{ fontSize: 15 }}><span className="k">Due</span><span className="v" style={{ color: dueAfter > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(dueAfter)}</span></div>
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

function formatAddress(addr) {
  if (!addr || typeof addr !== "object") return "—";
  const parts = [
    addr.co && `C/O: ${addr.co}`,
    addr.village && `Vill: ${addr.village}`,
    addr.union && `Union: ${addr.union}`,
    addr.ward && `Ward No: ${addr.ward}`,
    addr.po && `P/O: ${addr.po}`,
    addr.upazila && `Upazila: ${addr.upazila}`,
    addr.district && `District: ${addr.district}`,
  ].filter(Boolean);
  return parts.length ? parts.join(", ") : "—";
}

function StudentFormModal({ student, students, onClose, onSave, config }) {
  // Defensive normalization: a date-like field can come back from the sheet as a full
  // ISO datetime (or even a native Date once JSON-serialized) instead of the plain
  // "YYYY-MM-DD" a date input needs — trim it so Admission Date/DOB never show blank.
  const normalizeDates = (s) => ({
    ...s,
    admissionDate: s.admissionDate ? String(s.admissionDate).slice(0, 10) : s.admissionDate,
    dob: s.dob ? String(s.dob).slice(0, 10) : s.dob,
  });
  const [form, setForm] = useState(migrateAddressFields(normalizeDates(student)));
  const [showPrint, setShowPrint] = useState(false);
  const [saving, setSaving] = useState(false);
  usePrintChrome({ hideFooter: true }); // admission form prints its own footer with slogan + credit
  const set = (k) => (e) => setForm({ ...form, [k]: e && e.target ? e.target.value : e });

  function handleClassChange(e) {
    const className = e.target.value;
    setForm(f => {
      const next = { ...f, className };
      // Auto-fill next roll for the newly selected class — only for brand-new admissions,
      // so editing an existing student's class never silently overwrites their roll.
      if (!f.id) next.roll = String(nextRollForClass(students, className, f.id));
      return next;
    });
  }

  function handlePresentChange(field, val) {
    setForm(f => {
      const next = { ...f, [addrKey("present", field)]: val };
      if (f.sameAsPresent) next[addrKey("permanent", field)] = val;
      return next;
    });
  }
  function handlePermanentChange(field, val) {
    setForm(f => ({ ...f, [addrKey("permanent", field)]: val }));
  }
  function toggleSameAddress(e) {
    const checked = e.target.checked;
    setForm(f => {
      const next = { ...f, sameAsPresent: checked };
      if (checked) ADDRESS_FIELDS.forEach(field => { next[addrKey("permanent", field)] = f[addrKey("present", field)]; });
      return next;
    });
  }

  // Single Save action: saves the record, confirms it actually persisted, then shows the
  // print preview so there's always a clear on-screen confirmation that the update went through.
  async function handleSave() {
    setSaving(true);
    const saved = await onSave(form);
    setSaving(false);
    if (saved) {
      setForm(migrateAddressFields(normalizeDates(saved)));
      setShowPrint(true);
    }
  }

  return (
    <Modal title={student.id ? "Edit Student" : "New Admission"} onClose={onClose} size="lg"
      footer={showPrint ? (
        <>
          <button className="btn" onClick={() => setShowPrint(false)}>← Back to Form</button>
          <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print Admission Form (A4)</button>
        </>
      ) : (
        <>
          <button className="btn" onClick={onClose}>Cancel</button>
          <button className="btn btn-primary" onClick={handleSave} disabled={saving}>{saving ? "Saving…" : "Save"}</button>
        </>
      )}>
      {showPrint ? (
        <AdmissionFormPrint student={form} config={config} />
      ) : (
      <div>
      <div className="form-grid">
        <Field label="Student ID" hint="auto-generated"><input type="text" value={form.studentId} readOnly style={{ background: "var(--paper)", fontWeight: 700 }} className="mono" /></Field>
        <Field label="Form No." hint="auto-generated"><input type="text" value={form.admissionFormNo || ""} readOnly style={{ background: "var(--paper)", fontWeight: 700 }} className="mono" /></Field>
        <Field label="Admission Date"><input type="date" value={(form.admissionDate || "").slice(0, 10)} onChange={set("admissionDate")} /></Field>
        <Field label="Class" hint="current class"><select value={form.className} onChange={handleClassChange}>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Section"><select value={form.section} onChange={set("section")}>{SECTIONS.map(s => <option key={s}>{s}</option>)}</select></Field>
        <Field label="Subject"><select value={form.subjectGroup || SUBJECT_GROUPS[0]} onChange={set("subjectGroup")}>{SUBJECT_GROUPS.map(s => <option key={s}>{s}</option>)}</select></Field>
        <Field label="Roll Number" hint={!form.id ? "auto-filled from class" : ""}><input type="text" value={form.roll} onChange={set("roll")} /></Field>
        <Field label="Student Name"><input type="text" value={form.name} onChange={set("name")} placeholder="Student's full name" /></Field>
        <Field label="Father's Name"><input type="text" value={form.fatherName} onChange={set("fatherName")} /></Field>
        <Field label="Mother's Name"><input type="text" value={form.motherName} onChange={set("motherName")} /></Field>
        <Field label="Date of Birth"><input type="date" value={(form.dob || "").slice(0, 10)} onChange={set("dob")} /></Field>
        <Field label="Age" hint="auto-calculated"><input type="text" value={calcAge(form.dob, form.admissionDate)} readOnly style={{ background: "var(--paper)" }} /></Field>
        <Field label="Gender"><select value={form.gender} onChange={set("gender")}>{GENDERS.map(g => <option key={g}>{g}</option>)}</select></Field>
        <Field label="Session" hint="e.g. 2025-2026"><input type="text" value={form.session || ""} onChange={set("session")} /></Field>

function studentStatusUrl(studentId) {
  const base = window.location.origin + window.location.pathname;
  return `${base}?sid=${encodeURIComponent(studentId)}`;

// Shrinks the ID Card school-name font so long names still fit on exactly one line —
// no ellipsis/truncation, the text itself gets smaller instead. Uses the actual rendered
// width (scrollWidth vs clientWidth) rather than a character-count guess, so it's correct
// for every name/font/zoom combination and can never spill outside the card.
function AutoFitLine({ text, className, minPt = 5, maxPt = 12, style }) {
  const ref = useRef(null);
  const [fontSize, setFontSize] = useState(maxPt);
  useLayoutEffect(() => {
    const el = ref.current;
    if (!el) return;
    let size = maxPt;
    el.style.fontSize = size + "pt";
    let guard = 0;
    while (el.scrollWidth > el.clientWidth + 0.5 && size > minPt && guard < 60) {
      size -= 0.25;
      el.style.fontSize = size + "pt";
      guard++;
    }
    setFontSize(size);
  }, [text, minPt, maxPt]);
  return <div ref={ref} className={className} style={{ ...style, fontSize: fontSize + "pt" }}>{text}</div>;
}

function CardTypeFlow({ type, students, promotions, config, onBack }) {
  const meta = CARD_TYPES[type];
  const [mode, setMode] = useState("single");
  const [examChoice, setExamChoice] = useState(EXAM_NAME_OPTIONS[0]);
  const [examYear, setExamYear] = useState(String(CURRENT_YEAR));
  const examName = `${examChoice} - ${examYear}`;
  const [selected, setSelected] = useState(null);
  const [query, setQuery] = useState("");
  const [classFilter, setClassFilter] = useState("One");
  const [sectionFilter, setSectionFilter] = useState("");
  // ID Card and Seat Plan: no shared watermark/footer at all (too small, no room).
  // Admit Card: keep the watermark, but it already prints its own credit line, so skip the shared footer.
  usePrintChrome({ hideWatermark: type === "id" || type === "seat", hideFooter: true });

  // ID Card / Admit Card / Seat Plan always reflect a student's CURRENT class/roll/section/
  // subject/session — sourced from the Promotion sheet, not the original Admission Form values.
  const liveStudents = students.map(s => ({ ...s, ...getCurrentStatus(s, promotions) }));

  const matches = query.trim() ? liveStudents.filter(s =>
    str(s.name).toLowerCase().includes(query.toLowerCase())
    || str(s.roll).toLowerCase().includes(query.toLowerCase())
    || str(s.studentId).toLowerCase().includes(query.toLowerCase())
  ).slice(0, 20) : [];

  const classList = liveStudents.filter(s => s.className === classFilter && (!sectionFilter || s.section === sectionFilter));

  function handlePrint() { window.print(); }

  function renderCard(student) {
    if (type === "id") return <StudentIdCardPhysical key={student.id} student={student} config={config} />;
    if (type === "admit") return <AdmitCardPhysical key={student.id} student={student} config={config} examName={examName} />;
    return <SeatCardPhysical key={student.id} student={student} config={config} examName={examName} />;
  }

  const readyToShow = !meta.needsExam || examChoice;

  return (
    <Modal title={meta.title} onClose={onBack} size="lg"
      footer={<>
        <button className="btn" onClick={onBack}>← Back to All Card</button>
        {readyToShow && <button className="btn btn-primary" onClick={handlePrint}><Icon.print />Print</button>}
      </>}>
      <div className="tabs no-print" style={{ marginBottom: 16 }}>

        <div className="no-print form-grid cols-2" style={{ marginBottom: 16 }}>
          <Field label="Exam Name">
            <select value={examChoice} onChange={(e) => setExamChoice(e.target.value)}>
              {EXAM_NAME_OPTIONS.map(o => <option key={o} value={o}>{o}</option>)}
            </select>
          </Field>
          <Field label="Year"><input type="number" value={examYear} onChange={(e) => setExamYear(e.target.value)} /></Field>
        </div>
      )}

      {!readyToShow ? (
        <EmptyState title="Enter exam name first" sub="The exam name is required before selecting students." />
      ) : (
        <>
          {mode === "single" && (
            <div className="no-print" style={{ marginBottom: 16 }}>
              <Field label="Search Student" hint="by name, roll, or Student ID">
                <input className="search-input" value={query} onChange={(e) => { setQuery(e.target.value); setSelected(null); }} placeholder="Type to search…" />
              </Field>
              {matches.length > 0 && (
                <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 8 }}>
                  {matches.map(s => (
                    <button key={s.id} className={`chip ${selected && selected.id === s.id ? "active" : ""}`} onClick={() => { setSelected(s); setQuery(""); }}>{s.name} · {s.className}{s.section}</button>
                  ))}

          {mode === "class" && (
            <div className="no-print search-row" style={{ marginBottom: 16 }}>
              <select className="filter-select" value={classFilter} onChange={(e) => setClassFilter(e.target.value)}>
                {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
