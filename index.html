// Protyon (প্রত্যয়নপত্র / Certificate): a log of every certificate issued so far (who + when),
// with the actual form living behind a button (opens/closes on click, per spec) rather than
// always being on screen. Selecting a Student ID/Name in the form auto-fills Name, Father's
// Name, Mother's Name, and Permanent Address from that student's record.
function ProtyonModule({ students, promotions, certificates, config, save, remove, onBack }) {
  const [formOpen, setFormOpen] = useState(false);
  const [printCert, setPrintCert] = useState(null);
  const sorted = certificates.slice().sort((a, b) => new Date(b.date || b.createdAt || 0) - new Date(a.date || a.createdAt || 0));

  async function handleDelete(c) {
    if (!confirm(`Delete this certificate record for ${c.name}?`)) return;
    await remove("certificates", c.id);
  }

  return (
    <div>
      <div className="section-actions no-print">
        <button className="btn" onClick={onBack}>← Back to All Card</button>
        <button className="btn btn-primary" onClick={() => setFormOpen((o) => !o)}><Icon.plus />{formOpen ? "Close Certificate Form" : "Open Certificate Form"}</button>
      </div>

      {formOpen && (
        <CertificateFormModal students={students} promotions={promotions} certificates={certificates} config={config}
          onSave={save} onClose={() => setFormOpen(false)}
          onIssued={(cert) => { setFormOpen(false); setPrintCert(cert); }} />
      )}

      <div className="card card-flush">
        {sorted.length === 0 ? (
          <EmptyState title="No certificates issued yet" sub={`Use "Open Certificate Form" above to issue and print a Protyon.`} />
        ) : (
          <div className="table-wrap">
            <table>
              <thead>
                <tr><th>Certificate No</th><th>Student ID</th><th>Name</th><th>Class</th><th>Date</th><th className="no-print"></th></tr>
              </thead>
              <tbody>
                {sorted.map(c => (
                  <tr key={c.id}>
                    <td className="mono">{c.certificateNo || "—"}</td>
                    <td className="mono">{c.studentDisplayId || "—"}</td>
                    <td>{c.name}</td>
                    <td>{c.className || "—"}{c.section ? ` — ${c.section}` : ""}</td>
                    <td>{fmtDate(c.date)}</td>
                    <td className="no-print">
                      <div style={{ display: "flex", gap: 6 }}>
                        <button className="btn btn-sm btn-icon" title="Print" onClick={() => setPrintCert(c)}><Icon.print /></button>
                        <button className="btn btn-sm btn-icon" title="Delete" onClick={() => handleDelete(c)}><Icon.trash /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>

      {printCert && <CertificatePrintModal certificate={printCert} config={config} onClose={() => setPrintCert(null)} />}
    </div>
  );
}

function CertificateFormModal({ students, promotions, certificates, config, onSave, onClose, onIssued }) {
  const [selected, setSelected] = useState(null);
  const [query, setQuery] = useState("");
  const [saving, setSaving] = useState(false);
  const toast = useToast();

  const matches = query.trim() ? students.filter(s =>
    str(s.name).toLowerCase().includes(query.toLowerCase())
    || str(s.studentId).toLowerCase().includes(query.toLowerCase())
  ).slice(0, 20) : [];

  const current = selected ? getCurrentStatus(selected, promotions) : null;

  async function handleIssue() {
    if (!selected) return;
    setSaving(true);
    const today = new Date().toISOString().slice(0, 10);
    const record = {
      id: generateCertificateNo(certificates),
      certificateNo: generateCertificateNo(certificates),
      studentId: selected.id,
      studentDisplayId: selected.studentId,
      name: selected.name,
      fatherName: selected.fatherName,
      motherName: selected.motherName,
      permanentAddress: formatPermanentAddress(selected),
      className: current.className,
      section: current.section,
      roll: current.roll,
      date: today,
    };
    const saved = await onSave("certificates", record);
    setSaving(false);
    toast && toast("Certificate issued", "success");
    onIssued(saved || record);
  }

  return (
    <Modal title="Certificate Form — Protyon" onClose={onClose} size="lg"
      footer={selected ? (
        <>
          <button className="btn" onClick={() => setSelected(null)}>← Search Another Student</button>
          <button className="btn btn-primary" disabled={saving} onClick={handleIssue}>{saving ? "Saving…" : "Issue & Print"}</button>
        </>
      ) : (
        <button className="btn" onClick={onClose}>Close</button>
      )}>
      {!selected ? (
        <div>
          <Field label="Search Student" hint="by Student ID or Name">
            <input className="search-input" autoFocus value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Type to search…" />
          </Field>
          <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
            {matches.map(s => { const c = getCurrentStatus(s, promotions); return (
              <button key={s.id} className="btn" style={{ justifyContent: "flex-start", textAlign: "left" }} onClick={() => setSelected(s)}>
                <strong style={{ marginRight: 8 }}>{s.name}</strong>
                <span style={{ color: "var(--slate-soft)", fontSize: 12.5 }}>{c.className}{c.section} · <span className="mono">{s.studentId}</span></span>
              </button>
            ); })}
            {query.trim() && matches.length === 0 && <EmptyState title="No matching students" sub="Try a different name or Student ID." />}
            {!query.trim() && <EmptyState title="Search for a student" sub="Type a name or Student ID above — the rest of the certificate fills in automatically." />}
          </div>
        </div>
      ) : (
        <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
          <Field label="Student ID" hint="auto-filled"><input type="text" value={selected.studentId || ""} readOnly style={{ background: "var(--paper)" }} className="mono" /></Field>
          <Field label="Name" hint="auto-filled"><input type="text" value={selected.name || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Father's Name" hint="auto-filled"><input type="text" value={selected.fatherName || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Mother's Name" hint="auto-filled"><input type="text" value={selected.motherName || ""} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Permanent Address" hint="auto-filled"><input type="text" value={formatPermanentAddress(selected) || "—"} readOnly style={{ background: "var(--paper)" }} /></Field>
          <Field label="Class" hint="current"><input type="text" value={`${current.className || "—"} ${current.section || ""}`} readOnly style={{ background: "var(--paper)" }} /></Field>
        </div>
      )}
    </Modal>
  );
}

// The certificate itself — plain A4 Landscape page (via .print-landscape, no border/frame),
// font-size 16 (.protyon-print), fully in English, background image from Settings drawn as a
// real <img> with object-fit:contain (not a CSS background-image) — a real <img> always shows
// up in print regardless of the browser's "print background graphics" setting, and
// object-fit:contain shows the WHOLE design without cropping its left/right edges the way
// background-size:cover would if the uploaded image isn't exactly A4-landscape shaped. No
// shared footer/credit line at all (hideFooter, and this component draws no credit line of
// its own, unlike Admission Form/Invoice/Admit Card which draw their own copy of it). Only the
// Principal signs — there's deliberately no "Prepared By" line.
function CertificatePrint({ certificate: c, config }) {
  usePrintChrome({ hideWatermark: true, hideFooter: true });
  return (
    <div className="print-landscape">
      <div className="doc-preview protyon-print">
        {config.certificateBgUrl && <img src={config.certificateBgUrl} alt="" className="protyon-bg-img" />}
        <div className="protyon-content">
          <div className="protyon-title">Certificate</div>
          <div className="protyon-title-underline" />
          <div className="protyon-meta-row">
            <div>No: <b className="mono">{c.certificateNo}</b></div>
            <div>Date: <b>{fmtDate(c.date)}</b></div>
          </div>
          <div className="protyon-body">
            This is to certify that <b>{c.name}</b>, son/daughter of <b>{c.fatherName || "—"}</b> and <b>{c.motherName || "—"}</b>,
            permanent address <b>{c.permanentAddress || "—"}</b>, is a regular/former student of {config.schoolName || "this institution"}
            {c.className ? <> (Class: {c.className}{c.section ? `, Section: ${c.section}` : ""}{c.roll ? `, Roll: ${c.roll}` : ""})</> : null}.
            Student ID: <b className="mono">{c.studentDisplayId}</b>. To the best of our knowledge, his/her moral character and conduct
            have been found satisfactory. We wish him/her every success in life.
          </div>
          <div className="protyon-signatures">
            <div className="protyon-sig"><div className="protyon-sig-line">Principal{config.principalName ? <><br />{config.principalName}</> : null}</div></div>
          </div>
        </div>
      </div>
    </div>
  );
}

  const filtered = teachers.filter(t => !query || str(t.name).toLowerCase().includes(query.toLowerCase()));

  function openNew() { setEditing(emptyTeacher(teachers)); }
  async function handleSave(record) { const saved = await save("teachers", record); setEditing(null); return saved; }
  function handlePrint() { window.print(); }

  return (
    <div>
      <div className="section-actions">
        <button className="btn btn-primary no-print" onClick={openNew}><Icon.plus />Add Staff</button>

        <div className="card card-flush">
          <div style={{ padding: "16px 18px 0" }}>

            </div>
          </div>

                    const due = teacherDueFromRules(t, teacherFeeRules);
                    return (
                      <tr key={t.id}>
                        <td className="mono">{t.staffId || t.id}</td>
                        <td>{t.name}</td>
                        <td>{t.designation}</td>
                        <td>{t.subject || "—"}</td>
                        <td>{t.phone || "—"}</td>

                        <td><span className={`badge ${t.status === "Active" ? "badge-green" : "badge-slate"}`}>{t.status}</span></td>

                            <button className="btn btn-sm btn-icon" title="Delete" onClick={() => { if (confirm(`Delete ${t.name}?`)) remove("teachers", t.id); }}><Icon.trash /></button>

                      </tr>

              </table>

      {tab === "letter" && <TeacherPicker teachers={teachers} label="Select staff for Join / Resign Letter" onPick={(t) => setDocTarget({ type: "letter", teacher: t })} />}
      {tab === "idcard" && <TeacherPicker teachers={teachers} label="Select staff for ID Card" onPick={(t) => setDocTarget({ type: "id", teacher: t })} />}
      {tab === "salary" && <TeacherPicker teachers={teachers} label="Select staff for Salary Invoice" onPick={(t) => setDocTarget({ type: "salary", teacher: t })} />}

      {editing && <TeacherFormModal teacher={editing} onClose={() => setEditing(null)} onSave={handleSave} config={config} teacherFeeRules={teacherFeeRules} />}

function TeacherSalaryInvoiceModal({ teacher, config, teacherFeeRules, onSave, onClose }) {
  const [payAmounts, setPayAmounts] = useState({});
  const [saving, setSaving] = useState(false);
  const [showPrint, setShowPrint] = useState(false);
  const toast = useToast();
  const breakdown = teacherFeeBreakdown(teacher, teacherFeeRules);
  const totalCharged = sumBy(breakdown, r => r.charged);
  const totalPaid = sumBy(breakdown, r => r.paid);
  const totalDue = sumBy(breakdown, r => r.due);

  async function submitPayments() {
    const entries = Object.entries(payAmounts).filter(([head, amt]) => Number(amt) > 0);
    if (entries.length === 0) { toast && toast("Enter at least one payment amount", "error"); return; }
    setSaving(true);
    const newPayments = entries.map(([head, amt]) => ({ head, amount: Number(amt), date: new Date().toISOString().slice(0,10) }));
    const updated = { ...teacher, payments: [...(teacher.payments || []), ...newPayments] };
    await onSave(updated);
    setPayAmounts({});
    setSaving(false);
    toast && toast("Payments submitted", "success");
  }

  return (
    <Modal title={`Salary Invoice — ${teacher.name}`} onClose={onClose} size="lg"
      footer={showPrint ? (
        <>
          <button className="btn" onClick={() => setShowPrint(false)}>← Back</button>
          <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print / Save as PDF</button>
        </>
      ) : (
        <>
          <button className="btn" onClick={onClose}>Close</button>
          <button className="btn" onClick={() => setShowPrint(true)}><Icon.print />Print Invoice</button>
          <button className="btn btn-primary" disabled={saving} onClick={submitPayments}>Submit Payments</button>
        </>
      )}>
      {showPrint ? (
        <div className="doc-preview">
          <div style={{ display: "flex", justifyContent: "space-between", borderBottom: "2px solid var(--moss-deep)", paddingBottom: 14, marginBottom: 18 }}>
            <div>
              <h3 style={{ fontSize: 20 }}>{config.schoolName || "School Name"}</h3>
              <div style={{ fontSize: 12, color: "var(--slate-soft)" }}>Salary & Allowance Invoice</div>
            </div>
            <div style={{ textAlign: "right", fontSize: 12.5 }}>Date: {fmtDate(new Date().toISOString())}</div>
          </div>
          <FieldRow name="Staff Name" value={teacher.name} />
          <FieldRow name="Designation" value={teacher.designation} />
          <table style={{ width: "100%", margin: "16px 0" }}>
            <thead><tr><th>Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th></tr></thead>
            <tbody>
              {breakdown.map(r => (
                <tr key={r.head}>
                  <td>{r.head}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.due)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <div style={{ minWidth: 220 }}>
              <FieldRow name="Total Payable" value={"৳" + money(totalCharged)} />
              <FieldRow name="Total Paid" value={"৳" + money(totalPaid)} />
              <FieldRow name="Balance Due" value={<strong>৳{money(totalDue)}</strong>} />
            </div>
          </div>
        </div>
      ) : (
        <div>
          <FieldRow name="Staff Name" value={teacher.name} />
          <FieldRow name="Designation" value={teacher.designation} />
          {breakdown.length === 0 ? (
            <EmptyState title="No fee scale set for this designation" sub={`Add salary components for ${teacher.designation} in Master Fee → Teacher Fee Scale.`} />
          ) : (
            <div className="table-wrap" style={{ marginTop: 14 }}>
              <table style={{ width: "100%" }}>
                <thead><tr><th>Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th><th>Pay Amount</th></tr></thead>
                <tbody>
                  {breakdown.map(r => (
                    <tr key={r.head}>
                      <td>{r.head}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                      <td style={{ textAlign: "right", color: r.due > 0 ? "var(--red)" : "var(--moss)" }} className="mono">৳{money(r.due)}</td>
                      <td>
                        {r.due > 0 ? (
                          <input type="number" placeholder="0" value={payAmounts[r.head] || ""} onChange={(e) => setPayAmounts(p => ({ ...p, [r.head]: e.target.value }))} style={{ width: 100, padding: "6px 9px", border: "1px solid var(--line)", borderRadius: 6, fontSize: 13 }} />
                        ) : <span style={{ color: "var(--slate-soft)", fontSize: 12 }}>—</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 14 }}>
            <div style={{ minWidth: 220 }}>
              <FieldRow name="Total Payable" value={"৳" + money(totalCharged)} />
              <FieldRow name="Total Paid" value={"৳" + money(totalPaid)} />
              <FieldRow name="Balance Due" value={<strong style={{ color: totalDue > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(totalDue)}</strong>} />
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

// Completely separate from regular Finance: its own collection/sheet, its own ZKT- numbering
// series, and its own running Fund balance (Jakat income adds to the fund, Jakat expense
// subtracts from it) — reuses the exact same Invoice/Expense Voucher form & print layouts as
// regular Finance via the docPrefix/title/noLabel/docTitle override props.
function ZakatModule({ data, save, remove, config, initialTab }) {
  const [tab, setTab] = useState(initialTab || "income");
  useEffect(() => { if (initialTab) setTab(initialTab); }, [initialTab]);
  const [editing, setEditing] = useState(null);
  const [docTarget, setDocTarget] = useState(null);
  const zakat = data.zakat || [];
  const list = zakat.filter(f => f.type === tab).sort((a, b) => new Date(b.date) - new Date(a.date));
  const isIncome = tab === "income";

  const fundIncome = sumBy(zakat.filter(f => f.type === "income"), f => f.amount);
  const fundExpense = sumBy(zakat.filter(f => f.type === "expense"), f => f.amount);
  const fundBalance = fundIncome - fundExpense;

  return (
    <div>
      <div className="section-actions">
        <button className="btn btn-primary" onClick={() => setEditing(emptyZakat(tab, zakat))}><Icon.plus />New {isIncome ? "Jakat Invoice" : "Jakat Expense"}</button>
      </div>

      <div className="card" style={{ marginBottom: 18 }}>
        <div className="kv-row"><span className="k">Total Jakat Collected</span><span className="v">৳{money(fundIncome)}</span></div>
        <div className="kv-row"><span className="k">Total Jakat Distributed</span><span className="v">৳{money(fundExpense)}</span></div>
        <div className="kv-row"><span className="k">Jakat Fund Balance</span><span className="v" style={{ fontWeight: 700, color: fundBalance >= 0 ? "var(--moss)" : "var(--red)" }}>৳{money(fundBalance)}</span></div>
      </div>

      <div className="card card-flush">
        {list.length === 0 ? <EmptyState title={`No ${isIncome ? "Jakat invoices" : "Jakat expenses"} yet`} sub="Add a new entry to get started." /> : (
          <div className="table-wrap">
            <table>
              <thead>
                {isIncome ? (
                  <tr><th>Jakat Invoice No</th><th>Date</th><th>Provider</th><th style={{ textAlign: "right" }}>Amount</th><th></th></tr>
                ) : (
                  <tr><th>Jakat Expense No</th><th>Date</th><th>Spender</th><th style={{ textAlign: "right" }}>Subtotal</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th><th></th></tr>
                )}
              </thead>
              <tbody>
                {list.map(f => (
                  <tr key={f.id}>
                    <td className="mono">{f.docNo || "—"}</td>
                    <td>{fmtDate(f.date)}</td>
                    <td>{isIncome ? (f.provider || "—") : (f.spender || "—")}</td>
                    {isIncome ? (
                      <td className="mono" style={{ textAlign: "right" }}>৳{money(f.amount)}</td>
                    ) : (
                      <>
                        <td className="mono" style={{ textAlign: "right" }}>৳{money(f.subtotal != null ? f.subtotal : f.amount)}</td>
                        <td className="mono" style={{ textAlign: "right" }}>৳{money(f.paid)}</td>

// Shared editable line-item table for both the Invoice and the Expense Voucher forms.
// This <table> is the only bordered element the two forms introduce — every other field
// keeps the app's normal plain-input look.
function FinanceItemRows({ rows, onChange, descriptionMode }) {
  function updateRow(i, key, val) {
    const next = [...rows];
    next[i] = { ...next[i], [key]: val };
    onChange(next);
  }
  function addRow() { onChange([...rows, emptyFinanceRow(descriptionMode)]); }
  function removeRow(i) { if (rows.length > 1) onChange(rows.filter((_, idx) => idx !== i)); }

  return (
    <>
      <div className="item-table-wrap">
        <table className="item-form-table">
          <thead>
            <tr><th style={{ width: 38 }}>Sl No</th><th>Description</th><th style={{ width: 130 }}>Amount</th><th style={{ width: 34 }}></th></tr>
          </thead>
          <tbody>
            {rows.map((r, i) => (
              <tr key={i}>
                <td className="itf-sl">{i + 1}</td>
                <td>
                  {descriptionMode === "select" ? (
                    <select value={r.description} onChange={(e) => updateRow(i, "description", e.target.value)}>
                      {EXPENSE_HEADS.map(h => <option key={h}>{h}</option>)}
                    </select>
                  ) : (
                    <input type="text" value={r.description} placeholder="Item / description" onChange={(e) => updateRow(i, "description", e.target.value)} />
                  )}
                </td>
                <td className="itf-amt"><input type="number" value={r.amount} onChange={(e) => updateRow(i, "amount", e.target.value)} /></td>
                <td className="itf-remove">
                  <button type="button" className="btn btn-sm btn-icon" disabled={rows.length <= 1} onClick={() => removeRow(i)} title="Remove row"><Icon.trash /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <button type="button" className="link-btn item-table-add-row" onClick={addRow}>+ Add row</button>
    </>
  );
}

function InvoiceFormModal({ record, financeList, onClose, onSave, docPrefix, title, noLabel }) {
  const [form, setForm] = useState(record);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const subtotal = sumBy(form.rows, r => r.amount);

  function handleSave() {
    const rows = form.rows.filter(r => str(r.description).trim() || Number(r.amount) > 0);
    if (rows.length === 0) { alert("Add at least one item row."); return; }
    const docNo = form.docNo || generateFinanceDocNo(financeList, "income", docPrefix);
    onSave({ ...form, rows, docNo, amount: sumBy(rows, r => r.amount), head: "Invoice" });
  }

  return (
    <Modal title={title || "Invoice"} onClose={onClose}
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={handleSave}>Save</button></>}>
      <div className="form-grid" style={{ marginBottom: 18 }}>
        <Field label={noLabel || "Invoice No"}><input type="text" className="mono" value={form.docNo} readOnly /></Field>
        <Field label="Date"><input type="date" value={(form.date || "").slice(0, 10)} onChange={set("date")} /></Field>

      <label style={{ fontSize: 12, fontWeight: 600, color: "var(--slate)", display: "block", marginBottom: 8 }}>Items</label>

        <div className="item-table-foot-row total" style={{ minWidth: 220 }}>
          <span>Total</span><span className="mono">৳{money(subtotal)}</span>
        </div>
      </div>
    </Modal>
  );
}

function ExpenseFormModal({ record, financeList, onClose, onSave, docPrefix, title, noLabel }) {
  const [form, setForm] = useState(record);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });
  const subtotal = sumBy(form.rows, r => r.amount);
  const paid = Number(form.paid) || 0;
  const due = Math.max(0, subtotal - paid);

  function handleSave() {
    const rows = form.rows.filter(r => str(r.description).trim() || Number(r.amount) > 0);
    if (rows.length === 0) { alert("Add at least one item row."); return; }
    const sub = sumBy(rows, r => r.amount);
    const docNo = form.docNo || generateFinanceDocNo(financeList, "expense", docPrefix);
    const uniqueDesc = [...new Set(rows.map(r => r.description).filter(Boolean))];
    const head = uniqueDesc.length === 1 ? uniqueDesc[0] : (uniqueDesc.length > 1 ? "Mixed" : "Expense");
    onSave({ ...form, rows, docNo, subtotal: sub, paid: form.paid, due: Math.max(0, sub - (Number(form.paid) || 0)), amount: sub, head });
  }

  return (
    <Modal title={title || "Expense Voucher"} onClose={onClose}
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={handleSave}>Save</button></>}>
      <div className="form-grid" style={{ marginBottom: 18 }}>
        <Field label={noLabel || "Voucher No"}><input type="text" className="mono" value={form.docNo} readOnly /></Field>
        <Field label="Date"><input type="date" value={(form.date || "").slice(0, 10)} onChange={set("date")} /></Field>
        <Field label="Spender" span2><input type="text" value={form.spender} onChange={set("spender")} placeholder="Who is spending / requesting" /></Field>
      </div>

      <label style={{ fontSize: 12, fontWeight: 600, color: "var(--slate)", display: "block", marginBottom: 8 }}>Items</label>
      <FinanceItemRows rows={form.rows} onChange={(rows) => setForm({ ...form, rows })} descriptionMode="select" />

      <div style={{ display: "flex", justifyContent: "flex-end" }}>
        <div style={{ minWidth: 240 }}>
          <div className="item-table-foot-row"><span>Subtotal</span><span className="mono">৳{money(subtotal)}</span></div>
          <div className="item-table-foot-row">
            <span>Paid</span>
            <input type="number" value={form.paid} onChange={set("paid")} />
          </div>
          <div className="item-table-foot-row total">
            <span>Due</span><span className="mono" style={{ color: due > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(due)}</span>
          </div>
        </div>
      </div>
    </Modal>
  );
}

/* =========================================================
   DUE MODULE
   ========================================================= */
function DueModule({ data, config, initialTab }) {
  const [tab, setTab] = useState(initialTab || "students");
  useEffect(() => { if (initialTab) setTab(initialTab); }, [initialTab]);
  const students = data.students || [];
  const teachers = data.teachers || [];
  const invoices = data.invoices || [];
  const promotions = data.promotions || [];
  const classHistories = data.classHistories || [];
  const activations = data.activations || [];
  const classFeeRules = (data.fees || []).filter(f => f.kind === "class");
  const teacherFeeRules = (data.fees || []).filter(f => f.kind === "teacher");
  const todayIso = new Date().toISOString().slice(0, 10);
  const [classFilter, setClassFilter] = useState("");
  const [studentAsOf, setStudentAsOf] = useState(todayIso);
  const [teacherAsOf, setTeacherAsOf] = useState(todayIso);
  const [teacherFilter, setTeacherFilter] = useState(""); // "" = all teachers, else a teacher id

  // Filter by CURRENT class (from the Promotion record), not the original admission-time class,
  // so a promoted student correctly shows up under their new class here. Dues are computed from
  // each student's Admission Date through the selected date, minus every payment made to date.
  const classStudents = students.filter(s => !classFilter || getCurrentStatus(s, promotions).className === classFilter);
  const studentRows = classStudents.map(s => ({ ...s, breakdown: studentFeeBreakdown(s, classFeeRules, invoices, promotions, classHistories, activations, studentAsOf), due: studentDueFromRules(s, classFeeRules, invoices, promotions, classHistories, activations, studentAsOf) }));
  // union of all fee heads that appear for the selected class as of the selected date
  const allHeadsInView = [...new Set(studentRows.flatMap(s => s.breakdown.map(r => r.head)))];

  // Teacher dues, from each teacher's Join Date through the selected date, minus salary payments.
  const teacherBase = teacherFilter ? teachers.filter(t => t.id === teacherFilter) : teachers;
  const teacherDues = teacherBase
    .map(t => ({ ...t, breakdown: teacherFeeBreakdown(t, teacherFeeRules, teacherAsOf), due: teacherDueFromRules(t, teacherFeeRules, teacherAsOf) }))
    .filter(t => teacherFilter || t.due > 0); // when a specific teacher is picked, show them even if fully paid

  function handlePrint() { window.print(); }

  return (
    <div>

      {/* Section switching is handled entirely by the sidebar's Due List submenu now. */}

      {tab === "students" && (
        <div className="card card-flush print-landscape">
          <div style={{ padding: "16px 18px 0" }} className="search-row no-print">
            <select className="filter-select" value={classFilter} onChange={(e) => setClassFilter(e.target.value)}>
              <option value="">Select a Class</option>
              {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <input type="date" className="filter-select" style={{ maxWidth: 170 }} value={studentAsOf} onChange={(e) => setStudentAsOf(e.target.value)} />
            {classFilter && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <div style={{ padding: "12px 18px 0" }}>
            <PrintDocHead config={config} headline={`Student Dues — ${classFilter || "All Classes"} (as of ${fmtDate(studentAsOf)})`} />
          </div>
          {!classFilter ? (
            <EmptyState title="Select a class and date" sub="Choose a class and an as-of date above to see every student's fee-head-wise dues (Admission Date → selected date, minus payments)." />
          ) : studentRows.length === 0 ? (
            <EmptyState title="No students in this class" sub="Try a different class." />
          ) : allHeadsInView.length === 0 ? (
            <EmptyState title="No fee rules set for this class" sub="Add fee heads for this class in Master Fee first." />
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Student ID</th><th>Roll</th><th>Name</th><th>Section</th>
                    {allHeadsInView.map(h => <th key={h} style={{ textAlign: "right" }}>{h}</th>)}
                    <th style={{ textAlign: "right" }}>Total Due</th>
                  </tr>
                </thead>
                <tbody>
                  {studentRows.map(s => (
                    <tr key={s.id}>
                      <td className="mono">{s.studentId || "—"}</td>
                      <td className="mono">{s.roll || "—"}</td>
                      <td>{s.name}</td>
                      <td>{s.section}</td>
                      {allHeadsInView.map(h => {
                        const due = sumBy(s.breakdown.filter(b => b.head === h), b => b.due);
                        return <td key={h} style={{ textAlign: "right" }} className="mono">{due > 0 ? <span style={{ color: "var(--red)" }}>৳{money(due)}</span> : "—"}</td>;
                      })}
                      <td style={{ textAlign: "right" }} className="mono"><strong style={{ color: s.due > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(s.due)}</strong></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === "teachers" && (
        <div className="card card-flush print-landscape">
          <div style={{ padding: "16px 18px 0" }} className="search-row no-print">
            <select className="filter-select" value={teacherFilter} onChange={(e) => setTeacherFilter(e.target.value)}>
              <option value="">All Teachers</option>
              {teachers.map(t => <option key={t.id} value={t.id}>{t.name} — {t.staffId || t.designation}</option>)}
            </select>
            <input type="date" className="filter-select" style={{ maxWidth: 170 }} value={teacherAsOf} onChange={(e) => setTeacherAsOf(e.target.value)} />
            {teacherDues.length > 0 && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <div style={{ padding: "12px 18px 0" }}>
            <PrintDocHead config={config} headline={`Teacher Dues (as of ${fmtDate(teacherAsOf)})`} />
          </div>
          {teacherDues.length === 0 ? <EmptyState title="No outstanding teacher dues" sub="All salaries are cleared up to this date." /> : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>Staff ID</th><th>Name</th><th>Designation</th><th>Join Date</th><th>Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th></tr></thead>
                <tbody>
                  {teacherDues.flatMap(t => {
                    const rows = teacherFilter ? t.breakdown : t.breakdown.filter(r => r.due > 0);
                    return rows.map((r, i) => (
                      <tr key={t.id + r.head}>
                        {i === 0 ? <td rowSpan={rows.length} className="mono">{t.staffId || "—"}</td> : null}
                        {i === 0 ? <td rowSpan={rows.length}>{t.name}</td> : null}
                        {i === 0 ? <td rowSpan={rows.length}>{t.designation}</td> : null}
                        {i === 0 ? <td rowSpan={rows.length}>{fmtDate(t.joinDate)}</td> : null}
                        <td>{r.head}</td>
                        <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                        <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                        <td style={{ textAlign: "right", color: r.due > 0 ? "var(--red)" : "var(--moss)" }} className="mono">৳{money(r.due)}</td>
                      </tr>
                    ));
                  })}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

/* =========================================================
   MASTER FEE MODULE — year-wise (each fee row belongs to a specific year,
   since fee amounts can differ year to year even for the same class/designation)
   ========================================================= */
const CURRENT_YEAR = new Date().getFullYear();
function feeYearOptions(existingRows) {
  const years = new Set([CURRENT_YEAR - 1, CURRENT_YEAR, CURRENT_YEAR + 1]);
  (existingRows || []).forEach(r => { if (r.year) years.add(Number(r.year)); });
  return [...years].sort((a, b) => b - a);
}

function MasterFeeModule({ data, save, remove, config, initialTab }) {
  const [tab, setTab] = useState(initialTab || "class");
  useEffect(() => { if (initialTab) setTab(initialTab); }, [initialTab]);
  const [editingGroup, setEditingGroup] = useState(null); // { id, kind, year, className, section, designation, items:[{feeType,amount}], note }
  const fees = data.fees || [];
  const classRows = fees.filter(f => f.kind === "class");
  const teacherRows = fees.filter(f => f.kind === "teacher");
  const [yearFilter, setYearFilter] = useState("");

  function openNewGroup() {
    setEditingGroup({
      id: null, kind: tab, year: String(CURRENT_YEAR),
      className: "One", section: "", designation: "Assistant Teacher",
      items: [{ feeType: tab === "class" ? INCOME_HEADS[0] : "Basic Salary", amount: "", category: "Yearly", months: [] }],
      note: "",
    });
  }

  function editGroup(row) {
    const heads = feeHeadsOf(row);
    const cats = feeCategoriesOf(row);
    setEditingGroup({
      id: row.id, kind: row.kind, year: String(row.year || CURRENT_YEAR),
      className: row.className || "One", section: row.section || "", designation: row.designation || "Assistant Teacher",
      items: heads.length > 0
        ? heads.map(h => ({ feeType: h, amount: row[h], category: (cats[h] && cats[h].category) || "Yearly", months: (cats[h] && cats[h].months) || [] }))
        : [{ feeType: row.kind === "class" ? INCOME_HEADS[0] : "Basic Salary", amount: "", category: "Yearly", months: [] }],
      note: row.note || "",
    });
  }

  async function deleteGroup(row) {
    if (!confirm("Delete this entire fee row?")) return;
    await remove("fees", row.id);
  }

  async function saveGroup(group) {
    const row = {
      id: group.id || undefined,
      kind: group.kind,
      year: group.year,
      className: group.kind === "class" ? group.className : undefined,
      section: group.kind === "class" ? group.section : undefined,
      designation: group.kind === "teacher" ? group.designation : undefined,
      note: group.note,
    };
    const cats = {};
    group.items.forEach(item => {
      if (item.feeType && item.amount !== "") {
        row[item.feeType] = item.amount;
        cats[item.feeType] = { category: item.category || "Yearly", months: item.category === "3 Times" ? (item.months || []) : [] };
      }
    });
    row.feeCategories = JSON.stringify(cats);
    await save("fees", row);
    setEditingGroup(null);
  }

  function handlePrint() { window.print(); }

  const classRowsFiltered = yearFilter ? classRows.filter(r => String(r.year) === yearFilter) : classRows;
  const teacherRowsFiltered = yearFilter ? teacherRows.filter(r => String(r.year) === yearFilter) : teacherRows;
  const allClassHeads = [...new Set(classRowsFiltered.flatMap(feeHeadsOf))];
  const allTeacherHeads = [...new Set(teacherRowsFiltered.flatMap(feeHeadsOf))];
  const availableYears = feeYearOptions(fees);

  // Group rows by year for clear year-wise sections
  const classByYear = {};
  classRowsFiltered.forEach(r => { const y = r.year || "—"; (classByYear[y] = classByYear[y] || []).push(r); });
  const teacherByYear = {};
  teacherRowsFiltered.forEach(r => { const y = r.year || "—"; (teacherByYear[y] = teacherByYear[y] || []).push(r); });
  const sortedClassYears = Object.keys(classByYear).sort((a, b) => b - a);
  const sortedTeacherYears = Object.keys(teacherByYear).sort((a, b) => b - a);

  return (
    <div>
      <div className="section-actions">
        <button className="btn btn-primary no-print" onClick={openNewGroup}><Icon.plus />New Fee Group</button>
      </div>
      {/* Section switching is handled entirely by the sidebar's Master Fee submenu now. */}
      <div className="no-print" style={{ marginBottom: 14 }}>
        <select className="filter-select" value={yearFilter} onChange={(e) => setYearFilter(e.target.value)}>
          <option value="">All Years</option>
          {availableYears.map(y => <option key={y} value={y}>{y}</option>)}
        </select>
      </div>

      {tab === "class" && (
        <div className="print-landscape">
          <div className="no-print" style={{ textAlign: "right", marginBottom: 10 }}>
            {classRowsFiltered.length > 0 && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <PrintDocHead config={config} headline="Class-wise Fee Structure" />
          {classRowsFiltered.length === 0 ? (
            <div className="card"><EmptyState title="No class fee rules yet" sub="Add a fee group with multiple heads (Tuition, Exam, etc.) per class and year." /></div>
          ) : sortedClassYears.map(year => (
            <div className="card card-flush" key={year} style={{ marginBottom: 14 }}>
              <h3 style={{ fontSize: 14.5, padding: "14px 18px 0" }}>Year {year}</h3>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Class</th><th>Section</th>
                      {allClassHeads.map(h => <th key={h} style={{ textAlign: "right" }}>{h}</th>)}
                      <th style={{ textAlign: "right" }}>Total</th>
                      <th className="no-print"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {classByYear[year].map(row => (
                      <tr key={row.id}>
                        <td>{row.className}</td>
                        <td>{row.section || "All"}</td>
                        {allClassHeads.map(h => (
                          <td key={h} style={{ textAlign: "right" }} className="mono">
                            {row[h] ? <>৳{money(row[h])}<div style={{ fontSize: 9.5, color: "var(--slate-soft)", fontWeight: 400 }}>{(feeCategoriesOf(row)[h] && feeCategoriesOf(row)[h].category) || "Yearly"}</div></> : "—"}
                          </td>
                        ))}
                        <td style={{ textAlign: "right" }} className="mono"><strong>৳{money(sumBy(feeHeadsOf(row), h => row[h]))}</strong></td>
                        <td className="no-print">
                          <div style={{ display: "flex", gap: 6 }}>
                            <button className="btn btn-sm btn-icon" onClick={() => editGroup(row)}><Icon.edit /></button>
                            <button className="btn btn-sm btn-icon" onClick={() => deleteGroup(row)}><Icon.trash /></button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      )}
      {tab === "teacher" && (
        <div className="print-landscape">
          <div className="no-print" style={{ textAlign: "right", marginBottom: 10 }}>
            {teacherRowsFiltered.length > 0 && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <PrintDocHead config={config} headline="Designation-wise Salary Scale" />
          {teacherRowsFiltered.length === 0 ? (
            <div className="card"><EmptyState title="No teacher fee scales yet" sub="Add a fee group with multiple components (Basic, Allowance, etc.) per designation and year." /></div>
          ) : sortedTeacherYears.map(year => (
            <div className="card card-flush" key={year} style={{ marginBottom: 14 }}>
              <h3 style={{ fontSize: 14.5, padding: "14px 18px 0" }}>Year {year}</h3>
              <div className="table-wrap">
                <table>
                  <thead>
                    <tr>
                      <th>Designation</th>
                      {allTeacherHeads.map(h => <th key={h} style={{ textAlign: "right" }}>{h}</th>)}
                      <th style={{ textAlign: "right" }}>Total</th>
                      <th className="no-print"></th>
                    </tr>
                  </thead>
                  <tbody>
                    {teacherByYear[year].map(row => (
                      <tr key={row.id}>
                        <td>{row.designation}</td>
                        {allTeacherHeads.map(h => (
                          <td key={h} style={{ textAlign: "right" }} className="mono">
                            {row[h] ? <>৳{money(row[h])}<div style={{ fontSize: 9.5, color: "var(--slate-soft)", fontWeight: 400 }}>{(feeCategoriesOf(row)[h] && feeCategoriesOf(row)[h].category) || "Yearly"}</div></> : "—"}
                          </td>
                        ))}
                        <td style={{ textAlign: "right" }} className="mono"><strong>৳{money(sumBy(feeHeadsOf(row), h => row[h]))}</strong></td>
                        <td className="no-print">
                          <div style={{ display: "flex", gap: 6 }}>
                            <button className="btn btn-sm btn-icon" onClick={() => editGroup(row)}><Icon.edit /></button>
                            <button className="btn btn-sm btn-icon" onClick={() => deleteGroup(row)}><Icon.trash /></button>
                          </div>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          ))}
        </div>
      )}

      {editingGroup && <FeeGroupModal group={editingGroup} onClose={() => setEditingGroup(null)} onSave={saveGroup} />}
    </div>
  );
}

function FeeGroupModal({ group, onClose, onSave }) {
  const [form, setForm] = useState(group);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  function updateItem(i, key, val) {
    const items = [...form.items];
    items[i] = { ...items[i], [key]: val };
    setForm({ ...form, items });
  }
  function addItem() {
    setForm({ ...form, items: [...form.items, { feeType: form.kind === "class" ? INCOME_HEADS[0] : "", amount: "", category: "Yearly", months: [] }] });
  }
  function removeItem(i) {
    setForm({ ...form, items: form.items.filter((_, idx) => idx !== i) });
  }
  function toggleMonth(i, monthNum) {
    const items = [...form.items];
    const cur = items[i].months || [];
    const months = cur.includes(monthNum) ? cur.filter(m => m !== monthNum) : [...cur, monthNum].sort((a, b) => a - b);
    items[i] = { ...items[i], months };
    setForm({ ...form, items });
  }

  return (
    <Modal title={form.kind === "class" ? "Class Fee Group" : "Teacher Fee Scale Group"} onClose={onClose} size="lg"
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={() => onSave(form)}>Save All</button></>}>
      <div className="form-grid" style={{ marginBottom: 16 }}>
        <Field label="Year" hint="fees can differ year to year"><input type="number" value={form.year} onChange={set("year")} placeholder={String(CURRENT_YEAR)} /></Field>
        {form.kind === "class" ? (
          <>
            <Field label="Class"><select value={form.className} onChange={set("className")}>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
            <Field label="Section (optional)"><select value={form.section} onChange={set("section")}><option value="">All Sections</option>{SECTIONS.map(s => <option key={s}>{s}</option>)}</select></Field>
          </>
        ) : (
          <Field label="Designation" span2><select value={form.designation} onChange={set("designation")}>{DESIGNATIONS.map(d => <option key={d}>{d}</option>)}</select></Field>
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <label style={{ fontSize: 12, fontWeight: 600, color: "var(--slate)" }}>Fee Heads &amp; Amounts</label>
        <button className="link-btn" onClick={addItem}>+ Add another fee head</button>
      </div>
      {form.items.map((item, i) => (
        <div key={i} style={{ marginBottom: 10, padding: "10px 12px", border: "1px solid var(--line)", borderRadius: 8 }}>
          <div className="form-grid cols-4" style={{ alignItems: "end" }}>
            <Field label="Fee Type / Head">
              {form.kind === "class" ? (
                <select value={item.feeType} onChange={(e) => updateItem(i, "feeType", e.target.value)}>
                  {INCOME_HEADS.map(h => <option key={h}>{h}</option>)}
                </select>
              ) : (
                <input type="text" value={item.feeType} onChange={(e) => updateItem(i, "feeType", e.target.value)} placeholder="e.g. Basic Salary, House Allowance" />
              )}
            </Field>
            <Field label="Amount"><input type="number" value={item.amount} onChange={(e) => updateItem(i, "amount", e.target.value)} /></Field>
            <Field label="Category">
              <select value={item.category || "Yearly"} onChange={(e) => updateItem(i, "category", e.target.value)}>
                <option value="Monthly">Monthly (প্রতি মাসে)</option>
                <option value="Half Yearly">Half Yearly (বছরে ২ বার)</option>
                <option value="Yearly">Yearly (বছরে ১ বার)</option>
                <option value="3 Times">3 Times (নির্দিষ্ট মাস সিলেক্ট করুন)</option>
                <option value="Admission Year">Admission Year (শুধুমাত্র ভর্তির বছরে একবার)</option>
              </select>
            </Field>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn btn-sm btn-icon" style={{ marginBottom: 1 }} onClick={() => removeItem(i)}><Icon.trash /></button>
            </div>
          </div>
          {item.category === "3 Times" && (
            <div style={{ marginTop: 8 }}>
              <label style={{ fontSize: 11.5, color: "var(--slate-soft)", display: "block", marginBottom: 5 }}>যে মাসগুলোতে এই ফি/বেতন ধার্য হবে তা সিলেক্ট করুন:</label>
              <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
                {MONTH_NAMES.map((m, idx) => {
                  const num = idx + 1;
                  const on = (item.months || []).includes(num);
                  return (
                    <button key={m} type="button" className="chip" onClick={() => toggleMonth(i, num)}
                      style={on ? { background: "var(--moss)", color: "#fff", borderColor: "var(--moss)" } : {}}>
                      {m}
                    </button>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      ))}
      <Field label="Note" span2><textarea value={form.note} onChange={set("note")} /></Field>
    </Modal>
  );
}

      {tab === "subjects" && <SubjectSetupTab data={data} save={save} remove={remove} config={config} />}
      {tab === "marksEntry" && <MarksEntryTab data={data} save={save} config={config} />}
      {tab === "attendance" && <AttendanceTab data={data} save={save} config={config} />}
      {tab === "result" && <ResultTab data={data} config={config} />}
      {tab === "marksheet" && <MarksheetTab data={data} config={config} />}
    </div>
  );
}

/* ---------- Subject Setup ---------- */
// One record per Class+Year holding ALL of that class's subjects as a `rows` array (one row
// per subject, column-wise) — "Subject Quantity" simply decides how many rows the table starts with.
function emptySubjectRow(category) {
  return { code: "", name: "", category: category || SUBJECT_CATEGORIES[0], marks: 100, mcq: "", cq: "" };
}
function emptySubjectGroup() {
  return { id: null, year: String(CURRENT_YEAR), className: CLASSES[0], quantity: 1, modelExamMarks: 50, rows: [emptySubjectRow()] };
}

function SubjectSetupTab({ data, save, remove, config }) {
  const groups = data.subjects || [];
  const [editing, setEditing] = useState(null);
  const [printGroup, setPrintGroup] = useState(null);
  const [yearFilter, setYearFilter] = useState("");
  const [classFilter, setClassFilter] = useState("");

  const years = [...new Set(groups.map(g => String(g.year)))].sort((a, b) => b - a);
  const filtered = groups
    .filter(g => (!yearFilter || String(g.year) === yearFilter) && (!classFilter || g.className === classFilter))
    .sort((a, b) => String(b.year).localeCompare(String(a.year)) || str(a.className).localeCompare(str(b.className)));

  return (
    <div>
      <div className="no-print" style={{ display: "flex", justifyContent: "flex-end", marginBottom: 14 }}>
        <button className="btn btn-primary" onClick={() => setEditing(emptySubjectGroup())}><Icon.plus />New Subject</button>
      </div>
      <div className="no-print search-row">
        <select className="filter-select" value={yearFilter} onChange={(e) => setYearFilter(e.target.value)}>
          <option value="">All Years</option>
          {years.map(y => <option key={y} value={y}>{y}</option>)}
        </select>
        <select className="filter-select" value={classFilter} onChange={(e) => setClassFilter(e.target.value)}>
          <option value="">All Classes</option>
          {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
        </select>
      </div>
      <div className="card card-flush">
        {filtered.length === 0 ? <EmptyState title="No subjects yet" sub="Add a subject to start building the class subject list." /> : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Year</th><th>Class</th><th>Subjects</th><th>Model Marks</th><th style={{ textAlign: "left" }}>Subject Names</th><th></th></tr></thead>
              <tbody>
                {filtered.map(g => (
                  <tr key={g.id}>
                    <td>{g.year}</td>
                    <td>{g.className}</td>
                    <td>{(g.rows || []).length}</td>
                    <td>{g.modelExamMarks || 50}</td>
                    <td>{(g.rows || []).map(r => r.name).filter(Boolean).join(", ") || "—"}</td>
                    <td>
                      <div style={{ display: "flex", gap: 6, justifyContent: "flex-end" }}>
                        <button className="btn btn-sm btn-icon" title="Edit" onClick={() => setEditing({ ...g, rows: (g.rows && g.rows.length ? g.rows : [emptySubjectRow()]) })}><Icon.edit /></button>
                        <button className="btn btn-sm btn-icon" title="Print" onClick={() => setPrintGroup(g)}><Icon.print /></button>
                        <button className="btn btn-sm btn-icon" title="Delete" onClick={() => { if (confirm("Delete this class's subject list?")) remove("subjects", g.id); }}><Icon.trash /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {editing && <SubjectGroupFormModal record={editing} onClose={() => setEditing(null)} onSave={async (r) => { await save("subjects", r); setEditing(null); }} />}
      {printGroup && <SubjectListDocModal group={printGroup} config={config} onClose={() => setPrintGroup(null)} />}
    </div>
  );
}

// Editable line-item table for a class's subject rows — reuses the same bordered "item table"
// look as the Finance Invoice / Expense Voucher forms. Each row's Marks column shows either one
// box (Compulsory / Optional) or two boxes, MCQ + CQ (Elective), depending on that row's Category.
function SubjectRows({ rows, onChange }) {
  function updateRow(i, patch) {
    const next = [...rows];
    next[i] = { ...next[i], ...patch };
    onChange(next);
  }
  return (
    <div className="item-table-wrap">
      <table className="item-form-table">
        <thead>
          <tr><th style={{ width: 38 }}>Sl</th><th>Subject Code</th><th>Subject Name</th><th style={{ width: 160 }}>Category</th><th style={{ width: 170 }}>Marks</th></tr>
        </thead>
        <tbody>
          {rows.map((r, i) => (
            <tr key={i}>
              <td className="itf-sl">{i + 1}</td>
              <td><input type="text" value={r.code} placeholder="Code" onChange={(e) => updateRow(i, { code: e.target.value })} /></td>
              <td><input type="text" value={r.name} placeholder="Subject name" onChange={(e) => updateRow(i, { name: e.target.value })} /></td>
              <td>
                <select value={r.category} onChange={(e) => updateRow(i, { category: e.target.value })}>
                  {SUBJECT_CATEGORIES.map(c => <option key={c}>{c}</option>)}
                </select>
              </td>
              <td>
                {r.category === "Main Elective" ? (
                  <div style={{ display: "flex", gap: 4, alignItems: "center" }}>
                    <input type="number" value={r.mcq} placeholder="MCQ" title="MCQ marks" style={{ width: 58, textAlign: "right" }} onChange={(e) => updateRow(i, { mcq: e.target.value })} />
                    <span style={{ color: "var(--slate-soft)", fontSize: 11 }}>+</span>
                    <input type="number" value={r.cq} placeholder="CQ" title="CQ marks" style={{ width: 58, textAlign: "right" }} onChange={(e) => updateRow(i, { cq: e.target.value })} />
                    <span className="mono" style={{ fontSize: 10.5, color: (Number(r.mcq) || 0) + (Number(r.cq) || 0) === 100 ? "var(--slate-soft)" : "var(--red)" }}>
                      ={(Number(r.mcq) || 0) + (Number(r.cq) || 0)}
                    </span>
                  </div>
                ) : (
                  <input type="number" value={r.marks} placeholder="Full marks" style={{ textAlign: "right" }} onChange={(e) => updateRow(i, { marks: e.target.value })} />
                )}
              </td>
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function SubjectGroupFormModal({ record, onClose, onSave }) {
  const [form, setForm] = useState(record);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  function setQuantity(qStr) {
    const q = Math.max(1, Math.min(40, parseInt(qStr, 10) || 1));
    setForm(f => {
      const rows = [...f.rows];
      if (q > rows.length) { while (rows.length < q) rows.push(emptySubjectRow()); }
      else if (q < rows.length) { rows.length = q; }
      return { ...f, quantity: q, rows };
    });
  }

  function handleSave() {
    const rows = form.rows.filter(r => str(r.name).trim() || str(r.code).trim());
    if (rows.length === 0) { alert("Add at least one subject row."); return; }
    onSave({ ...form, quantity: rows.length, rows });
  }

  return (
    <Modal title="Subject Setup" onClose={onClose} size="lg"
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={handleSave}>Save</button></>}>
      <div className="form-grid cols-3" style={{ marginBottom: 18 }}>
        <Field label="Year"><input type="number" value={form.year} onChange={set("year")} /></Field>
        <Field label="Class"><select value={form.className} onChange={set("className")}>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Subject Quantity"><input type="number" min="1" max="40" value={form.rows.length} onChange={(e) => setQuantity(e.target.value)} /></Field>
        <Field label="Model Exam Full Marks" hint="applies to every subject for any 'Model' exam — Semester exams keep each subject's own marks below">
          <input type="number" min="1" value={form.modelExamMarks || ""} onChange={set("modelExamMarks")} placeholder="e.g. 50" />
        </Field>
      </div>
      <SubjectRows rows={form.rows} onChange={(rows) => setForm({ ...form, rows })} />
    </Modal>
  );
}

/* ---------- Marks Entry ---------- */
function MarksEntryTab({ data, save, config }) {
  const students = data.students || [];
  const promotions = data.promotions || [];
  const classHistories = data.classHistories || [];
  const subjectGroups = data.subjects || [];
  const marksRows = data.marks || [];
  const toast = useToast();

  const [className, setClassName] = useState("");
  const [examName, setExamName] = useState(EXAM_NAME_OPTIONS[0]);
  const [year, setYear] = useState(String(CURRENT_YEAR));
  const [grid, setGrid] = useState(null);
  const [saving, setSaving] = useState(false);

  const classSubjects = getClassSubjects(subjectGroups, className, year);
  // Every currently-enrolled student for this class comes from the Promotion sheet (via
  // studentsInClassYear, which reads Promotion first and falls back to archived history).
  const classStudents = studentsInClassYear(students, promotions, classHistories, className, year);
  const isModel = isModelExam(examName);
  const modelExamMarks = getModelExamMarks(subjectGroups, className, year);

  function loadGrid() {
    const existing = {};
    marksRows
      .filter(r => r.className === className && String(r.year) === String(year) && r.examName === examName)
      .forEach(r => { existing[r.studentId] = r.marks || {}; });
    const next = {};
    classStudents.forEach(s => { next[s.id] = { ...(existing[s.id] || {}) }; });
    setGrid(next);
  }

  function setCell(studentId, subjectId, val) {
    setGrid(g => ({ ...g, [studentId]: { ...(g[studentId] || {}), [subjectId]: val } }));
  }
  function setCellPart(studentId, subjectId, part, val) {
    setGrid(g => {
      const studentCell = g[studentId] || {};
      const existing = (studentCell[subjectId] && typeof studentCell[subjectId] === "object") ? studentCell[subjectId] : {};
      return { ...g, [studentId]: { ...studentCell, [subjectId]: { ...existing, [part]: val } } };
    });
  }

  async function handleSaveAll() {
    if (!grid) return;
    setSaving(true);
    try {
      for (const s of classStudents) {
        const existingRow = marksRows.find(r => r.className === className && String(r.year) === String(year) && r.examName === examName && r.studentId === s.id);
        await save("marks", {
          id: existingRow ? existingRow.id : null,
          className, year, examName, studentId: s.id,
          studentCode: s.studentId, studentName: s.name, roll: s.roll, section: s.section,
          marks: grid[s.id] || {},
        });
      }
      toast && toast("Marks saved", "success");
    } finally {
      setSaving(false);
    }
  }

  return (
    <div>
      <div className="no-print form-grid cols-3" style={{ marginBottom: 16 }}>
        <Field label="Class"><select value={className} onChange={(e) => { setClassName(e.target.value); setGrid(null); }}><option value="">Select class</option>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Exam Name"><select value={examName} onChange={(e) => { setExamName(e.target.value); setGrid(null); }}>{EXAM_NAME_OPTIONS.map(o => <option key={o}>{o}</option>)}</select></Field>
        <Field label="Year"><input type="number" value={year} onChange={(e) => { setYear(e.target.value); setGrid(null); }} /></Field>
      </div>

      {!className ? (
        <EmptyState title="Select a class to begin" sub="Choose Class, Exam Name and Year above, then load the marks sheet." />
      ) : classSubjects.length === 0 ? (
        <EmptyState title="No subjects set up for this class/year" sub="Add subjects first from Subject Setup." />
      ) : classStudents.length === 0 ? (
        <EmptyState title="No students found in this class for this year" sub="Check Students → Promotion / Class History for this year." />
      ) : !grid ? (
        <div style={{ textAlign: "center", padding: 30 }}>
          <button className="btn btn-primary" onClick={loadGrid}>Load Marks Sheet</button>
        </div>
      ) : (
        <>
          <div className="card card-flush" style={{ marginBottom: 14 }}>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Student ID</th><th>Name</th><th>Roll</th><th>Section</th>
                    {classSubjects.map(s => (
                      <th key={s.id} style={{ textAlign: "center" }}>
                        <div className="mono">{s.code || "—"}</div>
                        <div>{s.name}</div>
                        <span style={{ fontWeight: 400, fontSize: 10 }}>
                          {isModel ? `Mark /${modelExamMarks}` : (s.category === "Main Elective" ? `MCQ/${s.mcq || 0} + CQ/${s.cq || 0}` : `Mark /${s.marks}`)}
                        </span>
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {classStudents.map(s => (
                    <tr key={s.id}>
                      <td className="mono">{s.studentId}</td>
                      <td>{s.name}</td>
                      <td>{s.roll}</td>
                      <td>{s.section}</td>
                      {classSubjects.map(sub => (
                        <td key={sub.id}>
                          {!isModel && sub.category === "Main Elective" ? (
                            <div style={{ display: "flex", gap: 3 }}>
                              <input type="number" min="0" max={sub.mcq}
                                style={{ width: 46, padding: "5px 4px", border: "1px solid var(--line)", borderRadius: 6, textAlign: "center", fontFamily: "'IBM Plex Mono',monospace" }}
                                placeholder="MCQ"
                                value={(grid[s.id] && grid[s.id][sub.id] && grid[s.id][sub.id].mcq) ?? ""}
                                onChange={(e) => setCellPart(s.id, sub.id, "mcq", e.target.value)} />
                              <input type="number" min="0" max={sub.cq}
                                style={{ width: 46, padding: "5px 4px", border: "1px solid var(--line)", borderRadius: 6, textAlign: "center", fontFamily: "'IBM Plex Mono',monospace" }}
                                placeholder="CQ"
                                value={(grid[s.id] && grid[s.id][sub.id] && grid[s.id][sub.id].cq) ?? ""}
                                onChange={(e) => setCellPart(s.id, sub.id, "cq", e.target.value)} />
                            </div>
                          ) : (
                            <input type="number" min="0" max={isModel ? modelExamMarks : sub.marks}
                              style={{ width: 64, padding: "5px 6px", border: "1px solid var(--line)", borderRadius: 6, textAlign: "center", fontFamily: "'IBM Plex Mono',monospace" }}
                              value={(grid[s.id] && grid[s.id][sub.id]) ?? ""}
                              onChange={(e) => setCell(s.id, sub.id, e.target.value)} />
                          )}
                        </td>
                      ))}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <button className="btn btn-primary" onClick={handleSaveAll} disabled={saving}>{saving ? "Saving…" : "Save All Marks"}</button>
        </>
      )}
    </div>
  );
}

/* ---------- Attendance ---------- */
function AttendanceTab({ data, save, config }) {
  const students = data.students || [];
  const promotions = data.promotions || [];
  const classHistories = data.classHistories || [];
  const attendanceRows = data.attendance || [];
  const toast = useToast();

  const [className, setClassName] = useState("");
  const [examName, setExamName] = useState(EXAM_NAME_OPTIONS[0]);
  const [year, setYear] = useState(String(CURRENT_YEAR));
  const [totalClass, setTotalClass] = useState("");
  const [grid, setGrid] = useState(null);
  const [saving, setSaving] = useState(false);

  // Every currently-enrolled student for this class, sourced from the Promotion sheet.
  const classStudents = studentsInClassYear(students, promotions, classHistories, className, year);

  function loadGrid() {
    const existing = {};
    attendanceRows
      .filter(r => r.className === className && String(r.year) === String(year) && r.examName === examName)
      .forEach(r => { existing[r.studentId] = r.attended; });
    // If any saved rows already carry a Total Class figure for this class/exam/year, reuse it.
    const savedTotal = attendanceRows.find(r => r.className === className && String(r.year) === String(year) && r.examName === examName && r.totalClass);
    if (savedTotal) setTotalClass(String(savedTotal.totalClass));
    const next = {};
    classStudents.forEach(s => { next[s.id] = existing[s.id] ?? ""; });
    setGrid(next);
  }

  function setCell(studentId, val) {
    setGrid(g => ({ ...g, [studentId]: val }));
  }

  async function handleSaveAll() {
    if (!grid) return;
    setSaving(true);
    try {
      for (const s of classStudents) {
        const existingRow = attendanceRows.find(r => r.className === className && String(r.year) === String(year) && r.examName === examName && r.studentId === s.id);
        await save("attendance", {
          id: existingRow ? existingRow.id : null,
          className, year, examName, studentId: s.id,
          studentCode: s.studentId, studentName: s.name, roll: s.roll, section: s.section,
          totalClass, attended: grid[s.id] || "",
        });
      }
      toast && toast("Attendance saved", "success");
    } finally {
      setSaving(false);
    }
  }

  return (
    <div>
      <div className="no-print form-grid cols-4" style={{ marginBottom: 16 }}>
        <Field label="Class"><select value={className} onChange={(e) => { setClassName(e.target.value); setGrid(null); }}><option value="">Select class</option>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Exam Name"><select value={examName} onChange={(e) => { setExamName(e.target.value); setGrid(null); }}>{EXAM_NAME_OPTIONS.map(o => <option key={o}>{o}</option>)}</select></Field>
        <Field label="Year"><input type="number" value={year} onChange={(e) => { setYear(e.target.value); setGrid(null); }} /></Field>
        <Field label="Total Class" hint="total classes held"><input type="number" min="0" value={totalClass} onChange={(e) => setTotalClass(e.target.value)} /></Field>
      </div>

      {!className ? (
        <EmptyState title="Select a class to begin" sub="Choose Class, Exam Name and Year above, then load the attendance sheet." />
      ) : classStudents.length === 0 ? (
        <EmptyState title="No students found in this class for this year" sub="Check Students → Promotion / Class History for this year." />
      ) : !grid ? (
        <div style={{ textAlign: "center", padding: 30 }}>
          <button className="btn btn-primary" onClick={loadGrid}>Load Attendance Sheet</button>
        </div>
      ) : (
        <>
          <div className="card card-flush" style={{ marginBottom: 14 }}>
            <div className="table-wrap">
              <table>
                <thead>
                  <tr><th>Student ID</th><th>Name</th><th>Roll</th><th style={{ textAlign: "center" }}>Total Class</th><th style={{ textAlign: "center" }}>Attendance</th></tr>
                </thead>
                <tbody>
                  {classStudents.map(s => (
                    <tr key={s.id}>
                      <td className="mono">{s.studentId}</td>
                      <td>{s.name}</td>
                      <td>{s.roll}</td>
                      <td className="mono" style={{ textAlign: "center", color: "var(--slate-soft)" }}>{totalClass || "—"}</td>
                      <td style={{ textAlign: "center" }}>
                        <input type="number" min="0" max={totalClass || undefined}
                          style={{ width: 72, padding: "5px 6px", border: "1px solid var(--line)", borderRadius: 6, textAlign: "center", fontFamily: "'IBM Plex Mono',monospace" }}
                          value={grid[s.id] ?? ""}
                          onChange={(e) => setCell(s.id, e.target.value)} />
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>
          <button className="btn btn-primary" onClick={handleSaveAll} disabled={saving}>{saving ? "Saving…" : "Save All Attendance"}</button>
        </>
      )}
    </div>
  );
}

        <>
          <div className="tabs no-print">
            <button className={`tab ${view === "published" ? "active" : ""}`} onClick={() => setView("published")}>Published Result</button>
