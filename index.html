function MarksheetTab({ data, config }) {
  const students = data.students || [];
  const promotions = data.promotions || [];
  const classHistories = data.classHistories || [];
  const subjectGroups = data.subjects || [];
  const marksRows = data.marks || [];
  const attendanceRows = data.attendance || [];

  const [mode, setMode] = useState("single");
  const [className, setClassName] = useState("");
  const [examName, setExamName] = useState(EXAM_NAME_OPTIONS[0]);
  const [year, setYear] = useState(String(CURRENT_YEAR));
  const [query, setQuery] = useState("");
  const [selected, setSelected] = useState(null);

  usePrintChrome({ hideFooter: true });

  const classSubjects = getClassSubjects(subjectGroups, className, year);
  const classStudents = studentsInClassYear(students, promotions, classHistories, className, year);

  const matches = query.trim() ? classStudents.filter(s =>
    str(s.name).toLowerCase().includes(query.toLowerCase()) || str(s.roll).toLowerCase().includes(query.toLowerCase()) || str(s.studentId).toLowerCase().includes(query.toLowerCase())
  ).slice(0, 20) : [];

  function resultFor(student) {
    const row = marksRows.find(r => r.className === className && String(r.year) === String(year) && r.examName === examName && r.studentId === student.id);
    return computeStudentResult(row, classSubjects, isModelExam(examName), getModelExamMarks(subjectGroups, className, year));
  }
  function attendanceForStudent(student) {
    return attendanceFor(attendanceRows, className, year, examName, student.id);
  }

  const ready = className && classSubjects.length > 0;
  const rankedAll = (mode === "class" && ready)
    ? rankResults(classStudents.map(s => ({ student: s, result: resultFor(s), attendance: attendanceForStudent(s) })))
    : [];
  const showPreview = mode === "single" ? !!selected : (ready && classStudents.length > 0);

  return (
    <div>
      <div className="tabs no-print">
        <button className={`tab ${mode === "single" ? "active" : ""}`} onClick={() => { setMode("single"); setSelected(null); }}>Student-wise</button>
        <button className={`tab ${mode === "class" ? "active" : ""}`} onClick={() => setMode("class")}>Class-wise</button>
      </div>
      <div className="no-print form-grid cols-3" style={{ marginBottom: 16 }}>
        <Field label="Class"><select value={className} onChange={(e) => { setClassName(e.target.value); setSelected(null); }}><option value="">Select class</option>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
        <Field label="Exam Name"><select value={examName} onChange={(e) => setExamName(e.target.value)}>{EXAM_NAME_OPTIONS.map(o => <option key={o}>{o}</option>)}</select></Field>
        <Field label="Year"><input type="number" value={year} onChange={(e) => setYear(e.target.value)} /></Field>
      </div>

      {!ready ? (
        <EmptyState title="Select a class to begin" sub="Subjects must be set up for this class/year first (see Subject Setup)." />
      ) : mode === "single" && !selected ? (
        <div className="no-print" style={{ marginBottom: 16 }}>
          <Field label="Search Student" hint="by name, roll, or Student ID">
            <input className="search-input" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Type to search…" />
          </Field>
          {matches.length > 0 && (
            <div style={{ marginTop: 8, display: "flex", flexWrap: "wrap", gap: 8 }}>
              {matches.map(s => <button key={s.id} className="chip" onClick={() => setSelected(s)}>{s.name} · Roll {s.roll}</button>)}
            </div>
          )}
        </div>
      ) : null}

      {showPreview && (
        <>
          <div className="no-print" style={{ textAlign: "right", marginBottom: 10 }}>
            {mode === "single" && <button className="btn btn-sm" style={{ marginRight: 8 }} onClick={() => setSelected(null)}>← Change Student</button>}
            <button className="btn btn-sm" onClick={() => window.print()}><Icon.print />Print</button>
          </div>
          <div className="marksheet-batch">
            {mode === "single"
              ? <MarksheetDoc student={selected} result={resultFor(selected)} attendance={attendanceForStudent(selected)} className={className} examName={examName} year={year} config={config} />
              : rankedAll.map(r => <MarksheetDoc key={r.student.id} student={r.student} result={r.result} attendance={r.attendance} rank={r.rank} className={className} examName={examName} year={year} config={config} />)}
          </div>
        </>
      )}
    </div>
  );
}

function MarksheetDoc({ student, result, attendance, rank, className, examName, year, config }) {
  const phones = (config.schoolPhones || []).filter(Boolean);
  const today = new Date().toISOString().slice(0, 10);
  // Turns the shared GRADE_SCALE (min% + letter + point) into display ranges, e.g. "80-100".
  const gradeRanges = GRADE_SCALE.map((g, i) => ({
    range: i === 0 ? `${g.min}-100` : `${g.min}-${GRADE_SCALE[i - 1].min - 1}`,
    letter: g.letter, point: g.point.toFixed(2),
  }));

  // Student info renders two fields per row. Built as explicit rows (rather than one flat list
  // auto-flowed into a grid) so Grade always ends up paired with Comment on the same row,
  // regardless of whether Rank is present.
  const infoRows = [
    [["Student ID", <span className="mono">{student.studentId}</span>], ["Roll", student.roll]],
    [["Name", student.name], ["Class", className]],
    [["Section", student.section], ["Session", student.session || year]],
    [["Obtained", `${result.totalObtained} / ${result.totalFull}`], ["Total Class", attendance ? (attendance.totalClass || "—") : "—"]],
    [["Main GPA", result.mainGpa.toFixed(2)], ["Attend", attendance ? (attendance.attended || "—") : "—"]],
    [["Opt GPA", result.optGpa.toFixed(2)], ["Final GPA", <strong>{result.finalGpa.toFixed(2)}</strong>]],
    rank !== undefined ? [["Rank", rank]] : null,
    [["Grade", <strong>{result.finalGrade}</strong>], ["Comment", autoComment(result)]],
  ].filter(Boolean);

  const mainSubjects = result.subjectResults.filter(sr => sr.subject.category !== "Optional");
  const optSubjects = result.subjectResults.filter(sr => sr.subject.category === "Optional");
  const resultRow = (sr) => (
    <tr key={sr.subject.id}>
      <td className="mono" style={{ textAlign: "center" }}>{sr.subject.code || "—"}</td>
      <td style={{ textAlign: "left" }}>{sr.subject.name}</td>
      <td style={{ textAlign: "left" }}>{sr.subject.category}</td>
      <td className="mono" style={{ textAlign: "center" }}>{sr.obtained} / {sr.full}</td>
      <td className="mono" style={{ textAlign: "center" }}>{sr.grade.point.toFixed(2)}</td>
      <td style={{ textAlign: "center" }}>{sr.grade.letter}</td>
    </tr>
  );

  return (
    <div className="admission-form-print marksheet-page">
      <div className="adm-header">
        <div className="adm-header-row">
          <div className="adm-header-logo">{config.schoolLogo ? <img src={config.schoolLogo} alt="" /> : null}</div>
          <div className="adm-header-center">
            <div className="adm-school-name">{(config.schoolName || "School Name").toUpperCase()}</div>
            {config.schoolAddress && <div className="adm-school-address">{config.schoolAddress}</div>}
            {(config.instituteCode || config.schoolEmail || phones[0]) && (
              <div className="adm-school-contact">
                {config.instituteCode && <span>Code: {config.instituteCode}</span>}
                {config.instituteCode && (config.schoolEmail || phones[0]) && <span> &nbsp;|&nbsp; </span>}
                {config.schoolEmail && <span>Email: {config.schoolEmail}</span>}
                {config.schoolEmail && phones[0] && <span> &nbsp;|&nbsp; </span>}
                {phones[0] && <span>Mobile: {phones[0]}</span>}
              </div>
            )}
            <div className="adm-form-title">ACADEMIC MARKSHEET</div>
          </div>
          <div className="adm-header-photo">{student.photoUrl ? <img src={student.photoUrl} alt="" /> : null}</div>
        </div>
        <hr className="adm-divider" />
      </div>

      <div style={{ display: "flex", alignItems: "baseline", margin: "2px 0 24px" }}>
        <div style={{ flex: 1 }} />
        <div style={{ flex: 2, textAlign: "center", fontWeight: 700, fontSize: 18 }}>{examName} — {year}</div>
        <div style={{ flex: 1, textAlign: "right", fontSize: 14 }}>Date: {today}</div>
      </div>

      <div className="msh-info-row">
        <div className="msh-student-info">
          {infoRows.map((pair, i) => (
            <div className="msh-pair-row" key={i}>
              {pair.map(([label, value]) => <div key={label}><FieldRow name={label} value={value} /></div>)}

        <div className="msh-grading">

            <thead><tr><th style={{ textAlign: "center" }}>Number</th><th style={{ textAlign: "center" }}>Grade</th><th style={{ textAlign: "center" }}>Point</th></tr></thead>
            <tbody>
              {gradeRanges.map(g => (
                <tr key={g.letter}>
                  <td className="mono" style={{ textAlign: "center" }}>{g.range}</td>
                  <td style={{ textAlign: "center" }}>{g.letter}</td>

const REPORT_RANGES = [
  { key: "daily", label: "Daily" },
  { key: "monthly", label: "Monthly" },
  { key: "yearly", label: "Yearly" },
  { key: "total", label: "Total" },
];

function ReportsModule({ data, config }) {
  const [range, setRange] = useState("monthly");
  const finance = data.finance || [];
  const rangeLabel = (REPORT_RANGES.find(r => r.key === range) || {}).label || range;

  const filtered = finance.filter(f => withinRange(f.date, range));
  const income = sumBy(filtered.filter(f => f.type === "income"), f => f.amount);
  const expense = sumBy(filtered.filter(f => f.type === "expense"), f => f.amount);
  const net = income - expense;

  // Current surplus/deficit and current cash are the running, all-time position — actual cash
  // in hand doesn't reset just because a Daily/Monthly/Yearly report is being viewed.
  const allTimeIncome = sumBy(finance.filter(f => f.type === "income"), f => f.amount);
  const allTimeExpense = sumBy(finance.filter(f => f.type === "expense"), f => f.amount);
  const currentCash = allTimeIncome - allTimeExpense;

  const headBreakdown = {};
  filtered.forEach(f => {
    const key = `${f.type}:${f.head}`;
    headBreakdown[key] = (headBreakdown[key] || 0) + (Number(f.amount) || 0);
  });
  const headRows = Object.entries(headBreakdown)
    .map(([key, val]) => { const [type, head] = key.split(":"); return { type, head, val }; })
    .sort((a, b) => (a.type === b.type ? b.val - a.val : (a.type === "income" ? -1 : 1)));

  return (
    <div>
      <div className="section-actions no-print">
        <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print Report</button>
      </div>

      <div className="chip-row no-print" style={{ marginBottom: 18 }}>
        {REPORT_RANGES.map(r => (
          <button key={r.key} className={`chip ${range === r.key ? "active" : ""}`} onClick={() => setRange(r.key)}>{r.label}</button>
        ))}
      </div>

      <PrintDocHead config={config} headline={`${rangeLabel} Financial Report`} />

      <div className="table-wrap">
        <table>
          <thead><tr><th style={{ textAlign: "left" }}>Head</th><th>Type</th><th style={{ textAlign: "right" }}>Amount</th></tr></thead>
          <tbody>
            {headRows.length === 0 ? (
              <tr><td colSpan={3}><EmptyState title="No transactions in this range" sub="Add finance entries to see a breakdown." /></td></tr>
            ) : headRows.map(r => (
              <tr key={r.type + r.head}>
                <td style={{ textAlign: "left" }}>{r.head}</td>
                <td><span className={`badge ${r.type === "income" ? "badge-green" : "badge-red"}`}>{r.type}</span></td>
                <td className="mono" style={{ textAlign: "right" }}>৳{money(r.val)}</td>
              </tr>
            ))}
          </tbody>
          <tfoot>
            <tr><td style={{ textAlign: "left", fontWeight: 700 }}>Total Income ({rangeLabel})</td><td></td><td className="mono" style={{ textAlign: "right", fontWeight: 700 }}>৳{money(income)}</td></tr>
            <tr><td style={{ textAlign: "left", fontWeight: 700 }}>Total Expense ({rangeLabel})</td><td></td><td className="mono" style={{ textAlign: "right", fontWeight: 700 }}>৳{money(expense)}</td></tr>
            <tr><td style={{ textAlign: "left", fontWeight: 700 }}>Net ({rangeLabel})</td><td></td><td className="mono" style={{ textAlign: "right", fontWeight: 700, color: net >= 0 ? "var(--moss)" : "var(--red)" }}>৳{money(net)}</td></tr>
          </tfoot>
        </table>
      </div>

      <div className="table-wrap" style={{ marginTop: 18 }}>
        <table>
          <thead><tr><th style={{ textAlign: "left" }}>Current Position</th><th style={{ textAlign: "right" }}>Amount</th></tr></thead>
          <tbody>
            <tr><td style={{ textAlign: "left" }}>Current Surplus / Deficit</td><td className="mono" style={{ textAlign: "right", fontWeight: 700, color: currentCash >= 0 ? "var(--moss)" : "var(--red)" }}>৳{money(currentCash)} ({currentCash >= 0 ? "Surplus" : "Deficit"})</td></tr>
            <tr><td style={{ textAlign: "left" }}>Current Cash</td><td className="mono" style={{ textAlign: "right", fontWeight: 700 }}>৳{money(currentCash)}</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

  const notices = ((data && data.notices) || []).slice().sort((a, b) => new Date(b.date || 0) - new Date(a.date || 0));

  function setPhone(i, val) {
    const phones = [...form.schoolPhones];
    phones[i] = val;
    setForm({ ...form, schoolPhones: phones });
  }

  function openProfileEditor() {
    setForm({ ...config, schoolPhones: config.schoolPhones && config.schoolPhones.length ? config.schoolPhones : ["", "", ""] });
    setProfileEditing(true);
  }

  // Exactly the fields the Settings form edits — sheetsUrl (and anything else on `config`) is
  // local-only connection config and must never be written into the Settings sheet as a column.
  const SETTINGS_SHEET_FIELDS = [
    "schoolName", "instituteCode", "schoolAddress", "schoolEmail",
    "schoolLogo", "facebookUrl", "youtubeUrl", "cashierName", "cashierSignUrl",
    "principalName", "principalSignUrl", "certificateBgUrl",
  ];
  function toSheetRow(f) {
    const row = { id: "main" };
    SETTINGS_SHEET_FIELDS.forEach(k => { row[k] = f[k]; });
    const phones = f.schoolPhones || [];
    row.schoolPhone1 = phones[0] || "";
    row.schoolPhone2 = phones[1] || "";
    row.schoolPhone3 = phones[2] || "";
    return row;
  }

  async function handleSave() {
    setConfig(form);
    saveConfig(form); // local cache for instant reload
    if (form.sheetsUrl) {
      setSaving(true);
      try {
        await SheetsAPI.upsert(form, "Settings", toSheetRow(form));
        toast("Settings saved and synced to Google Sheet", "success");
      } catch (err) {
        toast("Saved locally, but sheet sync failed: " + err.message, "error");
      }
      setSaving(false);
    } else {
      toast("Settings saved locally (connect Google Sheets to sync across devices)");
    }
    setProfileEditing(false);
  }

  return (
    <div>
      <div className="section-actions">
        <button className="btn btn-primary" onClick={openProfileEditor}><Icon.edit />Edit Institution Profile</button>
      </div>

      <div className="card" style={{ maxWidth: 560, marginBottom: 20 }}>

            <img src={config.schoolLogo} alt="" style={{ width: 56, height: 56, borderRadius: 8, objectFit: "cover", border: "1px solid var(--line)" }} />
          ) : (
            <div style={{ width: 56, height: 56, borderRadius: 8, background: "var(--paper)", border: "1px solid var(--line)" }} />
          )}

            <Field label="Mobile Number 3" hint="optional"><input type="tel" value={form.schoolPhones[2] || ""} onChange={(e) => setPhone(2, e.target.value)} /></Field>

            <Field label="Cashier Name" hint="shown on Fee Invoice"><input type="text" value={form.cashierName || ""} onChange={set("cashierName")} /></Field>

      {committeeEditing && <CommitteeFormModal committee={committeeEditing} onClose={() => setCommitteeEditing(null)} onSave={async (r) => { await save("committee", r); setCommitteeEditing(null); }} />}

    </div>
  );

function MenuBar({ active, subTab, setActive, config, store }) {
  const [mobileOpen, setMobileOpen] = useState(false);
  const [expanded, setExpanded] = useState("");

  // Picking a final destination (a subitem, or a top-level item with no submenu) always closes
  // the whole menu panel and resets the accordion — exactly like a normal drill-down menu.
  function pick(key, subKey) {
    setActive(key, subKey);
    setMobileOpen(false);
    setExpanded("");
  }

  // Clicking a top-level item that HAS submenus only ever expands/collapses its submenu list in
  // place — it never navigates by itself. Clicking it again while open hides the submenu again.
  function toggleGroup(item) {
    if (item.subitems) {
      setExpanded(prev => (prev === item.key ? "" : item.key));
    } else {
      pick(item.key);
    }
  }

  function toggleMenu() {
    setMobileOpen(o => {
      const next = !o;
      if (!next) setExpanded(""); // closing the whole menu also collapses any open submenu
      return next;
    });
  }

  return (
    <div className="menubar no-print">
      {/* Desktop layout: hamburger (left) — institution name + code (center) — logo (right) */}
      <div className="menubar-row menubar-row-desktop">
        <button className="menubar-toggle" onClick={toggleMenu} aria-label="Menu">
          <IconWrap name={mobileOpen ? "x" : "menu"} />
        </button>
        <div className="menubar-desktop-name">
          {(config.schoolName || "Vidyalaya").toUpperCase()}
          {config.instituteCode && <span className="menubar-desktop-code"> ({config.instituteCode})</span>}
        </div>
        <div className="menubar-desktop-logo">
          {config.schoolLogo ? <img src={config.schoolLogo} alt="" /> : <div className="menubar-brand-mark">V</div>}
        </div>
      </div>

      {/* Mobile layout: unchanged — brand mark+text (left), hamburger toggle (right) */}
      <div className="menubar-row menubar-row-mobile">
        <div className="menubar-brand">
          {config.schoolLogo ? (
            <img src={config.schoolLogo} alt="" className="menubar-brand-logo" />
          ) : (
            <div className="menubar-brand-mark">V</div>
          )}
          <div>
            <div className="menubar-brand-text">Vidyalaya</div>
            <div className="menubar-brand-sub">{config.schoolName || "School Manager"}</div>
          </div>
        </div>

        <button className="menubar-toggle" onClick={toggleMenu} aria-label="Menu">
          <IconWrap name={mobileOpen ? "x" : "menu"} />
        </button>
      </div>

      <div className={`menubar-mobile-panel ${mobileOpen ? "open" : ""}`}>
        {NAV_GROUPS.map(group => (
          <div key={group.label}>
            <div className="menubar-group-label">{group.label}</div>
            {group.items.map(item => (
              <div key={item.key}>
                <button
                  className={`menubar-item ${active === item.key ? "active" : ""}`}
                  onClick={() => toggleGroup(item)}
                >
                  <IconWrap name={item.icon} />
                  {item.label}
                  {item.subitems && (
                    <IconWrap name="chevronDown" className={`menubar-item-chevron ${expanded === item.key ? "open" : ""}`} />
                  )}
                </button>
                {item.subitems && (
                  <div className={`menubar-submenu ${expanded === item.key ? "open" : ""}`}>
                    {item.subitems.map(sub => (
                      <button
                        key={sub.key}
                        className={`menubar-subitem ${active === item.key && subTab === sub.key ? "active" : ""}`}
                        onClick={() => pick(item.key, sub.key)}
                      >
                        {sub.label}
                      </button>
                    ))}
                  </div>
                )}
              </div>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

function AppShell() {
  const [config, setConfigState] = useState(loadConfig());
  const [active, setActiveRaw] = useState("dashboard");
  const [subTab, setSubTab] = useState("");
  const [navSeq, setNavSeq] = useState(0);
  const store = useDataStore(config);

  // Nav clicks always pass through here: `key` is the module, `subKey` (optional) is which
  // internal section/tab of that module to land on — this is what powers the menu's submenus.
  // navSeq is bumped on every click so the target module remounts fresh, even if you click the
  // same submenu item twice in a row after navigating away inside the module.
  function setActive(key, subKey) {
    setActiveRaw(key);
    setSubTab(subKey || "");
    setNavSeq(n => n + 1);
  }

  function setConfig(c) { setConfigState(c); }

  // On startup (and whenever the Sheets URL changes), pull Settings from the shared
  // Google Sheet so the institution profile stays in sync across browsers/devices —
  // this is the source of truth once connected; localStorage is just an offline cache.
  useEffect(() => {
    if (!config.sheetsUrl) return;
    (async () => {
      try {
        const res = await SheetsAPI.list(config, "Settings");
        const row = (res.rows || []).find(r => r.id === "main");
        if (row) {
          const hasFlatPhones = row.schoolPhone1 !== undefined || row.schoolPhone2 !== undefined || row.schoolPhone3 !== undefined;
          const schoolPhones = hasFlatPhones
            ? [row.schoolPhone1 || "", row.schoolPhone2 || "", row.schoolPhone3 || ""]
            : (row.schoolPhones || config.schoolPhones);
          const merged = { ...config, ...row, schoolPhones };
          setConfigState(merged);
          saveConfig(merged);
        }
      } catch (err) {
        console.error("Settings fetch failed:", err);
      }
    })();
    // eslint-disable-next-line
  }, [config.sheetsUrl]);

  // Update favicon and document title when the logo/school name changes
  useEffect(() => {
    if (config.schoolLogo) {
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement("link");
        link.rel = "icon";
        document.head.appendChild(link);
      }
      link.href = config.schoolLogo;
    }
    if (config.schoolName) {
      document.title = config.schoolName + " — Vidyalaya";
    }
  }, [config.schoolLogo, config.schoolName]);

  return (
    <div className="app-shell">
      <GlobalPrintChrome config={config} />
      <MenuBar active={active} subTab={subTab} setActive={setActive} config={config} store={store} />

      <div className="main-col">
        <div className="topbar no-print">
          <div className="topbar-title">{MODULE_TITLES[active]}</div>
          <div className="topbar-actions">
            <div className="sync-pill">
              <span className={`sync-dot ${store.syncing ? "pending" : store.status === "error" ? "error" : ""}`}></span>
              {store.syncing ? "Syncing…" : store.status === "error" ? "Sync error" : store.status === "offline" ? "Offline mode" : "Synced"}
            </div>
            <button className="btn btn-sm btn-icon" title="Sync now" onClick={store.refresh}><IconWrap name="refresh" /></button>
          </div>
        </div>
        <div className="content" key={`${active}-${subTab}-${navSeq}`}>
          <ConnectionBanner config={config} onOpenSettings={() => setActive("settings")} />
          {active === "dashboard" && <Dashboard data={store.data} setActiveModule={setActive} />}
          {active === "students" && <StudentsModule data={store.data} save={store.save} remove={store.remove} config={config} initialTab={subTab} />}
          {active === "allcard" && <AllCardModule data={store.data} config={config} initialCardType={subTab} save={store.save} remove={store.remove} />}
          {active === "invoice" && <FeeInvoiceModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "teachers" && <TeachersModule data={store.data} save={store.save} remove={store.remove} config={config} initialTab={subTab} />}
          {active === "finance" && <FinanceModule data={store.data} save={store.save} remove={store.remove} config={config} initialTab={subTab} />}
          {active === "zakat" && <ZakatModule data={store.data} save={store.save} remove={store.remove} config={config} initialTab={subTab} />}
          {active === "result" && <ResultModule data={store.data} save={store.save} remove={store.remove} config={config} initialTab={subTab} />}
          {active === "due" && <DueModule data={store.data} config={config} initialTab={subTab} />}
          {active === "fees" && <MasterFeeModule data={store.data} save={store.save} remove={store.remove} config={config} initialTab={subTab} />}
          {active === "committee" && <CommitteeModule data={store.data} save={store.save} remove={store.remove} />}
          {active === "notices" && <NoticeModule data={store.data} config={config} />}
          {active === "reports" && <ReportsModule data={store.data} config={config} />}
          {active === "settings" && <SettingsModule config={config} setConfig={setConfig} data={store.data} save={store.save} remove={store.remove} />}
        </div>
      </div>
    </div>
  );
}

// Public, read-only status page — this is what the ID card's QR code links to.
// No login, no menu: just the student's admission date, current class, and fee status,
// fetched fresh from the same Google Sheet the admin app uses.
function StudentStatusPage({ studentId }) {
  const [state, setState] = useState({ loading: true, error: null, student: null, config: null, breakdown: [] });

  useEffect(() => {
    const config = loadConfig();
    if (!config.sheetsUrl) {
      setState({ loading: false, error: "This school hasn't connected Google Sheets yet.", student: null, config, breakdown: [] });
      return;
    }
    (async () => {
      try {
        const res = await SheetsAPI.bulkGet(config, ["Students", "MasterFees", "Invoice", "Promotion", "ClassHistory", "Activation"]);
        const students = res.data["Students"] || [];
        const feeRulesAll = res.data["MasterFees"] || [];
        const invoices = res.data["Invoice"] || [];
        const promotions = res.data["Promotion"] || [];
        const classHistories = res.data["ClassHistory"] || [];
        const activations = res.data["Activation"] || [];
        const student = students.find(s => s.studentId === studentId || s.id === studentId);
        if (!student) {
          setState({ loading: false, error: "No student found for this ID.", student: null, config, breakdown: [] });
          return;
        }
        const feeRules = feeRulesAll.filter(f => f.kind === "class");
        const breakdown = studentFeeBreakdown(student, feeRules, invoices, promotions, classHistories, activations);
        const current = getCurrentStatus(student, promotions);
        setState({ loading: false, error: null, student: { ...student, current }, config, breakdown });
      } catch (err) {
        setState({ loading: false, error: "Couldn't load status: " + err.message, student: null, config, breakdown: [] });
      }
    })();
  }, [studentId]);

  if (state.loading) {
    return (
      <div className="loading-screen">
        <div className="spinner" />
        <div>Loading student status…</div>
      </div>
    );
  }

  const config = state.config || {};

  if (state.error || !state.student) {
    return (
      <div className="status-page">
        <div className="status-card">
          <EmptyState title="Couldn't load status" sub={state.error || "Please try again."} />
        </div>
      </div>
    );
  }

  const { student, breakdown } = state;
  const totalCharged = sumBy(breakdown, r => r.charged);
  const totalPaid = sumBy(breakdown, r => r.paid);
  const totalWaived = sumBy(breakdown, r => r.waived);
  const totalDue = sumBy(breakdown, r => r.due);

  return (
    <div className="status-page">
      <div className="status-card">
        <div className="status-header">
          {config.schoolLogo && <img src={config.schoolLogo} alt="" className="status-logo" />}
          <div className="status-school-name">{config.schoolName || "School"}</div>
        </div>
        <div className="status-photo-wrap">
          {student.photoUrl ? <img src={student.photoUrl} alt="" className="status-photo" /> : null}
        </div>
        <h2 className="status-student-name">{student.name}</h2>
        <div className="status-sub">{student.studentId}</div>

        <div className="status-section">
          <FieldRow name="Admission Date" value={fmtDate(student.admissionDate)} />
          <FieldRow name="Current Class" value={`${student.current.className || "—"} — ${student.current.section || "—"}`} />
          <FieldRow name="Roll" value={student.current.roll || "—"} />
          <FieldRow name="Session" value={student.current.session || "—"} />
        </div>

        <div className="status-section-title">Fee Status (Admission to Date)</div>
        {breakdown.length === 0 ? (
          <EmptyState title="No fee records yet" sub="" />
        ) : (
          <div className="table-wrap">
            <table>
              <thead><tr><th>Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th></tr></thead>
              <tbody>
                {breakdown.map((r, i) => (
                  <tr key={i}>
                    <td>{r.head}{r.year ? ` (${r.year})` : ""}</td>
                    <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                    <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                    <td style={{ textAlign: "right" }} className="mono">৳{money(r.due)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
        <div className="status-summary">
          <FieldRow name="Total Fee" value={"৳" + money(totalCharged)} />
          <FieldRow name="Total Paid" value={"৳" + money(totalPaid)} />
          <FieldRow name="Total Waiver" value={"৳" + money(totalWaived)} />
          <FieldRow name="Total Due" value={<strong style={{ color: totalDue > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(totalDue)}</strong>} />
        </div>
      </div>
    </div>
  );
}

function Root() {
  const params = new URLSearchParams(window.location.search);
  const sid = params.get("sid");
  if (sid) {
    return <StudentStatusPage studentId={sid} />;
  }
  return (
    <ToastProvider>
      <AppShell />
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
