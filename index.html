<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidyalaya — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1b232c;
  --paper:#f4f6f8;
  --paper-raised:#ffffff;
  --slate:#3c4a58;
  --slate-soft:#65747f;
  --line:#d8dee4;
  --moss:#4682b4;
  --moss-deep:#2f5f85;
  --moss-tint:#e7f0f7;
  --clay:#b8562f;
  --clay-tint:#f7e9e0;
  --gold:#c8963e;
  --gold-tint:#f6edd9;
  --red:#b0403a;
  --red-tint:#f7e4e2;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(27,35,44,0.06);
  --shadow-md:0 4px 16px rgba(27,35,44,0.08);
  --shadow-lg:0 12px 40px rgba(27,35,44,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
}
.mono{font-family:'IBM Plex Mono',monospace;}
#root{min-height:100vh;}
::selection{background:var(--moss-tint);color:var(--moss-deep);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--slate-soft);}

/* ===== App Shell ===== */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}

.menubar{
  background:var(--moss-deep);
  color:#eef2ee;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:var(--shadow-sm);
}
.menubar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  height:58px;
}
.menubar-row-desktop{display:none;}
.menubar-row-mobile{display:flex;width:100%;}
@media(min-width:921px){
  .menubar-row-desktop{display:flex;}
  .menubar-row-mobile{display:none;}
}

.menubar-brand{
  display:flex;align-items:center;gap:10px;
}
.menubar-brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold),#dba94f);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--moss-deep);
  flex-shrink:0;
}
.menubar-brand-logo{
  width:32px;height:32px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#fff;
}
.menubar-brand-text{font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1.1;}
.menubar-brand-sub{font-size:10px;color:#a9c2b2;text-transform:uppercase;letter-spacing:0.08em;margin-top:1px;}

.menubar-desktop-name{
  flex:1;min-width:0;text-align:center;font-family:'Fraunces',serif;font-size:17px;font-weight:700;
  letter-spacing:0.02em;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 14px;
}
.menubar-desktop-code{font-size:15px;font-weight:600;color:#ffffff;}
.menubar-desktop-logo{
  width:34px;height:34px;border-radius:8px;overflow:hidden;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;background:#fff;
}
.menubar-desktop-logo img{width:100%;height:100%;object-fit:cover;}

.menubar-nav{
  display:flex;align-items:center;gap:2px;flex-wrap:wrap;
}
.menubar-item{
  display:flex;align-items:center;gap:7px;
  padding:9px 13px;border-radius:8px;
  font-size:13px;font-weight:500;color:#d3e0d7;
  cursor:pointer;border:none;background:transparent;
  transition:background .12s ease, color .12s ease;
  white-space:nowrap;
}
.menubar-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.menubar-item.active{background:var(--gold);color:var(--moss-deep);font-weight:600;}
.menubar-item svg{flex-shrink:0;opacity:0.9;}
.menubar-item-chevron{margin-left:auto;transition:transform .15s ease;opacity:0.75;}
.menubar-item-chevron.open{transform:rotate(180deg);}

.menubar-submenu{
  display:none;flex-direction:column;gap:1px;
  padding:2px 0 4px 30px;
}
.menubar-submenu.open{display:flex;}
.menubar-subitem{
  display:block;text-align:left;width:100%;
  padding:8px 12px;border-radius:7px;border:none;background:transparent;
  font-size:12.5px;color:#b9cabf;cursor:pointer;
  border-left:2px solid rgba(255,255,255,0.15);
  transition:background .12s ease,color .12s ease;
}
.menubar-subitem:hover{background:rgba(255,255,255,0.07);color:#fff;}
.menubar-subitem.active{background:rgba(212,175,55,0.16);color:var(--gold);font-weight:600;border-left-color:var(--gold);}

.menubar-toggle{
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:none;border:none;color:#eef2ee;padding:8px;border-radius:8px;
}
.menubar-toggle:hover{background:rgba(255,255,255,0.08);}

.menubar-mobile-panel{
  display:none;
  flex-direction:column;
  padding:8px 12px 14px;
  border-top:1px solid rgba(255,255,255,0.1);
}
.menubar-mobile-panel.open{display:flex;}
.menubar-mobile-panel .menubar-item{width:100%;justify-content:flex-start;padding:11px 13px;}
.menubar-group-label{
  font-size:10px;text-transform:uppercase;letter-spacing:0.08em;
  color:#87a291;padding:12px 13px 4px;font-weight:600;
}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:62px;flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;background:var(--paper-raised);
  position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.sync-pill{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--slate-soft);
  padding:5px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line);
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--moss);}
.sync-dot.pending{background:var(--gold);}
.sync-dot.error{background:var(--red);}

.content{padding:26px;flex:1;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink);font-size:13.5px;font-weight:600;
  transition:all .12s ease;
}
.btn:hover{border-color:var(--slate-soft);background:var(--paper);}
.btn-primary{background:var(--moss);border-color:var(--moss);color:#fff;}
.btn-primary:hover{background:var(--moss-deep);border-color:var(--moss-deep);}
.btn-clay{background:var(--clay);border-color:var(--clay);color:#fff;}
.btn-clay:hover{background:#96461f;}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-tint);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-icon{padding:8px;}

/* ===== Cards / Layout ===== */
.card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);
}
.card-flush{padding:0;overflow:hidden;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.stat-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;position:relative;overflow:hidden;
}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--slate-soft);font-weight:600;}
.stat-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin-top:6px;}
.stat-sub{font-size:12px;color:var(--slate-soft);margin-top:4px;}
.stat-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.form-grid.cols-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){ .form-grid.cols-4{grid-template-columns:repeat(2,1fr);} }
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.span-2{grid-column:span 2;}
.form-field label{font-size:12px;font-weight:600;color:var(--slate);}
.form-field .hint{font-size:11px;color:var(--slate-soft);font-weight:400;}
.form-field input[type=text],
.form-field input[type=number],
.form-field input[type=date],
.form-field input[type=email],
.form-field input[type=tel],
.form-field input[type=password],
.form-field select,
.form-field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  font-size:13.5px;background:var(--paper-raised);color:var(--ink);
  outline:none;transition:border-color .12s;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--moss);}
.form-field textarea{resize:vertical;min-height:70px;}
.file-drop{
  border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;
  font-size:12.5px;color:var(--slate-soft);background:var(--paper);cursor:pointer;
}
.file-drop:hover{border-color:var(--moss);}
.file-drop img{max-height:80px;border-radius:6px;margin-bottom:6px;}

.photo-box{
  width:120px;height:120px;border-radius:10px;
  border:1.5px dashed var(--line);background:var(--paper);
  cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .12s;
}
.photo-box:hover{border-color:var(--moss);}
.photo-box img{width:100%;height:100%;object-fit:cover;}
.photo-box-placeholder{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--slate-soft);font-size:11px;text-align:center;padding:8px;
}

/* ===== Table ===== */
.table-wrap{overflow-x:auto;}
@media print{ .table-wrap{overflow:visible !important;} }
.result-fit-table th, .result-fit-table td{white-space:normal;word-break:break-word;}
@media print{
  .result-fit-table{width:100%;table-layout:fixed;font-size:9px;}
  .result-fit-table th, .result-fit-table td{padding:4px 3px;}
}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--slate-soft);font-weight:600;
  border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:hover{background:var(--paper);}
tbody tr:last-child td{border-bottom:none;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:600;
}
.badge-green{background:var(--moss-tint);color:var(--moss-deep);}
.badge-gold{background:var(--gold-tint);color:#8a6318;}
.badge-red{background:var(--red-tint);color:var(--red);}
.badge-slate{background:var(--paper);color:var(--slate-soft);border:1px solid var(--line);}

/* ===== Tabs ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tab{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--slate-soft);
  border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.active{color:var(--moss-deep);border-bottom-color:var(--moss);}
.tab:hover:not(.active){color:var(--ink);}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(27,35,44,0.5);
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;z-index:100;
}
.modal{
  background:var(--paper-raised);border-radius:var(--radius-lg);width:100%;max-width:680px;
  box-shadow:var(--shadow-lg);
}
.modal.modal-lg{max-width:920px;}
.modal.modal-xl{max-width:1240px;}
.modal-head{
  padding:18px 24px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{font-size:18px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--slate-soft);padding:4px;}
.modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

/* ===== Toast ===== */
.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;
  box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;min-width:220px;
  animation:toastIn .18s ease;
}
.toast.error{background:var(--red);}
.toast.success{background:var(--moss-deep);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== Print Templates ===== */
.print-only{display:none;}
@media print{
  .app-shell > .menubar, .topbar, .no-print{display:none !important;}
  .print-only{display:block;}
  @page{size:A4;margin:0.5in;}
  body{background:#fff;}
  /* The modal is rendered via a React portal directly under <body>, as a sibling of #root.
     When printing a modal's document, hide #root entirely (not just .content) — otherwise
     its reserved min-height:100vh flex container leaves one blank page before the modal prints. */
  body.modal-open #root{display:none !important;}
  .modal-overlay{position:static;padding:0;background:none;display:block;}
  .modal{box-shadow:none;max-width:100%;border-radius:0;width:auto;}
  .modal-head,.modal-foot{display:none;}
  .modal-body{padding:0;max-height:none;overflow:visible;position:relative;}
  /* Landscape A4 page for wide tabular data (Due List, Master Fee grid) */
  @page landscape-a4{size:A4 landscape;margin:0.5in;}
  .print-landscape{page:landscape-a4;}
  /* On-screen page titles/descriptions are redundant with PrintDocHead's institution header */
  .section-head{display:none !important;}
}
.doc-preview{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;max-width:640px;margin:0 auto;
}
.doc-preview.half-a4{max-width:100%;width:99mm;min-height:140mm;padding:14mm 10mm;}
@media print{
  .doc-preview.half-a4{width:100%;min-height:0;box-shadow:none;border:none;}
}

/* ===== Marksheet batch (Result → Marksheet, Class-wise) ===== */
.marksheet-batch{display:flex;flex-direction:column;gap:24px;align-items:center;}
@media print{
  .marksheet-batch{gap:0;}
  .marksheet-page{page-break-after:always;}
  .marksheet-page:last-child{page-break-after:auto;}
}

/* Professional Admission Form layout — exactly one A4 page, with a page border and 0.5in margin */
.admission-form-print{
  font-size:11px;width:210mm;min-height:297mm;max-width:none;
  box-sizing:border-box;padding:0.5in;border:1.5px solid var(--ink);border-radius:0;
  display:flex;flex-direction:column;margin:0 auto;
}
@media print{
  .admission-form-print{
    width:100%;min-height:100vh;box-sizing:border-box;
    padding:0;border:1.5px solid var(--ink);box-shadow:none;
  }
}

/* Notice — a plain A4 page (not the ~640px "card" .doc-preview default), no drop shadow */
.notice-print{
  font-size:13px;width:210mm;min-height:297mm;max-width:none;
  box-sizing:border-box;padding:0.5in;border:1px solid var(--line);border-radius:0;
  display:flex;flex-direction:column;margin:0 auto;box-shadow:none;
}
@media print{
  .notice-print{width:100%;min-height:100vh;box-sizing:border-box;padding:0;border:none;box-shadow:none;}
}

.adm-header{
  background:var(--moss-deep);color:#fff;border-radius:0;
  padding:10px 16px 8px;margin:-0.5in -0.5in 12px;
}
@media print{ .adm-header{margin:0 0 12px;} }
.adm-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;}
.adm-header-logo,.adm-header-photo{
  width:58px;height:70px;flex-shrink:0;border:1px solid rgba(255,255,255,0.4);border-radius:5px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:rgba(255,255,255,0.08);
}
.adm-header-logo img,.adm-header-photo img{width:100%;height:100%;object-fit:cover;}
.adm-header-center{flex:1;min-width:0;text-align:center;}
.adm-school-name{
  font-family:'Fraunces',serif;font-size:19px;font-weight:800;
  color:#fff;
  text-shadow:0 1px 2px rgba(0,0,0,0.35);
  text-transform:uppercase;letter-spacing:0.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.adm-school-code{font-size:10px;font-weight:400;color:#fff;opacity:0.85;text-transform:none;}
.adm-school-address{font-size:10px;opacity:0.9;margin-top:2px;}
.adm-school-contact{font-size:10px;opacity:0.9;margin-top:1px;}
.adm-form-title{font-family:'Fraunces',serif;font-size:13px;font-weight:700;letter-spacing:0.06em;margin-top:5px;}
.adm-divider{border:none;border-top:2px solid var(--gold);margin:7px 0 5px;}
.adm-form-no{font-size:10.5px;font-weight:600;text-align:left;}

.adm-section-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.03em;color:var(--moss-deep);margin:8px 0 3px;padding-bottom:2px;border-bottom:1px solid var(--line);}
.adm-fields{margin-bottom:4px;}
.adm-address-line{font-size:11px;line-height:1.6;padding:2px 0 10px;}
.adm-fields-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:16px;margin-bottom:4px;}
.adm-fields-grid .field-row{font-size:10.5px;padding:2px 0;}
.msh-info-row{display:flex;gap:16px;align-items:flex-start;margin-bottom:10px;}
.msh-student-info{flex:1.3;min-width:0;display:flex;flex-direction:column;gap:2px;}
.msh-pair-row{display:flex;gap:14px;}
.msh-pair-row>div{flex:1;min-width:0;}
.msh-student-info .field-row{padding:3px 0;border-bottom:none;}
.msh-grading{flex:1;max-width:190px;}
.msh-grading table{width:100%;}
.msh-grading table th,.msh-grading table td{padding:3px 5px;}
.msh-guardian-box{border:1px solid var(--ink);border-radius:4px;padding:8px 10px 60px;margin-top:10px;min-height:90px;}
.msh-guardian-label{font-size:10.5px;font-weight:700;margin-bottom:4px;}
.msh-bordered-table{width:100%;border-collapse:collapse;margin:0 0 10px;}
.msh-bordered-table th,.msh-bordered-table td{border:1px solid var(--ink);padding:8px 6px;}
.msh-bordered-table thead th{text-transform:uppercase;letter-spacing:0.02em;color:#000;}
.msh-bordered-table tbody tr:last-child td{border-bottom:1px solid var(--ink);}
.msh-bordered-table tbody tr.msh-gap-row td{border:none;padding:0;height:8px;}
.msh-bottom-block{margin-top:auto;}
/* Credit line renders outside the page's own border/content box (absolutely positioned below
   it) instead of taking up space inside it, so the border always hugs the real content and the
   line itself sits below the page margin as its own strip. */
.msh-credit-outside{
  position:absolute;left:0;right:0;bottom:-18px;
  font-size:8.5px;color:var(--slate-soft);text-align:right;background:none;
  padding-top:4px;border-top:1px dashed var(--line);
}
.marksheet-page{position:relative;}
@media print{
  /* min-height:100vh already represents the printable area (page size minus the @page margin),
     so capping at the SAME reference guarantees the content never spills onto a second page —
     capping at a flat "297mm" was taller than the real printable area and let overflow through. */
  .marksheet-page{max-height:100vh;overflow:hidden;}
}
/* Marksheet-only overrides (scoped to .marksheet-page so Admission Form / ID cards / other
   documents sharing these same class names are left exactly as they were). */
.marksheet-page .adm-header,.marksheet-page .adm-footer{background:#1f6e42;}
.marksheet-page .adm-header{padding-bottom:0;}
.marksheet-page .adm-header .adm-divider{margin:7px 0 0;border-top-color:rgba(255,255,255,0.5);}
.marksheet-page .adm-school-name{font-size:24px;}
.marksheet-page .adm-form-title{font-size:15px;}
.marksheet-page .adm-slogan{color:#fff;}
.marksheet-page .msh-student-info .field-row,
.marksheet-page .msh-bordered-table{font-size:14px;}
.marksheet-page .msh-grading table{font-size:12px;}
.adm-declaration{font-size:10.5px;line-height:1.5;color:var(--slate);margin:4px 0 6px;text-align:justify;}
.adm-signatures{display:flex;justify-content:space-between;margin-top:46px;padding:0 6px;}
.adm-sig{border-top:1px solid var(--ink);padding-top:4px;font-size:10px;text-align:center;width:170px;line-height:1.4;}
.adm-sig-img{display:block;max-height:34px;max-width:120px;margin:0 auto 2px;object-fit:contain;}

.adm-footer{
  background:var(--moss-deep);color:#fff;text-align:center;
  padding:8px 16px 7px;margin:auto -0.5in 0;border-radius:0;
}
@media print{ .adm-footer{margin:auto 0 0;} }
.adm-slogan{font-size:10.5px;font-style:italic;color:var(--gold);}
.adm-footer .adm-divider{border-top-color:rgba(255,255,255,0.3);margin:6px 0 5px;}
.adm-credit{font-size:9px;color:#fff;opacity:0.75;}
.adm-credit-outside{
  font-size:9px;color:var(--slate-soft);text-align:center;
  margin-top:6px;padding-top:5px;border-top:1px dashed var(--line);
}

/* Fee Invoice — its own black-on-white look (no colored header/footer), separate from the Admission Form's. */
.invoice-doc-print{max-width:480px;color:#000;font-size:11px;position:relative;}
@media print{ .invoice-doc-print{box-shadow:none;border:none;padding:0;} }
.inv-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:55%;pointer-events:none;z-index:0;
}
.inv-watermark img{width:100%;opacity:0.08;display:block;}
.inv-header,.inv-meta-grid,.inv-fee-table,.adm-signatures,.inv-credit{position:relative;z-index:1;}
.invoice-doc-print > div:not(.inv-watermark){position:relative;z-index:1;}
.inv-header{color:#000;}
.inv-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
.inv-header-logo,.inv-header-photo{
  width:44px;height:54px;flex-shrink:0;border:1px solid var(--line);border-radius:4px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper);
}
.inv-header-logo img,.inv-header-photo img{width:100%;height:100%;object-fit:cover;}
.inv-header-center{flex:1;min-width:0;text-align:center;}
.inv-school-name{font-family:'Fraunces',serif;font-size:16px;font-weight:800;color:#000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inv-school-code{font-size:10px;font-weight:400;color:#000;}
.inv-school-address{font-size:10px;color:#000;margin-top:2px;}
.inv-title{font-family:'Fraunces',serif;font-size:13px;font-weight:700;letter-spacing:0.06em;color:#000;margin-top:5px;}
.inv-divider{border-top-color:#000;margin:7px 0 8px;}

.inv-meta-grid{display:grid;grid-template-columns:1fr 1fr;column-gap:20px;margin-bottom:10px;}
.inv-meta-grid .field-row{font-size:11px;padding:2px 0;border-bottom:none;color:#000;}

.inv-fee-table{width:100%;margin:0 0 10px;border-collapse:collapse;font-size:11.5px;color:#000;}
.inv-fee-table thead th{text-align:center;font-size:10px;text-transform:uppercase;letter-spacing:0.03em;color:#000;padding:5px 4px;border-bottom:1.5px solid #000;}
.inv-fee-table tbody td{padding:6px 4px;border-bottom:1px dashed var(--line);color:#000;}
.inv-fee-table tbody tr:last-child td{border-bottom:1px dashed var(--line);}
.inv-summary{min-width:220px;color:#000;}
.inv-summary .field-row{border-bottom:none;padding:2px 0;}
.inv-credit{font-size:8.5px;color:var(--slate-soft);text-align:right;margin-top:4px;}

/* Global print watermark + footer — shown on every printed page except ID Card and Seat Plan,
   and suppressed on documents that already carry their own bespoke footer (Admission Form, Invoice, Admit Card). */
.print-watermark{display:none;}
.print-footer{display:none;}
@media print{
  .print-watermark{
    display:flex;position:fixed;inset:0;align-items:center;justify-content:center;
    z-index:1;pointer-events:none;
  }
  .print-watermark img{width:45%;max-width:320px;opacity:0.07;}
  .print-footer{
    display:block;position:fixed;left:0;right:0;bottom:6mm;
    text-align:center;padding-top:4px;border-top:1px dashed var(--line);
    font-size:8px;color:var(--slate-soft);margin:0 14mm;
  }
  body.no-print-watermark .print-watermark{display:none !important;}
  body.no-print-footer .print-footer{display:none !important;}
}

/* ===== Protyon (Certificate) — plain A4 Landscape page, no border/frame, font-size 16,
   background design from Settings. Deliberately does NOT draw any credit/footer line of its
   own (per requirement) — combined with usePrintChrome({hideFooter:true}) on the component,
   the printed certificate carries no "@Poweredby" text anywhere. ===== */
.protyon-print{
  font-size:16px; line-height:1.9; width:297mm; min-height:210mm; max-width:none;
  box-sizing:border-box; padding:22mm 28mm; margin:0 auto; position:relative; color:#000;
  border:none; border-radius:0; box-shadow:none; overflow:hidden;
}
@media print{
  .protyon-print{ width:100%; min-height:100vh; box-shadow:none; border:none; }
}
.protyon-content{ position:relative; z-index:1; }
.protyon-bg-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:contain; z-index:0; }
.protyon-title{
  text-align:center; font-family:'Fraunces',serif; font-size:30px; font-weight:800;
  letter-spacing:0.08em; margin-bottom:8px; text-transform:uppercase;
}
.protyon-title-underline{ width:110px; height:3px; background:var(--gold); margin:0 auto 30px; }
.protyon-body{ text-align:justify; }
.protyon-body b{ font-weight:700; }
.protyon-meta-row{ display:flex; justify-content:space-between; font-size:15px; margin-bottom:26px; }
.protyon-signatures{ display:flex; justify-content:flex-end; margin-top:80px; }
.protyon-sig{ text-align:center; width:220px; }
.protyon-sig-line{ border-top:1.5px solid #000; padding-top:6px; font-size:14px; font-weight:600; }

.id-card-grid{display:flex;flex-wrap:wrap;gap:0.2in;justify-content:flex-start;align-content:flex-start;}
@media print{
  .id-card-grid{gap:0.2in;}
}

/* ===== Admit Card — Width 8.5in × Height 5.5in, custom page sized to the card + 0.4in margin =====
   The usable print area is made very slightly larger than the card itself (a small buffer, not an
   exact match) — when a box is sized EXACTLY to the printable area, sub-pixel rounding in the
   print engine can push it a hair over and silently spill an extra, near-blank page after it. */
@page admit-card-page{size:9.36in 6.36in;margin:0.4in;}
.print-admit-card{page:admit-card-page;}
.admit-card-grid{display:flex;flex-direction:column;gap:0.4in;justify-content:flex-start;}
.admit-card-physical{
  width:8.5in;height:5.5in;background:#fff;position:relative;overflow:hidden;
  border:1px solid var(--line);box-shadow:var(--shadow-sm);
  break-inside:avoid;page-break-inside:avoid;padding:0.35in;
}
@media print{
  .admit-card-physical{box-shadow:none;}
  .admit-card-grid{gap:0;}
  .admit-card-physical{page-break-after:always;}
  .admit-card-physical:last-child{page-break-after:auto;}
}
.acp-border{border:1.5px solid var(--moss-deep);border-radius:3mm;padding:5mm 8mm;height:100%;display:flex;flex-direction:column;position:relative;z-index:1;}
.acp-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:2.4in;height:2.4in;object-fit:contain;opacity:0.07;z-index:0;pointer-events:none;
}
.acp-header,.acp-exam-line,.acp-title,.acp-fields,.acp-note,.acp-signatures,.acp-credit{position:relative;z-index:1;}
.acp-header{display:flex;align-items:flex-start;gap:4mm;border-bottom:1px dashed #000; padding-bottom:2mm;margin-bottom:2mm;}
.acp-logo,.acp-photo{width:20mm;height:24mm;flex-shrink:0;border:1px solid var(--line);border-radius:1mm;display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper);}
.acp-logo img,.acp-photo img{width:100%;height:100%;object-fit:cover;}
.acp-center{flex:1;text-align:center;}
.acp-school-name{font-family:'Fraunces',serif;font-size:17pt;font-weight:700;}
.acp-school-address{font-size:9pt; color:#010e06; margin-top:1px;}
.acp-school-phone{font-size:9pt; color:#010e06;}
.acp-exam-line{text-align:center;font-size:11pt;font-weight:600;margin-top:2mm;}
.acp-title{text-align:center;font-family:'Fraunces',serif;font-size:14pt;font-weight:700;margin:1mm 0 2mm;padding-bottom:2mm;border-bottom:1px dashed #000;}
/* Date sits above the student fields, right-aligned */
.acp-date-row{text-align:right;font-size:9pt;font-weight:600;color:var(--ink);margin-bottom:1.5mm;}
.acp-fields{font-size:10.5pt;margin-bottom:2mm;column-count:2;column-gap:10mm;}
.acp-note{font-size:7.6pt;color:#000;margin-top:15px;padding-top:2mm;line-height:1.4;}
.acp-note-title{font-weight:700;color:var(--ink);margin-bottom:1mm;}
.acp-note-list{margin:0;padding-left:3.5mm;}
.acp-note-list li{margin-bottom:0.5mm;}
.acp-signatures{display:flex;justify-content:space-between;margin-top:5mm;gap:60mm;padding:0 8mm;}
.acp-sig{border-top:1px solid var(--ink);padding-top:1mm;font-size:8pt;text-align:center;flex:1;line-height:1.5; margin-top: 42px;}
.acp-credit{text-align:right;font-size:7pt;color:var(--slate-soft);margin-top:1mm; padding-right: 15px;}

/* ===== Seat Plan card — 3in x 2in ===== */
.seat-card-grid{display:flex;flex-wrap:wrap;gap:0.12in;justify-content:flex-start;}
.seat-card-physical{
  width:3in;height:2in;background:#fff;border:1.2px solid var(--moss-deep);border-radius:0.08in;
  padding:0.1in;break-inside:avoid;page-break-inside:avoid;display:flex;flex-direction:column;
  box-shadow:var(--shadow-sm);position:relative;overflow:hidden;
}
@media print{ .seat-card-physical{box-shadow:none;} }
.scp-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:1.3in;height:1.3in;object-fit:contain;opacity:0.08;z-index:0;pointer-events:none;
}
.scp-school{font-family:'Fraunces',serif;font-size:9.5pt;font-weight:700;text-align:center;position:relative;z-index:1;}
.scp-address{font-size:6pt;color:var(--slate-soft);text-align:center;position:relative;z-index:1;}
.scp-exam{font-size:7.5pt;font-weight:600;text-align:center;margin:0.04in 0;padding-bottom:0.04in;border-bottom:1px dashed var(--line);position:relative;z-index:1;}
.scp-body{display:flex;gap:0.08in;flex:1;margin-top:0.04in;position:relative;z-index:1;}
.scp-photo{width:0.62in;height:0.75in;flex-shrink:0;border:1px solid var(--line);border-radius:0.03in;overflow:hidden;background:var(--paper);display:flex;align-items:center;justify-content:center;}
.scp-photo img{width:100%;height:100%;object-fit:cover;}
.scp-fields{flex:1;font-size:6.6pt;}

/* FieldRow (name|colon|value) uses a fixed 12.5px by default — override to inherit
   the much smaller card font sizes when nested inside ID/Admit/Seat cards. */
.id-card-physical .field-row,
.admit-card-physical .field-row,
.seat-card-physical .field-row{font-size:inherit;padding:4px 0;border-bottom:none;gap:3px;}
.id-card-physical .fr-colon,
.admit-card-physical .fr-colon,
.seat-card-physical .fr-colon{flex:0 0 8px;}

.field-form-title{text-align:center;margin-bottom:14px;}

/* Empty state */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--slate-soft);
}
.empty-state h4{color:var(--ink);margin-bottom:6px;}

/* Search bar */
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-input{
  flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;background:var(--paper-raised);
}
.filter-select{
  padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-raised);
}

/* Section header */
.section-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px;flex-wrap:wrap;}
.section-head h2{font-size:22px;}
.section-head p{font-size:13px;color:var(--slate-soft);margin-top:4px;max-width:520px;}
.section-actions{display:flex;justify-content:flex-end;align-items:center;margin-bottom:14px;gap:10px;flex-wrap:wrap;}

.id-card-preview{
  width:320px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);
  background:#fff;border:1px solid var(--line);
}
.id-card-head{background:var(--moss-deep);color:#fff;padding:14px 16px;text-align:center;}
.id-card-photo{
  width:88px;height:88px;border-radius:10px;background:var(--paper);margin:14px auto 8px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--line);
}
.id-card-photo img{width:100%;height:100%;object-fit:cover;}

/* Physical ID card: 2.2in x 3.2in (portrait) with a curved footer band showing school + phone */
.id-card-physical{
  width:2.2in;height:3.2in;border-radius:0.18in;overflow:hidden;position:relative;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;
  font-family:'Inter',sans-serif;
  break-inside:avoid;page-break-inside:avoid;
}
.id-card-physical .icp-head{
  background:#1a2b4a;color:#fff;text-align:center;
  padding:0.1in 0.12in 0.08in;flex-shrink:0;position:relative;z-index:1;
}
.id-card-physical .icp-head .icp-school{
  font-weight:800;text-transform:uppercase;letter-spacing:0.02em;
  color:#fff;text-shadow:0 1px 1px rgba(0,0,0,0.25);
  white-space:nowrap;width:100%;display:block;overflow:hidden;
  max-width:100%;
}
.id-card-physical .icp-head .icp-address{font-size:6pt;opacity:0.75;margin-top:1px;}
.id-card-physical .icp-head .icp-doctype{font-family:'Fraunces',serif;font-size:10.5pt;font-weight:600;margin-top:1px;}
.id-card-physical .icp-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:1.4in;height:1.4in;object-fit:contain;opacity:0.08;z-index:0;pointer-events:none;
}
.id-card-physical .icp-photo{
  width:0.85in;height:0.85in;border-radius:0.1in;overflow:hidden;margin:0.12in auto 0.06in;
  border:1px solid #010e06;background:var(--paper);
  display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;
}
.id-card-physical .icp-photo img{width:100%;height:100%;object-fit:cover;}
.id-card-physical .icp-name{font-weight:800;font-size:11pt;text-align:center;padding:0 0.1in;margin-bottom:0.08in;position:relative;z-index:1;}
.id-card-physical .icp-sub{font-size:7pt;color:var(--slate-soft);text-align:center;margin-bottom:0.06in;}
.id-card-physical .icp-body{flex:1;padding:0 0.14in;font-size:6.8pt;overflow:hidden;position:relative;z-index:1;}
.id-card-physical .icp-body .field-row{padding:2px 0;font-size:6.8pt;gap:3px;}
.id-card-physical .icp-body .fr-name,
.id-card-physical .icp-body .fr-colon,
.id-card-physical .icp-body .fr-value{color:#000;}
.id-card-physical .icp-perch-row{
  display:flex;justify-content:center;align-items:flex-end;
  padding:0 0.12in;transform: translateY(10px);
  position:relative;z-index:2;margin-top: -10px;
}
.id-card-physical .icp-footer{
  margin-top:0.14in;height:0.32in;background:#1a2b4a;color:#fff;
  padding:0.07in 0.1in;text-align:center;
  border-radius:0;box-sizing:border-box;
  flex-shrink:0;display:flex;align-items:center;justify-content:center;
  position:relative;z-index:1;
}
.id-card-physical .icp-footer-phone{font-size:6.8pt;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left: 20px;}
/* QR sits on its own, straddling the boundary between the white body and the navy footer band —
   not on the same line as the Principal's signature anymore. */
.id-card-physical .icp-qr{
  width:0.42in;height:0.42in;background:#fff;border-radius:0.06in;padding:2px;
  border:1.5px solid var(--line);position:absolute;bottom:0.11in;transform:translateX(25%);z-index:3;bottom: 2%;
}
.id-card-physical .icp-principal-sign{background:#fff;text-align:right; padding-right: 15px; flex-shrink:0;}
.id-card-physical .icp-sign-line{width:0.5in;border-top:1px solid var(--ink);margin:0 0 1px 150px;}
.id-card-physical .icp-sign-label{font-size:5.3pt;color:var(--ink);font-weight:700;white-space:nowrap;padding-right: 9px;}

.field-row{display:flex;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px;gap:6px;}
.field-row:last-child{border-bottom:none;}
.field-row .fr-name{flex:1;text-align:left;color:#000;}
.field-row .fr-colon{flex:0 0 14px;text-align:center;color:var(--slate-soft);}
.field-row .fr-value{flex:1.4;text-align:left;font-weight:600;}

.kv-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--slate-soft);}
.kv-row .v{font-weight:600;}

.link-btn{background:none;border:none;color:var(--moss);font-weight:600;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;background:var(--paper);border:1px solid var(--line);cursor:pointer;}
.chip.active{background:var(--moss);color:#fff;border-color:var(--moss);}

/* Editable line-item table used in the Invoice / Expense Voucher forms. This table is the
   ONLY element in those forms that carries a decorative border — every other field keeps
   the app's normal plain input look. */
.item-table-wrap{border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:4px 0 12px;}
.item-form-table{width:100%;border-collapse:collapse;font-size:13px;}
.item-form-table th{background:var(--paper);font-size:10.5px;text-transform:uppercase;letter-spacing:0.03em;color:var(--slate-soft);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);}
.item-form-table td{padding:4px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.item-form-table tbody tr:last-child td{border-bottom:none;}
.item-form-table td.itf-sl{width:38px;text-align:center;color:var(--slate-soft);font-size:12.5px;}
.item-form-table td.itf-amt{width:130px;}
.item-form-table td.itf-remove{width:34px;text-align:center;padding:4px 6px;}
.item-form-table input,.item-form-table select{
  width:100%;border:none;background:transparent;padding:6px 2px;font-size:13px;font-family:inherit;color:var(--ink);
}
.item-form-table input:focus,.item-form-table select:focus{outline:none;background:var(--moss-tint);border-radius:4px;}
.item-form-table td.itf-amt input{text-align:right;}
.item-table-add-row{margin-bottom:16px;}
.item-table-foot-row{display:flex;justify-content:space-between;align-items:center;padding:3px 0;font-size:13px;gap:10px;}
.item-table-foot-row.total{font-weight:700;font-size:14.5px;border-top:1px dashed var(--line);margin-top:5px;padding-top:8px;}
.item-table-foot-row input[type=number]{
  width:130px;text-align:right;border:1px solid var(--line);border-radius:6px;
  padding:6px 9px;font-size:13px;font-family:'IBM Plex Mono',monospace;background:var(--paper-raised);
}
.item-table-foot-row input[type=number]:focus{outline:none;border-color:var(--moss);}

.loading-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:var(--paper);
}
.spinner{
  width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--moss);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}

/* Public Student Status page (opened via ID card QR code) */
.status-page{
  min-height:100vh;background:var(--paper);padding:24px 14px;display:flex;justify-content:center;
}
.status-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius-lg);
  box-shadow:var(--shadow-md);padding:24px 20px;max-width:420px;width:100%;height:fit-content;
}
.status-header{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.status-logo{width:36px;height:36px;border-radius:8px;object-fit:cover;flex-shrink:0;}
.status-school-name{font-family:'Fraunces',serif;font-size:16px;font-weight:700;}
.status-photo-wrap{display:flex;justify-content:center;margin-bottom:10px;}

<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useLayoutEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

/* =========================================================
   CONFIG / SETTINGS STORAGE (localStorage — client config only,
   never used for school records, per storage rules)
   ========================================================= */
// ↓↓↓ EDIT THESE LINES WITH YOUR OWN VALUES ↓↓↓
const DEFAULT_SHEETS_URL = "https://script.google.com/macros/s/AKfycbyzJFfLWt1MhBP0vkK_xpBH5X5XIuCirxRUr3cqD8XGFh_iTEh5AbVf04eRjk11C7D3/exec";
const DEFAULT_SCHOOL_NAME = "Your School Name";
// ↑↑↑ EDIT THESE LINES WITH YOUR OWN VALUES ↑↑↑

const CONFIG_KEY = "sms_config_v1";
function loadConfig() {
  const defaults = {
    sheetsUrl: DEFAULT_SHEETS_URL.startsWith("PASTE_") ? "" : DEFAULT_SHEETS_URL,
    schoolName: DEFAULT_SCHOOL_NAME,
    schoolAddress: "",
    schoolPhones: ["", "", ""],
    schoolEmail: "",
    instituteCode: "",
    schoolLogo: "",
    facebookUrl: "",
    youtubeUrl: "",
    cashierName: "",
    cashierSignUrl: "",
    principalName: "",
    principalSignUrl: "",
    certificateBgUrl: "",
  };
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // if a URL was hardcoded above and nothing saved yet in this browser, prefer the hardcoded one
      if (!saved.sheetsUrl && DEFAULT_SHEETS_URL && !DEFAULT_SHEETS_URL.startsWith("PASTE_")) {
        saved.sheetsUrl = DEFAULT_SHEETS_URL;
      }
      // migrate legacy single-phone field
      if (!saved.schoolPhones && saved.schoolPhone) saved.schoolPhones = [saved.schoolPhone, "", ""];
      return { ...defaults, ...saved, schoolPhones: saved.schoolPhones || defaults.schoolPhones };
    }
  } catch (e) {}
  return defaults;
}
function saveConfig(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

/* =========================================================
   GOOGLE SHEETS API CLIENT
   ========================================================= */
async function sheetsCall(config, payload) {
  if (!config.sheetsUrl) throw new Error("NO_URL");
  const res = await fetch(config.sheetsUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error("HTTP_" + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

const SheetsAPI = {
  list: (config, sheet) => sheetsCall(config, { action: "list", sheet }),
  bulkGet: (config, sheets) => sheetsCall(config, { action: "bulkGet", sheets: sheets.join(",") }),
  upsert: (config, sheet, row) => sheetsCall(config, { action: "upsert", sheet, row }),
  remove: (config, sheet, id) => sheetsCall(config, { action: "delete", sheet, id }),
};

/* =========================================================
   FILE HANDLING — simplified, no GitHub API/token required.
   Workflow: user uploads the file to their GitHub repo manually
   (drag & drop on github.com), then pastes the resulting link here.
   As a fallback, small images can be embedded directly (base64).
   ========================================================= */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   TOAST SYSTEM
   ========================================================= */
const ToastContext = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type = "default") => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, message, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
  }, []);
  return (
    <ToastContext.Provider value={push}>
      {children}
      <div className="toast-stack no-print">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type}`}>{t.message}</div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
function useToast() { return useContext(ToastContext); }

function IconWrap({ name, ...rest }) {
  const C = Icon[name];
  return C ? <C {...rest} /> : null;
}

/* =========================================================
   DATA STORE — central hook wrapping Google Sheets as DB
   Collections: students, teachers, finance, fees, committee, seatplans
   ========================================================= */
const COLLECTIONS = ["students", "teachers", "finance", "zakat", "fees", "committee", "notices", "seatplans", "invoices", "promotions", "classHistories", "activations", "subjects", "marks", "attendance", "deletedStudents", "certificates"];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Local stale-while-revalidate cache: the last successful sync is saved here so the very next
// time the app opens, it can paint instantly with that data while a fresh sync happens quietly
// in the background — instead of showing empty lists for however long the Sheets round-trip
// takes. The cache is per-Sheets-URL so switching schools/URLs doesn't show stale mixed data.
const DATA_CACHE_PREFIX = "sms_data_cache_v1:";
function loadCachedData(sheetsUrl) {
  if (!sheetsUrl) return null;
  try {
    const raw = localStorage.getItem(DATA_CACHE_PREFIX + sheetsUrl);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveCachedData(sheetsUrl, data) {
  if (!sheetsUrl) return;
  try { localStorage.setItem(DATA_CACHE_PREFIX + sheetsUrl, JSON.stringify(data)); } catch (e) {}
}

const EMPTY_STORE_DATA = { students: [], teachers: [], finance: [], zakat: [], fees: [], committee: [], notices: [], seatplans: [], invoices: [], promotions: [], classHistories: [], activations: [], subjects: [], marks: [], attendance: [], deletedStudents: [], certificates: [] };

function useDataStore(config) {
  const cached = loadCachedData(config.sheetsUrl);
  const [data, setData] = useState(cached || EMPTY_STORE_DATA);
  // idle | loading | ready | error | offline — when a cached copy exists we start at "ready"
  // (showing stale-but-usable data immediately) instead of "loading" (which would show a blank/
  // syncing state even though the screen already has something useful to display).
  const [status, setStatus] = useState(cached ? "ready" : "idle");
  // Separate from `status`: true while a background sync is in flight even though cached data
  // is already on screen, so the sync pill can still say "Syncing…" without blanking the UI.
  const [syncing, setSyncing] = useState(false);
  const toast = useToast();

  const refresh = useCallback(async () => {
    if (!config.sheetsUrl) { setStatus("offline"); return; }
    // Only show the blocking "loading" state when there's nothing on screen yet; if we already
    // have cached data displayed, keep showing it and just sync quietly in the background.
    setStatus((s) => (s === "ready" ? "ready" : "loading"));
    setSyncing(true);
    try {
      const res = await SheetsAPI.bulkGet(config, COLLECTIONS.map(c => SHEET_MAP[c]));
      const mapped = {};
      COLLECTIONS.forEach(c => { mapped[c] = res.data[SHEET_MAP[c]] || []; });
      setData(mapped);
      setStatus("ready");
      saveCachedData(config.sheetsUrl, mapped);
    } catch (err) {
      console.error(err);
      // If we still have cached data on screen, don't flip the whole app into an error state —
      // just surface the toast and keep showing what we have.
      setStatus((s) => (s === "ready" ? "ready" : "error"));
      toast && toast("Couldn't reach Google Sheets. Check Settings.", "error");
    } finally {
      setSyncing(false);
    }
  }, [config.sheetsUrl]);

  useEffect(() => { refresh(); /* eslint-disable-next-line */ }, [config.sheetsUrl]);

  const save = useCallback(async (collection, record) => {
    const sheet = SHEET_MAP[collection];
    const withId = record.id ? record : { ...record, id: uid() };
    // optimistic update
    setData((d) => {
      const list = d[collection] || [];
      const idx = list.findIndex((r) => r.id === withId.id);
      const next = idx > -1 ? list.map((r, i) => (i === idx ? { ...r, ...withId } : r)) : [withId, ...list];
      const updated = { ...d, [collection]: next };
      saveCachedData(config.sheetsUrl, updated);
      return updated;
    });
    if (!config.sheetsUrl) { toast && toast("Saved locally (offline mode)"); return withId; }
    try {
      await SheetsAPI.upsert(config, sheet, withId);
      toast && toast("Saved", "success");
    } catch (err) {
      toast && toast("Save failed — will retry on refresh", "error");
    }
    return withId;
  }, [config.sheetsUrl]);

  const remove = useCallback(async (collection, id) => {
    const sheet = SHEET_MAP[collection];
    setData((d) => {
      const updated = { ...d, [collection]: (d[collection] || []).filter((r) => r.id !== id) };
      saveCachedData(config.sheetsUrl, updated);
      return updated;
    });
    if (!config.sheetsUrl) return;
    try {
      const res = await SheetsAPI.remove(config, sheet, id);
      // res.notFound means there was simply no row with this id on the server (e.g. a student
      // who never had a Promotion row yet) — not a failure, so it gets no toast either way,
      // rather than a misleading "Deleted" for something that was never there.
      if (res && res.notFound) return;
      toast && toast("Deleted", "success");
    } catch (err) {
      toast && toast("Delete failed on server", "error");
    }
  }, [config.sheetsUrl]);

  return { data, status, syncing, refresh, save, remove };
}

const SHEET_MAP = {
  students: "Students",
  teachers: "Teachers",
  finance: "Finance",
  zakat: "Zakat",
  fees: "MasterFees",
  committee: "Committee",
  notices: "Notices",
  seatplans: "SeatPlans",
  invoices: "Invoice",
  promotions: "Promotion",
  classHistories: "ClassHistory",
  activations: "Activation",
  subjects: "Subjects",
  marks: "Marks",
  attendance: "Attendance",
  deletedStudents: "DeletedStudents",
  certificates: "Certificates",
};

/* =========================================================
   SHARED UI PRIMITIVES
   ========================================================= */
function Modal({ title, onClose, children, footer, size }) {
  useEffect(() => {
    document.body.classList.add("modal-open");
    return () => document.body.classList.remove("modal-open");
  }, []);
  const overlay = (
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`modal ${size === "xl" ? "modal-xl" : size === "lg" ? "modal-lg" : ""}`}>
        <div className="modal-head no-print">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon.x /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot no-print">{footer}</div>}
      </div>
    </div>
  );
  // Render via portal so the modal is a sibling of .content in the DOM,
  // not a descendant — this lets print CSS hide the page behind it
  // without also hiding the modal (and its document) itself.
  return ReactDOM.createPortal(overlay, document.body);
}

// Toggles body classes while a component is mounted, so the shared print watermark/footer
// behave correctly for special-case documents:
// - ID Card and Seat Plan: no watermark, no footer at all (their own compact card design has no room for either).
// - Admission Form, Fee Invoice, Admit Card: keep the watermark, but suppress the shared footer
//   since these already print their own dedicated credit line — avoids showing it twice.
function usePrintChrome({ hideWatermark = false, hideFooter = false } = {}) {
  useEffect(() => {
    if (hideWatermark) document.body.classList.add("no-print-watermark");
    if (hideFooter) document.body.classList.add("no-print-footer");
    return () => {
      document.body.classList.remove("no-print-watermark");
      document.body.classList.remove("no-print-footer");
    };
  }, [hideWatermark, hideFooter]);
}

// Rendered once, globally: a faint institution-logo watermark and a small credit footer
// on every printed page, with exceptions handled via usePrintChrome (see above).
function GlobalPrintChrome({ config }) {
  const node = (
    <>
      {config.schoolLogo && (
        <div className="print-watermark"><img src={config.schoolLogo} alt="" /></div>
      )}
      <div className="print-footer">@PoweredBy: AM Shahed: 01605-721296</div>
    </>
  );
  return ReactDOM.createPortal(node, document.body);
}

}

}

function FieldRow({ name, value }) {

      <div className="fr-colon">:</div>

}

// Shared print-only header for list/table printouts: institution name, address, then a data headline.
// Never shown on screen — only appears when printing (via .print-only), keeping list/table print
// output limited to institution identity + headline + table, with no buttons/search/filters.
function PrintDocHead({ config, headline, layout }) {
  if (layout === "inline") {
    return (
      <div className="print-only" style={{ padding: "0 18px 10px", borderBottom: "2px solid var(--moss-deep)", marginBottom: 10 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 14 }}>
          {config && config.schoolLogo && <img src={config.schoolLogo} alt="" style={{ height: 56, flexShrink: 0 }} />}
          <div style={{ textAlign: "left" }}>
            <div style={{ fontFamily: "'Fraunces',serif", fontSize: 26, fontWeight: 700, lineHeight: 1.15 }}>{(config && config.schoolName) || "School Name"}</div>
            {config && config.schoolAddress && <div style={{ fontSize: 12, color: "var(--slate-soft)", marginTop: 2 }}>{config.schoolAddress}</div>}
          </div>
        </div>
        {headline && <div style={{ fontSize: 13, fontWeight: 600, marginTop: 8, textAlign: "center" }}>{headline}</div>}
      </div>
    );
  }
  // Logo pinned to the far left (absolutely positioned) while the name/address/headline block
  // stays truly centered on the page — as opposed to "inline" above, where the name sits
  // left-aligned next to the logo instead of centered.
  if (layout === "logo-left") {
    return (

// Google Sheets returns numeric-looking cell values (roll numbers, phone numbers, etc.)
// as JS numbers, not strings — calling .toLowerCase() on those crashes the whole render.
// Always coerce through this before any string method.
function str(v) { return v === null || v === undefined ? "" : String(v); }

function money(n) {
  const num = Number(n) || 0;
  return num.toLocaleString(undefined, { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

function fmtDate(d) {
  if (!d) return "—";
  try {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  } catch (e) { return d; }
}

// Age as of the admission date (years + months), computed from date of birth.
function calcAge(dob, asOfDate) {
  if (!dob) return "—";
  const birth = new Date(dob);
  const asOf = asOfDate ? new Date(asOfDate) : new Date();
  if (isNaN(birth.getTime()) || isNaN(asOf.getTime())) return "—";
  let years = asOf.getFullYear() - birth.getFullYear();
  let months = asOf.getMonth() - birth.getMonth();
  if (asOf.getDate() < birth.getDate()) months -= 1;
  if (months < 0) { years -= 1; months += 12; }
  if (years < 0) return "—";
  return `${years}y ${months}m`;
}

// Resizes an image client-side (max dimension) before upload, to keep Drive uploads fast
// and avoid huge base64 payloads over the wire.
function resizeImageFile(file, maxDim) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        resolve({ base64: dataUrl.split(",")[1], mimeType: "image/jpeg", dataUrl });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function PhotoBox({ label, folder, config, onUploaded, existingUrl }) {
  const toast = useToast();
  const [preview, setPreview] = useState(existingUrl || "");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef();

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true);
    try {
      const { base64, mimeType, dataUrl } = await resizeImageFile(file, 500);
      setPreview(dataUrl); // instant local preview while uploading
      if (config && config.sheetsUrl) {
        const filename = `${Date.now()}.jpg`;
        try {
          const res = await sheetsCall(config, { action: "uploadImage", folder: folder || "misc", filename, base64, mimeType });
          if (res && res.url) {
            setPreview(res.url);
            onUploaded(res.url);
          } else {
            throw new Error((res && res.error) || "Upload failed");
          }
        } catch (uploadErr) {
          // Drive upload failed (e.g. permission not yet granted on the Apps Script) —
          // fall back to a smaller embedded thumbnail so the photo still saves and shows,
          // rather than losing the photo entirely.
          console.error("Drive upload failed, using embedded fallback:", uploadErr);
          const small = await resizeImageFile(file, 160);
          onUploaded(small.dataUrl);
          toast && toast("Couldn't upload to Drive (check Apps Script permissions) — saved a small embedded copy instead", "error");
        }
      } else {
        // Offline mode — no backend configured, keep the (small, resized) data URL locally only.
        onUploaded(dataUrl);
        toast && toast("No Google Sheets connection — photo kept locally only", "error");
      }
    } catch (err) {
      console.error(err);
      toast && toast("Photo upload failed: " + err.message, "error");
    }
    setBusy(false);
  }

  return (
    <div className="form-field">
      <label>{label}</label>
      <div className="photo-box" onClick={() => !busy && inputRef.current.click()}>
        {busy ? (
          <div className="photo-box-placeholder"><div className="spinner" style={{ width: 20, height: 20 }} /></div>
        ) : preview ? <img src={preview} alt="" /> : (
          <div className="photo-box-placeholder">
            <Icon.students width={26} height={26} />
            <span>Click to select photo</span>
          </div>
        )}
      </div>
      <input ref={inputRef} type="file" style={{ display: "none" }} onChange={handleFile} accept="image/*" />
    </div>
  );
}

// Subject category, used for GPA rules AND for how many mark-boxes that subject gets:
//  - Main Compulsory → one mark box (full marks)
//  - Main Elective   → two mark boxes, MCQ + CQ, which together make up the 100 full marks
//  - Optional        → one mark box (the 4th/additional subject — only ever ADDS bonus GPA
//                       points, it never fails the result)
// Any F among the Main subjects (Compulsory or Elective) fails the whole result.
const SUBJECT_CATEGORIES = ["Main Compulsory", "Main Elective", "Optional"];

// Bangladesh-board-style letter-grade / grade-point scale — used for every subject, and for
// the overall Final GPA on Result sheets and Marksheets.
const GRADE_SCALE = [
  { min: 80, letter: "A+", point: 5.0 },
  { min: 70, letter: "A", point: 4.0 },
  { min: 60, letter: "A-", point: 3.5 },
  { min: 50, letter: "B", point: 3.0 },
  { min: 40, letter: "C", point: 2.0 },
  { min: 33, letter: "D", point: 1.0 },
  { min: 0, letter: "F", point: 0.0 },
];
function gradeFromPercent(pct) {
  const p = Number(pct) || 0;
  return GRADE_SCALE.find(g => p >= g.min) || GRADE_SCALE[GRADE_SCALE.length - 1];
}
function gradeFromMarks(obtained, full) {
  const f = Number(full) || 100;
  const pct = f > 0 ? ((Number(obtained) || 0) / f) * 100 : 0;
  return gradeFromPercent(pct);
}
// Maps a computed GPA value back onto the nearest grade letter at or below it — needed for
// the Final GPA, which can land between two scale steps once the optional-subject bonus is added.
function gradeFromPoint(pt) {
  const p = Number(pt) || 0;
  return GRADE_SCALE.find(g => p >= g.point) || GRADE_SCALE[GRADE_SCALE.length - 1];
}

// A "Main Elective" subject has two mark boxes (MCQ + CQ, summing to its full marks); every
// other category has just one. These two helpers keep that rule in exactly one place.
// "1st Model Examination" etc. vs "1st Semester Examination" etc. — detected by name so no
// separate Exam Type field is needed; Model exams use ONE full-marks value for every subject
// in the class (set once per Subject Setup group) instead of each subject's own Semester marks.
function isModelExam(examName) {
  return /model/i.test(examName || "");
}
function subjectFullMarks(subject, isModel, modelExamMarks) {
  if (isModel) return Number(modelExamMarks) || 50;
  return subject.category === "Main Elective"
    ? (Number(subject.mcq) || 0) + (Number(subject.cq) || 0)
    : (Number(subject.marks) || 100);
}
function subjectObtainedMarks(subject, cell, isModel) {
  if (!isModel && subject.category === "Main Elective") {
    const c = cell || {};
    return (Number(c.mcq) || 0) + (Number(c.cq) || 0);
  }
  return Number(cell) || 0;
}

// Every class-year's Subject Setup is stored as ONE record with a `rows` array (one row per
// subject, column-wise) — this flattens that into a plain list of subjects, each carrying a
// stable synthetic id ("<groupId>-<rowIndex>") used to key marks entries.
function getClassSubjects(subjectGroups, className, year) {
  const group = (subjectGroups || []).find(g => g.className === className && String(g.year) === String(year));
  if (!group) return [];
  return (group.rows || []).map((r, i) => ({ ...r, id: `${group.id}-${i}` }));
}
// The Model Exam's single full-marks value lives on the Subject Setup group itself (one value
// for the whole class, not per subject) — defaults to 50 for groups saved before this existed.
function getModelExamMarks(subjectGroups, className, year) {
  const group = (subjectGroups || []).find(g => g.className === className && String(g.year) === String(year));
  return (group && Number(group.modelExamMarks)) || 50;
}

// Computes one student's overall result for a Class+Year+Exam from their entered marks and
// that class's subject list. Follows the standard Bangladesh-board convention: an F in any
// Main subject fails the whole result; an Optional ("4th") subject only ever ADDS bonus GPA
// points (the portion of its grade point above 2.0) — it never fails the student.
function computeStudentResult(marksRow, subjects, isModel, modelExamMarks) {
  const marks = (marksRow && marksRow.marks) || {};
  const subjectResults = subjects.map(s => {
    const obtained = subjectObtainedMarks(s, marks[s.id], isModel);
    const full = subjectFullMarks(s, isModel, modelExamMarks);
    return { subject: s, obtained, full, grade: gradeFromMarks(obtained, full) };
  });
  const mainResults = subjectResults.filter(r => r.subject.category !== "Optional");
  const optResults = subjectResults.filter(r => r.subject.category === "Optional");

  const anyMainFail = mainResults.some(r => r.grade.point === 0);
  const mainGpa = mainResults.length ? sumBy(mainResults, r => r.grade.point) / mainResults.length : 0;
  const optBonus = sumBy(optResults, r => Math.max(0, r.grade.point - 2));
  const optGpa = optResults.length ? sumBy(optResults, r => r.grade.point) / optResults.length : 0;

  const finalGpa = Math.round((anyMainFail ? 0 : Math.min(5, mainGpa + optBonus)) * 100) / 100;
  const finalGrade = anyMainFail ? "F" : gradeFromPoint(finalGpa).letter;

  return {
    subjectResults,
    mainGpa: Math.round(mainGpa * 100) / 100,
    optGpa: Math.round(optGpa * 100) / 100,
    finalGpa, finalGrade, isFail: anyMainFail,
    totalObtained: sumBy(subjectResults, r => r.obtained),
    totalFull: sumBy(subjectResults, r => r.full),
  };
}

// Ranks an array of { student, result, attendance? } objects. Passed students are ranked
// first — by Final GPA (desc), then total obtained (desc), then classes attended (desc) —
// and failed students are ranked afterwards, continuing the same numbering and using the
// same tiebreak order among themselves. Ties (identical GPA/Obtained/Attendance) share a rank.
function rankResults(list) {
  const attended = (r) => (r.attendance ? Number(r.attendance.attended) || 0 : 0);
  const cmp = (a, b) => (b.result.finalGpa - a.result.finalGpa) || (b.result.totalObtained - a.result.totalObtained) || (attended(b) - attended(a));

  function assignRanks(arr, startRank) {
    const sorted = [...arr].sort(cmp);
    let rank = startRank, lastKey = null, shown = startRank - 1;
    return sorted.map((r) => {
      shown++;
      const key = `${r.result.finalGpa}|${r.result.totalObtained}|${attended(r)}`;
      if (key !== lastKey) { rank = shown; lastKey = key; }
      return { ...r, rank };
    });
  }

  const passed = list.filter(r => !r.result.isFail);
  const failed = list.filter(r => r.result.isFail);
  const rankedPassed = assignRanks(passed, 1);
  const nextStart = rankedPassed.length ? Math.max(...rankedPassed.map(r => r.rank)) + 1 : 1;
  const rankedFailed = assignRanks(failed, nextStart);
  return [...rankedPassed, ...rankedFailed];
}

// Short, automatic remark for a student's result — based on Final Grade, so it always stays
// consistent with the computed GPA without needing a teacher to type anything.
function autoComment(result) {
  if (result.isFail) return "Needs Improvement";
  switch (result.finalGrade) {
    case "A+": return "Outstanding";
    case "A": return "Excellent";
    case "A-": return "Very Good";
    case "B": return "Good";
    case "C": return "Average";
    case "D": return "Needs Improvement";
    default: return "—";
  }
}
