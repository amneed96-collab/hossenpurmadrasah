<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidyalaya — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1c2521;
  --paper:#f6f4ee;
  --paper-raised:#ffffff;
  --slate:#3d4a45;
  --slate-soft:#6b7770;
  --line:#dcd8cc;
  --moss:#3f6b52;
  --moss-deep:#2c4d3a;
  --moss-tint:#e7efe8;
  --clay:#b8562f;
  --clay-tint:#f7e9e0;
  --gold:#c8963e;
  --gold-tint:#f6edd9;
  --red:#b0403a;
  --red-tint:#f7e4e2;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(28,37,33,0.06);
  --shadow-md:0 4px 16px rgba(28,37,33,0.08);
  --shadow-lg:0 12px 40px rgba(28,37,33,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
}
.mono{font-family:'IBM Plex Mono',monospace;}
#root{min-height:100vh;}
::selection{background:var(--moss-tint);color:var(--moss-deep);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--slate-soft);}

/* ===== App Shell ===== */
.app-shell{display:flex;min-height:100vh;}

.sidebar{
  width:248px;
  flex-shrink:0;
  background:var(--moss-deep);
  color:#eef2ee;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar-brand{
  padding:22px 20px 16px;
  display:flex;
  align-items:center;
  gap:10px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}
.sidebar-brand-mark{
  width:34px;height:34px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold),#dba94f);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:17px;color:var(--moss-deep);
  flex-shrink:0;
}
.sidebar-brand-text{font-family:'Fraunces',serif;font-size:17px;font-weight:600;line-height:1.1;}
.sidebar-brand-sub{font-size:10.5px;color:#a9c2b2;text-transform:uppercase;letter-spacing:0.08em;margin-top:2px;}

.sidebar-nav{flex:1;overflow-y:auto;padding:14px 12px;}
.sidebar-group-label{
  font-size:10.5px;text-transform:uppercase;letter-spacing:0.09em;
  color:#87a291;padding:14px 10px 6px;font-weight:600;
}
.sidebar-item{
  display:flex;align-items:center;gap:10px;
  padding:9px 10px;border-radius:8px;
  font-size:13.5px;font-weight:500;color:#d3e0d7;
  cursor:pointer;border:none;background:transparent;width:100%;text-align:left;
  transition:background .12s ease, color .12s ease;
  margin-bottom:2px;
}
.sidebar-item:hover{background:rgba(255,255,255,0.07);color:#fff;}
.sidebar-item.active{background:var(--gold);color:var(--moss-deep);font-weight:600;}
.sidebar-item svg{flex-shrink:0;opacity:0.9;}
.sidebar-foot{
  padding:14px 18px 18px;border-top:1px solid rgba(255,255,255,0.08);
  font-size:11.5px;color:#8ba798;
}
.sidebar-foot button{
  background:none;border:1px solid rgba(255,255,255,0.18);color:#d3e0d7;
  padding:6px 10px;border-radius:7px;font-size:11.5px;margin-top:8px;width:100%;
}
.sidebar-foot button:hover{background:rgba(255,255,255,0.08);}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:62px;flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;background:var(--paper-raised);
  position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.sync-pill{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--slate-soft);
  padding:5px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line);
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--moss);}
.sync-dot.pending{background:var(--gold);}
.sync-dot.error{background:var(--red);}

.content{padding:26px;flex:1;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink);font-size:13.5px;font-weight:600;
  transition:all .12s ease;
}
.btn:hover{border-color:var(--slate-soft);background:var(--paper);}
.btn-primary{background:var(--moss);border-color:var(--moss);color:#fff;}
.btn-primary:hover{background:var(--moss-deep);border-color:var(--moss-deep);}
.btn-clay{background:var(--clay);border-color:var(--clay);color:#fff;}
.btn-clay:hover{background:#96461f;}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-tint);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-icon{padding:8px;}

/* ===== Cards / Layout ===== */
.card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);
}
.card-flush{padding:0;overflow:hidden;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.stat-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;position:relative;overflow:hidden;
}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--slate-soft);font-weight:600;}
.stat-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin-top:6px;}
.stat-sub{font-size:12px;color:var(--slate-soft);margin-top:4px;}
.stat-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.span-2{grid-column:span 2;}
.form-field label{font-size:12px;font-weight:600;color:var(--slate);}
.form-field .hint{font-size:11px;color:var(--slate-soft);font-weight:400;}
.form-field input[type=text],
.form-field input[type=number],
.form-field input[type=date],
.form-field input[type=email],
.form-field input[type=tel],
.form-field input[type=password],
.form-field select,
.form-field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  font-size:13.5px;background:var(--paper-raised);color:var(--ink);
  outline:none;transition:border-color .12s;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--moss);}
.form-field textarea{resize:vertical;min-height:70px;}
.file-drop{
  border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;
  font-size:12.5px;color:var(--slate-soft);background:var(--paper);cursor:pointer;
}
.file-drop:hover{border-color:var(--moss);}
.file-drop img{max-height:80px;border-radius:6px;margin-bottom:6px;}

/* ===== Table ===== */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--slate-soft);font-weight:600;
  border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:hover{background:var(--paper);}
tbody tr:last-child td{border-bottom:none;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:600;
}
.badge-green{background:var(--moss-tint);color:var(--moss-deep);}
.badge-gold{background:var(--gold-tint);color:#8a6318;}
.badge-red{background:var(--red-tint);color:var(--red);}
.badge-slate{background:var(--paper);color:var(--slate-soft);border:1px solid var(--line);}

/* ===== Tabs ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tab{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--slate-soft);
  border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.active{color:var(--moss-deep);border-bottom-color:var(--moss);}
.tab:hover:not(.active){color:var(--ink);}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(28,37,33,0.5);
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;z-index:100;
}
.modal{
  background:var(--paper-raised);border-radius:var(--radius-lg);width:100%;max-width:680px;
  box-shadow:var(--shadow-lg);
}
.modal.modal-lg{max-width:920px;}
.modal-head{
  padding:18px 24px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{font-size:18px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--slate-soft);padding:4px;}
.modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

/* ===== Toast ===== */
.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;
  box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;min-width:220px;
  animation:toastIn .18s ease;
}
.toast.error{background:var(--red);}
.toast.success{background:var(--moss-deep);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== Print Templates ===== */
.print-only{display:none;}
@media print{
  .app-shell > .sidebar, .topbar, .no-print{display:none !important;}
  .content{padding:0;}
  .print-only{display:block;}
}
.doc-preview{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;max-width:640px;margin:0 auto;
}

/* Empty state */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--slate-soft);
}
.empty-state h4{color:var(--ink);margin-bottom:6px;}

/* Search bar */
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-input{
  flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;background:var(--paper-raised);
}
.filter-select{
  padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-raised);
}

/* Section header */
.section-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px;flex-wrap:wrap;}
.section-head h2{font-size:22px;}
.section-head p{font-size:13px;color:var(--slate-soft);margin-top:4px;max-width:520px;}

.id-card-preview{
  width:320px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);
  background:#fff;border:1px solid var(--line);
}
.id-card-head{background:var(--moss-deep);color:#fff;padding:14px 16px;text-align:center;}
.id-card-photo{
  width:88px;height:88px;border-radius:10px;background:var(--paper);margin:14px auto 8px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--line);
}
.id-card-photo img{width:100%;height:100%;object-fit:cover;}

.kv-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--slate-soft);}
.kv-row .v{font-weight:600;}

.link-btn{background:none;border:none;color:var(--moss);font-weight:600;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;background:var(--paper);border:1px solid var(--line);cursor:pointer;}
.chip.active{background:var(--moss);color:#fff;border-color:var(--moss);}

.loading-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:var(--paper);
}
.spinner{
  width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--moss);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

/* =========================================================
   CONFIG / SETTINGS STORAGE (localStorage — client config only,
   never used for school records, per storage rules)
   ========================================================= */
// ↓↓↓ EDIT THESE TWO LINES WITH YOUR OWN VALUES ↓↓↓
const DEFAULT_SHEETS_URL = "https://script.google.com/macros/s/AKfycbyzJFfLWt1MhBP0vkK_xpBH5X5XIuCirxRUr3cqD8XGFh_iTEh5AbVf04eRjk11C7D3/exec";
const DEFAULT_SCHOOL_NAME = "হোসেনপুরস স্বতন্ত্র ইবতেদায়ী মাদরাসা";
// ↑↑↑ EDIT THESE TWO LINES WITH YOUR OWN VALUES ↑↑↑

const CONFIG_KEY = "sms_config_v1";
function loadConfig() {
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // if a URL was hardcoded above and nothing saved yet in this browser, prefer the hardcoded one
      if (!saved.sheetsUrl && DEFAULT_SHEETS_URL && !DEFAULT_SHEETS_URL.startsWith("PASTE_")) {
        saved.sheetsUrl = DEFAULT_SHEETS_URL;
      }
      return saved;
    }
  } catch (e) {}
  return {
    sheetsUrl: DEFAULT_SHEETS_URL.startsWith("PASTE_") ? "" : DEFAULT_SHEETS_URL,
    schoolName: DEFAULT_SCHOOL_NAME,
  };
}
function saveConfig(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

/* =========================================================
   GOOGLE SHEETS API CLIENT
   ========================================================= */
async function sheetsCall(config, payload) {
  if (!config.sheetsUrl) throw new Error("NO_URL");
  const res = await fetch(config.sheetsUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error("HTTP_" + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

const SheetsAPI = {
  list: (config, sheet) => sheetsCall(config, { action: "list", sheet }),
  bulkGet: (config, sheets) => sheetsCall(config, { action: "bulkGet", sheets: sheets.join(",") }),
  upsert: (config, sheet, row) => sheetsCall(config, { action: "upsert", sheet, row }),
  remove: (config, sheet, id) => sheetsCall(config, { action: "delete", sheet, id }),
};

/* =========================================================
   FILE HANDLING — simplified, no GitHub API/token required.
   Workflow: user uploads the file to their GitHub repo manually
   (drag & drop on github.com), then pastes the resulting link here.
   As a fallback, small images can be embedded directly (base64).
   ========================================================= */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

/* =========================================================
   TOAST SYSTEM
   ========================================================= */
const ToastContext = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type = "default") => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, message, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
  }, []);
  return (
    <ToastContext.Provider value={push}>
      {children}
      <div className="toast-stack no-print">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type}`}>{t.message}</div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
function useToast() { return useContext(ToastContext); }

/* =========================================================
   ICONS (inline SVG, minimal line set)
   ========================================================= */
const Icon = {
  dashboard: (p)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>,
  students: (p)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M22 10L12 5 2 10l10 5 10-5Z"/><path d="M6 12.5V17c0 1.5 3 3 6 3s6-1.5 6-3v-4.5"/></svg>,
  teachers: (p)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>,
  finance: (p)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5a2.5 2.5 0 0 1 2.5-1.5c1.5 0 2.5.8 2.5 2s-1 1.5-2.5 2-2.5.8-2.5 2 1 2 2.5 2a2.5 2.5 0 0 0 2.5-1.5"/></svg>,
  due: (p)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>,
  fee: (p)=><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" {...p}><path d="M20 6H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V7a1 1 0 0 0-1-1Z"/><path d="M3 10h18M7 15h4"/></svg>,

/* =========================================================
   DATA STORE — central hook wrapping Google Sheets as DB
   Collections: students, teachers, finance, fees, committee, seatplans
   ========================================================= */
const COLLECTIONS = ["students", "teachers", "finance", "fees", "committee", "seatplans"];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function useDataStore(config) {
  const [data, setData] = useState({ students: [], teachers: [], finance: [], fees: [], committee: [], seatplans: [] });
  const [status, setStatus] = useState("idle"); // idle | loading | ready | error | offline
  const toast = useToast();

  const refresh = useCallback(async () => {
    if (!config.sheetsUrl) { setStatus("offline"); return; }
    setStatus("loading");
    try {
      const res = await SheetsAPI.bulkGet(config, COLLECTIONS.map(c => SHEET_MAP[c]));
      const mapped = {};
      COLLECTIONS.forEach(c => { mapped[c] = res.data[SHEET_MAP[c]] || []; });
      setData(mapped);
      setStatus("ready");
    } catch (err) {
      console.error(err);
      setStatus("error");
      toast && toast("Couldn't reach Google Sheets. Check Settings.", "error");
    }
  }, [config.sheetsUrl]);

  useEffect(() => { refresh(); /* eslint-disable-next-line */ }, [config.sheetsUrl]);

  const save = useCallback(async (collection, record) => {
    const sheet = SHEET_MAP[collection];
    const withId = record.id ? record : { ...record, id: uid() };
    // optimistic update
    setData((d) => {
      const list = d[collection] || [];
      const idx = list.findIndex((r) => r.id === withId.id);
      const next = idx > -1 ? list.map((r, i) => (i === idx ? { ...r, ...withId } : r)) : [withId, ...list];
      return { ...d, [collection]: next };
    });
    if (!config.sheetsUrl) { toast && toast("Saved locally (offline mode)"); return withId; }
    try {
      await SheetsAPI.upsert(config, sheet, withId);
      toast && toast("Saved", "success");
    } catch (err) {
      toast && toast("Save failed — will retry on refresh", "error");
    }
    return withId;
  }, [config.sheetsUrl]);

  const remove = useCallback(async (collection, id) => {
    const sheet = SHEET_MAP[collection];
    setData((d) => ({ ...d, [collection]: (d[collection] || []).filter((r) => r.id !== id) }));
    if (!config.sheetsUrl) return;
    try {
      await SheetsAPI.remove(config, sheet, id);
      toast && toast("Deleted", "success");
    } catch (err) {
      toast && toast("Delete failed on server", "error");
    }
  }, [config.sheetsUrl]);

  return { data, status, refresh, save, remove };
}

const SHEET_MAP = {
  students: "Students",
  teachers: "Teachers",
  finance: "Finance",
  fees: "MasterFees",
  committee: "Committee",
  seatplans: "SeatPlans",
};

function money(n) {

function fmtDate(d) {
  if (!d) return "—";
  try {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  } catch (e) { return d; }
}

function FileUploadField({ label, folder, onUploaded, config, existingUrl }) {
  const toast = useToast();
  const [preview, setPreview] = useState(existingUrl || "");
  const inputRef = useRef();

  function handleLinkChange(e) {
    const val = e.target.value;
    setPreview(val);
    onUploaded(val);
  }

  async function handleEmbed(e) {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const base64 = await fileToBase64(file);
      const dataUrl = `data:${file.type};base64,${base64}`;
      setPreview(dataUrl);
      onUploaded(dataUrl);
      toast && toast("Photo embedded (no link needed)");
    } catch (err) {
      toast && toast("Couldn't read file: " + err.message, "error");
    }
  }

  return (
    <div className="form-field span-2">
      <label>{label}</label>
      <div style={{ display: "flex", gap: 8, alignItems: "center" }}>
        <input
          type="text"
          placeholder={`Paste GitHub (or any) link here — e.g. after uploading to /${folder} on GitHub`}
          value={preview.startsWith("data:") ? "" : preview}
          onChange={handleLinkChange}
          style={{ flex: 1 }}
        />
        <button type="button" className="btn btn-sm" onClick={() => inputRef.current.click()}>
          Or embed a file
        </button>
      </div>
      <input ref={inputRef} type="file" style={{ display: "none" }} onChange={handleEmbed} accept="image/*,.pdf" />
      {preview && (
        <div className="file-drop" style={{ marginTop: 8, cursor: "default" }}>
          {preview.startsWith("data:image") || /\.(png|jpg|jpeg|webp|gif)$/i.test(preview) ? (
            <img src={preview} alt="" onError={(e) => { e.target.style.display = "none"; }} />
          ) : null}
          <div style={{ wordBreak: "break-all", fontSize: 11.5 }}>{preview.startsWith("data:") ? "Embedded file attached" : preview}</div>
        </div>
      )}
    </div>
  );
}

/* =========================================================
   DERIVED / COMPUTED HELPERS (dues, totals)
   ========================================================= */
function studentDue(student) {
  const totalFee = Number(student.totalFee) || 0;
  const paid = Number(student.paidAmount) || 0;
  return Math.max(0, totalFee - paid);
}
function teacherDue(teacher) {
  const totalSalary = (Number(teacher.basicSalary) || 0) + (Number(teacher.allowance) || 0);
  const paid = Number(teacher.paidAmount) || 0;
  return Math.max(0, totalSalary - paid);
}
function sumBy(arr, fn) { return arr.reduce((s, x) => s + (Number(fn(x)) || 0), 0); }

function withinRange(dateStr, range) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  const now = new Date();
  if (range === "daily") {
    return d.toDateString() === now.toDateString();
  }
  if (range === "monthly") {
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }
  if (range === "yearly") {
    return d.getFullYear() === now.getFullYear();
  }
  return true;
}

  const totalIncome = sumBy(finance.filter(f => f.type === "income"), f => f.amount);
  const totalExpense = sumBy(finance.filter(f => f.type === "expense"), f => f.amount);
  const studentDueTotal = sumBy(students, studentDue);
  const teacherDueTotal = sumBy(teachers, teacherDue);

  const monthIncome = sumBy(finance.filter(f => f.type === "income" && withinRange(f.date, "monthly")), f => f.amount);
  const monthExpense = sumBy(finance.filter(f => f.type === "expense" && withinRange(f.date, "monthly")), f => f.amount);

  const classCounts = {};
  students.forEach(s => { classCounts[s.className] = (classCounts[s.className] || 0) + 1; });

  const recentFinance = [...finance].sort((a, b) => new Date(b.date || b.createdAt) - new Date(a.date || a.createdAt)).slice(0, 6);

  return (
    <div>
      <div className="section-head">
        <div>
          <h2>Dashboard</h2>

        <StatCard label="This Month's Income" value={"৳" + money(monthIncome)} sub={`All-time: ৳${money(totalIncome)}`} accent="var(--gold)" />
        <StatCard label="This Month's Expense" value={"৳" + money(monthExpense)} sub={`All-time: ৳${money(totalExpense)}`} accent="var(--red)" />
      </div>

      <div className="grid grid-2" style={{ marginBottom: 20 }}>
        <div className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <h3 style={{ fontSize: 15 }}>Outstanding Dues</h3>
            <button className="link-btn" onClick={() => setActiveModule("due")}>View all →</button>
          </div>
          <div className="kv-row"><span className="k">Student fee dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(studentDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Teacher salary dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(teacherDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Total outstanding</span><span className="v">৳{money(studentDueTotal + teacherDueTotal)}</span></div>
        </div>

        <div className="card">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>
            <h3 style={{ fontSize: 15 }}>Students by Class</h3>
            <button className="link-btn" onClick={() => setActiveModule("students")}>Manage →</button>
          </div>
          {Object.keys(classCounts).length === 0 ? (
            <EmptyState title="No students yet" sub="Add your first student to see class-wise distribution." />
          ) : (
            CLASSES.filter(c => classCounts[c]).map(c => (
              <div className="kv-row" key={c}><span className="k">{c}</span><span className="v">{classCounts[c]} students</span></div>
            ))
          )}
        </div>
      </div>

      <div className="card">
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 14 }}>

function DocShell({ title, onClose, children, filename }) {
  function handlePrint() { window.print(); }
  function handleDownloadPdf() {
    const node = document.getElementById("doc-capture-area");
    if (!node || !window.jspdf) { window.print(); return; }
    const { jsPDF } = window.jspdf;
    // Simple text-based fallback isn't ideal for styled content; use print dialog as primary path.
    window.print();
  }
  return (
    <Modal title={title} onClose={onClose} size="lg"
      footer={<>
        <button className="btn" onClick={onClose}>Close</button>
        <button className="btn btn-primary" onClick={handlePrint}><Icon.print />Print / Save as PDF</button>
      </>}>
      <div id="doc-capture-area">{children}</div>
    </Modal>
  );
}

/* =========================================================
   REPORTS MODULE
   ========================================================= */
function ReportsModule({ data }) {
  const [range, setRange] = useState("monthly");
  const finance = data.finance || [];
  const students = data.students || [];
  const teachers = data.teachers || [];

  const filtered = finance.filter(f => withinRange(f.date, range));
  const income = sumBy(filtered.filter(f => f.type === "income"), f => f.amount);
  const expense = sumBy(filtered.filter(f => f.type === "expense"), f => f.amount);
  const net = income - expense;

  const studentDueTotal = sumBy(students, studentDue);
  const teacherDueTotal = sumBy(teachers, teacherDue);

  const headBreakdown = {};
  filtered.forEach(f => {
    const key = `${f.type}:${f.head}`;
    headBreakdown[key] = (headBreakdown[key] || 0) + (Number(f.amount) || 0);
  });

  return (
    <div>
      <div className="section-head"><div><h2>Reports</h2><p>Income, expense, and due summaries — daily, monthly, or yearly.</p></div></div>
      <div className="chip-row no-print" style={{ marginBottom: 18 }}>
        {["daily","monthly","yearly"].map(r => (
          <button key={r} className={`chip ${range === r ? "active" : ""}`} onClick={() => setRange(r)} style={{ textTransform: "capitalize" }}>{r}</button>
        ))}
      </div>

      <div className="grid grid-3" style={{ marginBottom: 20 }}>
        <StatCard label={`${range} Income`} value={"৳"+money(income)} accent="var(--moss)" />
        <StatCard label={`${range} Expense`} value={"৳"+money(expense)} accent="var(--red)" />
        <StatCard label="Net Balance" value={"৳"+money(net)} sub={net >= 0 ? "Surplus" : "Deficit"} accent={net >= 0 ? "var(--gold)" : "var(--red)"} />
      </div>

      <div className="grid grid-2">
        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 12 }}>Breakdown by Head ({range})</h3>
          {Object.keys(headBreakdown).length === 0 ? <EmptyState title="No transactions in this range" sub="Add finance entries to see breakdowns." /> : (
            Object.entries(headBreakdown).map(([key, val]) => {
              const [type, head] = key.split(":");
              return <div className="kv-row" key={key}><span className="k">{head} <span className={`badge ${type === "income" ? "badge-green" : "badge-red"}`} style={{ marginLeft: 6 }}>{type}</span></span><span className="v">৳{money(val)}</span></div>;
            })
          )}
        </div>
        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 12 }}>Total Outstanding Dues</h3>
          <div className="kv-row"><span className="k">Student fee dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(studentDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Teacher salary dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(teacherDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Combined</span><span className="v">৳{money(studentDueTotal + teacherDueTotal)}</span></div>
        </div>
      </div>

      <div className="no-print" style={{ marginTop: 18, display: "flex", justifyContent: "flex-end" }}>
        <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print Report</button>
      </div>
    </div>
  );
}

/* =========================================================
   SETTINGS MODULE
   ========================================================= */
function SettingsModule({ config, setConfig }) {
  const [form, setForm] = useState(config);
  const [testing, setTesting] = useState(false);
  const toast = useToast();
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  function handleSave() {
    setConfig(form);
    saveConfig(form);
    toast("Settings saved");
  }

  async function testConnection() {
    setTesting(true);
    try {
      await SheetsAPI.list(form, "Students");
      toast("Connected to Google Sheets successfully", "success");
    } catch (err) {
      toast("Connection failed: " + err.message, "error");
    }
    setTesting(false);
  }

  return (
    <div>
      <div className="section-head"><div><h2>Settings</h2><p>Connect your Google Sheets backend and GitHub file storage.</p></div></div>

      <div className="grid grid-2" style={{ alignItems: "start" }}>
        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 4 }}>School Profile</h3>
          <p style={{ fontSize: 12.5, color: "var(--slate-soft)", marginBottom: 14 }}>Appears on ID cards, invoices, and letters.</p>
          <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
            <Field label="School Name"><input type="text" value={form.schoolName} onChange={set("schoolName")} /></Field>
          </div>
        </div>

        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 4 }}>Google Sheets (Database)</h3>
          <p style={{ fontSize: 12.5, color: "var(--slate-soft)", marginBottom: 14 }}>
            Paste the Web App URL from your deployed Apps Script (see AppsScript-Code.gs).
          </p>
          <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
            <Field label="Apps Script Web App URL"><input type="text" value={form.sheetsUrl} onChange={set("sheetsUrl")} placeholder="https://script.google.com/macros/s/.../exec" /></Field>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
            <button className="btn btn-sm" onClick={testConnection} disabled={testing || !form.sheetsUrl}>{testing ? "Testing…" : "Test Connection"}</button>
          </div>
        </div>

        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 4 }}>Photos & Documents</h3>
          <p style={{ fontSize: 12.5, color: "var(--slate-soft)", marginBottom: 14, lineHeight: 1.7 }}>
            No token needed. Upload a photo/file to your GitHub repo yourself (drag & drop on github.com),
            then paste the resulting link into the Photo field on each form. Or use "Embed a file" to attach it directly — no GitHub required at all.
          </p>
        </div>

        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 10 }}>Setup Guide</h3>
          <ol style={{ paddingLeft: 18, fontSize: 13, lineHeight: 1.9, color: "var(--slate)" }}>
            <li>Open <span className="mono">script.google.com</span> → New Project</li>
            <li>Paste in the contents of <span className="mono">AppsScript-Code.gs</span></li>
            <li>Deploy → New deployment → Web app → Execute as "Me", Access "Anyone"</li>
            <li>Copy the <span className="mono">/exec</span> URL into the field on the left (or paste it directly at the top of the code)</li>
            <li>To attach photos: upload the file to a GitHub repo on github.com, open it, click "Raw", and paste that link into any Photo field — or just use "Embed a file" instead</li>
          </ol>
        </div>
      </div>

      <div style={{ marginTop: 18 }}>
        <button className="btn btn-primary" onClick={handleSave}>Save Settings</button>
      </div>
    </div>
  );
}

/* =========================================================
   APP SHELL
   ========================================================= */
const NAV_GROUPS = [
  { label: "Overview", items: [{ key: "dashboard", label: "Dashboard", icon: "dashboard" }] },
  { label: "People", items: [
    { key: "students", label: "Students", icon: "students" },
    { key: "teachers", label: "Teachers", icon: "teachers" },
  ]},
  { label: "Money", items: [
    { key: "finance", label: "Finance", icon: "finance" },
    { key: "due", label: "Due List", icon: "due" },
    { key: "fees", label: "Master Fee", icon: "fee" },
  ]},
  { label: "Organization", items: [
    { key: "committee", label: "Committee", icon: "committee" },
    { key: "reports", label: "Reports", icon: "reports" },
  ]},
  { label: "System", items: [{ key: "settings", label: "Settings", icon: "settings" }] },
];

const MODULE_TITLES = {
  dashboard: "Dashboard", students: "Students", teachers: "Teachers", finance: "Finance",
  due: "Due List", fees: "Master Fee", committee: "Committee", reports: "Reports", settings: "Settings",
};

function AppShell() {
  const [config, setConfigState] = useState(loadConfig());
  const [active, setActive] = useState("dashboard");
  const store = useDataStore(config);

  function setConfig(c) { setConfigState(c); }

  return (
    <div className="app-shell">
      <aside className="sidebar no-print">
        <div className="sidebar-brand">
          <div className="sidebar-brand-mark">V</div>
          <div>
            <div className="sidebar-brand-text">Vidyalaya</div>
            <div className="sidebar-brand-sub">School Manager</div>
          </div>
        </div>
        <nav className="sidebar-nav">
          {NAV_GROUPS.map(group => (
            <div key={group.label}>
              <div className="sidebar-group-label">{group.label}</div>
              {group.items.map(item => (
                <button key={item.key} className={`sidebar-item ${active === item.key ? "active" : ""}`} onClick={() => setActive(item.key)}>
                  <IconWrap name={item.icon} />
                  {item.label}
                </button>
              ))}
            </div>
          ))}
        </nav>
        <div className="sidebar-foot">
          {config.schoolName || "Your School"}
          <button onClick={store.refresh}><IconWrap name="refresh" style={{ marginRight: 5, verticalAlign: -1 }} />Sync now</button>
        </div>
      </aside>

      <div className="main-col">
        <div className="topbar no-print">
          <div className="topbar-title">{MODULE_TITLES[active]}</div>
          <div className="topbar-actions">
            <div className="sync-pill">
              <span className={`sync-dot ${store.status === "loading" ? "pending" : store.status === "error" ? "error" : ""}`}></span>
              {store.status === "loading" ? "Syncing…" : store.status === "error" ? "Sync error" : store.status === "offline" ? "Offline mode" : "Synced"}
            </div>
          </div>
        </div>
        <div className="content">
          <ConnectionBanner config={config} onOpenSettings={() => setActive("settings")} />
          {active === "dashboard" && <Dashboard data={store.data} setActiveModule={setActive} />}
          {active === "students" && <StudentsModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "teachers" && <TeachersModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "finance" && <FinanceModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "due" && <DueModule data={store.data} />}
          {active === "fees" && <MasterFeeModule data={store.data} save={store.save} remove={store.remove} />}
          {active === "committee" && <CommitteeModule data={store.data} save={store.save} remove={store.remove} />}
          {active === "reports" && <ReportsModule data={store.data} />}
          {active === "settings" && <SettingsModule config={config} setConfig={setConfig} />}
        </div>
      </div>
    </div>
  );
}

function Root() {
  return (
    <ToastProvider>
      <AppShell />
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
</body>
</html>
