<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vidyalaya — School Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#1c2521;
  --paper:#f6f4ee;
  --paper-raised:#ffffff;
  --slate:#3d4a45;
  --slate-soft:#6b7770;
  --line:#dcd8cc;
  --moss:#3f6b52;
  --moss-deep:#2c4d3a;
  --moss-tint:#e7efe8;
  --clay:#b8562f;
  --clay-tint:#f7e9e0;
  --gold:#c8963e;
  --gold-tint:#f6edd9;
  --red:#b0403a;
  --red-tint:#f7e4e2;
  --radius-sm:6px;
  --radius:10px;
  --radius-lg:16px;
  --shadow-sm:0 1px 2px rgba(28,37,33,0.06);
  --shadow-md:0 4px 16px rgba(28,37,33,0.08);
  --shadow-lg:0 12px 40px rgba(28,37,33,0.14);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Inter',system-ui,sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,h4{
  font-family:'Fraunces',serif;
  font-weight:600;
  letter-spacing:-0.01em;
  margin:0;
}
.mono{font-family:'IBM Plex Mono',monospace;}
#root{min-height:100vh;}
::selection{background:var(--moss-tint);color:var(--moss-deep);}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}
::-webkit-scrollbar-thumb:hover{background:var(--slate-soft);}

/* ===== App Shell ===== */
.app-shell{display:flex;flex-direction:column;min-height:100vh;}

.menubar{
  background:var(--moss-deep);
  color:#eef2ee;
  position:sticky;
  top:0;
  z-index:50;
  box-shadow:var(--shadow-sm);
}
.menubar-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 20px;
  height:58px;
}
.menubar-brand{
  display:flex;align-items:center;gap:10px;
}
.menubar-brand-mark{
  width:32px;height:32px;border-radius:9px;
  background:linear-gradient(135deg,var(--gold),#dba94f);
  display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',serif;font-weight:700;font-size:16px;color:var(--moss-deep);
  flex-shrink:0;
}
.menubar-brand-logo{
  width:32px;height:32px;border-radius:9px;object-fit:cover;flex-shrink:0;background:#fff;
}
.menubar-brand-text{font-family:'Fraunces',serif;font-size:16px;font-weight:600;line-height:1.1;}
.menubar-brand-sub{font-size:10px;color:#a9c2b2;text-transform:uppercase;letter-spacing:0.08em;margin-top:1px;}

.menubar-nav{
  display:flex;align-items:center;gap:2px;flex-wrap:wrap;
}
.menubar-item{
  display:flex;align-items:center;gap:7px;
  padding:9px 13px;border-radius:8px;
  font-size:13px;font-weight:500;color:#d3e0d7;
  cursor:pointer;border:none;background:transparent;
  transition:background .12s ease, color .12s ease;
  white-space:nowrap;
}
.menubar-item:hover{background:rgba(255,255,255,0.08);color:#fff;}
.menubar-item.active{background:var(--gold);color:var(--moss-deep);font-weight:600;}
.menubar-item svg{flex-shrink:0;opacity:0.9;}

.menubar-toggle{
  display:none;
  background:none;border:none;color:#eef2ee;padding:8px;border-radius:8px;
}
.menubar-toggle:hover{background:rgba(255,255,255,0.08);}

.menubar-mobile-panel{
  display:none;
  flex-direction:column;
  padding:8px 12px 14px;
  border-top:1px solid rgba(255,255,255,0.1);
}
.menubar-mobile-panel.open{display:flex;}
.menubar-mobile-panel .menubar-item{width:100%;justify-content:flex-start;padding:11px 13px;}
.menubar-group-label{
  font-size:10px;text-transform:uppercase;letter-spacing:0.08em;
  color:#87a291;padding:12px 13px 4px;font-weight:600;
}

@media(max-width:920px){
  .menubar-nav.desktop-nav{display:none;}
  .menubar-toggle{display:flex;}
}
@media(min-width:921px){
  .menubar-mobile-panel{display:none !important;}
}

.main-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.topbar{
  height:62px;flex-shrink:0;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
  padding:0 26px;background:var(--paper-raised);
  position:sticky;top:0;z-index:20;
}
.topbar-title{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
.topbar-actions{display:flex;align-items:center;gap:10px;}
.sync-pill{
  display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--slate-soft);
  padding:5px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line);
}
.sync-dot{width:6px;height:6px;border-radius:50%;background:var(--moss);}
.sync-dot.pending{background:var(--gold);}
.sync-dot.error{background:var(--red);}

.content{padding:26px;flex:1;}

/* ===== Buttons ===== */
.btn{
  display:inline-flex;align-items:center;gap:7px;
  padding:9px 16px;border-radius:8px;border:1px solid var(--line);
  background:var(--paper-raised);color:var(--ink);font-size:13.5px;font-weight:600;
  transition:all .12s ease;
}
.btn:hover{border-color:var(--slate-soft);background:var(--paper);}
.btn-primary{background:var(--moss);border-color:var(--moss);color:#fff;}
.btn-primary:hover{background:var(--moss-deep);border-color:var(--moss-deep);}
.btn-clay{background:var(--clay);border-color:var(--clay);color:#fff;}
.btn-clay:hover{background:#96461f;}
.btn-danger{background:transparent;border-color:var(--red);color:var(--red);}
.btn-danger:hover{background:var(--red-tint);}
.btn-sm{padding:6px 11px;font-size:12.5px;border-radius:7px;}
.btn:disabled{opacity:0.5;cursor:not-allowed;}
.btn-icon{padding:8px;}

/* ===== Cards / Layout ===== */
.card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow-sm);
}
.card-flush{padding:0;overflow:hidden;}
.grid{display:grid;gap:16px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,1fr);}.grid-3{grid-template-columns:repeat(2,1fr);}}

.stat-card{
  background:var(--paper-raised);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;position:relative;overflow:hidden;
}
.stat-label{font-size:11.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--slate-soft);font-weight:600;}
.stat-value{font-family:'Fraunces',serif;font-size:28px;font-weight:600;margin-top:6px;}
.stat-sub{font-size:12px;color:var(--slate-soft);margin-top:4px;}
.stat-accent{position:absolute;left:0;top:0;bottom:0;width:4px;}

/* ===== Forms ===== */
.form-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 16px;}
.form-grid.cols-3{grid-template-columns:repeat(3,1fr);}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.span-2{grid-column:span 2;}
.form-field label{font-size:12px;font-weight:600;color:var(--slate);}
.form-field .hint{font-size:11px;color:var(--slate-soft);font-weight:400;}
.form-field input[type=text],
.form-field input[type=number],
.form-field input[type=date],
.form-field input[type=email],
.form-field input[type=tel],
.form-field input[type=password],
.form-field select,
.form-field textarea{
  padding:9px 11px;border:1px solid var(--line);border-radius:7px;
  font-size:13.5px;background:var(--paper-raised);color:var(--ink);
  outline:none;transition:border-color .12s;
}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--moss);}
.form-field textarea{resize:vertical;min-height:70px;}
.file-drop{
  border:1.5px dashed var(--line);border-radius:8px;padding:16px;text-align:center;
  font-size:12.5px;color:var(--slate-soft);background:var(--paper);cursor:pointer;
}
.file-drop:hover{border-color:var(--moss);}
.file-drop img{max-height:80px;border-radius:6px;margin-bottom:6px;}

.photo-box{
  width:120px;height:120px;border-radius:10px;
  border:1.5px dashed var(--line);background:var(--paper);
  cursor:pointer;overflow:hidden;
  display:flex;align-items:center;justify-content:center;
  transition:border-color .12s;
}
.photo-box:hover{border-color:var(--moss);}
.photo-box img{width:100%;height:100%;object-fit:cover;}
.photo-box-placeholder{
  display:flex;flex-direction:column;align-items:center;gap:6px;
  color:var(--slate-soft);font-size:11px;text-align:center;padding:8px;
}

/* ===== Table ===== */
.table-wrap{overflow-x:auto;}
table{width:100%;border-collapse:collapse;font-size:13px;}
thead th{
  text-align:left;padding:10px 14px;font-size:11px;text-transform:uppercase;
  letter-spacing:0.05em;color:var(--slate-soft);font-weight:600;
  border-bottom:1px solid var(--line);background:var(--paper);white-space:nowrap;
}
tbody td{padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap;}
tbody tr:hover{background:var(--paper);}
tbody tr:last-child td{border-bottom:none;}
.badge{
  display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:20px;
  font-size:11px;font-weight:600;
}
.badge-green{background:var(--moss-tint);color:var(--moss-deep);}
.badge-gold{background:var(--gold-tint);color:#8a6318;}
.badge-red{background:var(--red-tint);color:var(--red);}
.badge-slate{background:var(--paper);color:var(--slate-soft);border:1px solid var(--line);}

/* ===== Tabs ===== */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto;}
.tab{
  padding:10px 16px;font-size:13px;font-weight:600;color:var(--slate-soft);
  border:none;background:none;border-bottom:2px solid transparent;white-space:nowrap;
}
.tab.active{color:var(--moss-deep);border-bottom-color:var(--moss);}
.tab:hover:not(.active){color:var(--ink);}

/* ===== Modal ===== */
.modal-overlay{
  position:fixed;inset:0;background:rgba(28,37,33,0.5);
  display:flex;align-items:flex-start;justify-content:center;
  padding:40px 20px;overflow-y:auto;z-index:100;
}
.modal{
  background:var(--paper-raised);border-radius:var(--radius-lg);width:100%;max-width:680px;
  box-shadow:var(--shadow-lg);
}
.modal.modal-lg{max-width:920px;}
.modal-head{
  padding:18px 24px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;
}
.modal-head h3{font-size:18px;}
.modal-close{background:none;border:none;font-size:20px;color:var(--slate-soft);padding:4px;}
.modal-body{padding:22px 24px;max-height:70vh;overflow-y:auto;}
.modal-foot{padding:16px 24px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;}

/* ===== Toast ===== */
.toast-stack{position:fixed;bottom:22px;right:22px;display:flex;flex-direction:column;gap:8px;z-index:200;}
.toast{
  background:var(--ink);color:#fff;padding:11px 16px;border-radius:8px;font-size:13px;
  box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;min-width:220px;
  animation:toastIn .18s ease;
}
.toast.error{background:var(--red);}
.toast.success{background:var(--moss-deep);}
@keyframes toastIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

/* ===== Print Templates ===== */
.print-only{display:none;}
@media print{
  .app-shell > .menubar, .topbar, .no-print{display:none !important;}
  .print-only{display:block;}
  @page{size:A4;margin:14mm;}
  body{background:#fff;}
  /* The modal is rendered via a React portal directly under <body>, as a sibling of #root.
     When printing a modal's document, hide #root entirely (not just .content) — otherwise
     its reserved min-height:100vh flex container leaves one blank page before the modal prints. */
  body.modal-open #root{display:none !important;}
  .modal-overlay{position:static;padding:0;background:none;display:block;}
  .modal{box-shadow:none;max-width:100%;border-radius:0;width:auto;}
  .modal-head,.modal-foot{display:none;}
  .modal-body{padding:0;max-height:none;overflow:visible;position:relative;}
  /* Landscape A4 page for wide tabular data (Due List, Master Fee grid) */
  @page landscape-a4{size:A4 landscape;margin:12mm;}
  .print-landscape{page:landscape-a4;}
  /* On-screen page titles/descriptions are redundant with PrintDocHead's institution header */
  .section-head{display:none !important;}
}
.doc-preview{
  background:#fff;border:1px solid var(--line);border-radius:var(--radius);
  padding:28px;max-width:640px;margin:0 auto;
}
.doc-preview.half-a4{max-width:100%;width:99mm;min-height:140mm;padding:14mm 10mm;}
@media print{
  .doc-preview.half-a4{width:100%;min-height:0;box-shadow:none;border:none;}
}

/* Professional Admission Form layout */
.admission-form-print{max-width:100%;}
@media print{ .admission-form-print{box-shadow:none;border:none;padding:0;} }
.adm-header{
  display:flex;align-items:flex-start;justify-content:space-between;gap:14px;
  border-bottom:2px solid var(--moss-deep);padding-bottom:14px;margin-bottom:16px;
}
.adm-header-logo,.adm-header-photo{
  width:72px;height:86px;flex-shrink:0;border:1px solid var(--line);border-radius:6px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;background:var(--paper);
}
.adm-header-logo img,.adm-header-photo img{width:100%;height:100%;object-fit:cover;}
.adm-header-center{flex:1;text-align:center;}
.adm-school-name{font-family:'Fraunces',serif;font-size:21px;font-weight:700;}
.adm-school-address{font-size:11.5px;color:var(--slate-soft);margin-top:2px;}
.adm-school-phone{font-size:11.5px;color:var(--slate-soft);}
.adm-form-title{font-family:'Fraunces',serif;font-size:15px;font-weight:600;margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);}
.adm-form-no{font-size:11px;color:var(--slate-soft);margin-top:2px;}
.adm-fields{margin-bottom:20px;}
.adm-signatures{display:flex;justify-content:space-between;margin-top:50px;padding:0 10px;}
.adm-sig{border-top:1px solid var(--ink);padding-top:6px;font-size:10.5px;text-align:center;width:180px;line-height:1.5;}
.adm-footer{margin-top:36px;text-align:center;border-top:1px dashed var(--line);padding-top:10px;}
.adm-slogan{font-size:11px;font-style:italic;color:var(--slate-soft);}
.adm-credit{font-size:10px;color:var(--slate-soft);margin-top:4px;}

.id-card-grid{display:flex;flex-wrap:wrap;gap:0.14in;justify-content:flex-start;}
@media print{
  .id-card-grid{gap:0.1in;}
}

.field-form-title{text-align:center;margin-bottom:14px;}

/* Empty state */
.empty-state{
  text-align:center;padding:50px 20px;color:var(--slate-soft);
}
.empty-state h4{color:var(--ink);margin-bottom:6px;}

/* Search bar */
.search-row{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.search-input{
  flex:1;min-width:200px;padding:9px 13px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;background:var(--paper-raised);
}
.filter-select{
  padding:9px 12px;border:1px solid var(--line);border-radius:8px;font-size:13px;background:var(--paper-raised);
}

/* Section header */
.section-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:18px;gap:14px;flex-wrap:wrap;}
.section-head h2{font-size:22px;}
.section-head p{font-size:13px;color:var(--slate-soft);margin-top:4px;max-width:520px;}

.id-card-preview{
  width:320px;border-radius:14px;overflow:hidden;box-shadow:var(--shadow-md);
  background:#fff;border:1px solid var(--line);
}
.id-card-head{background:var(--moss-deep);color:#fff;padding:14px 16px;text-align:center;}
.id-card-photo{
  width:88px;height:88px;border-radius:10px;background:var(--paper);margin:14px auto 8px;
  display:flex;align-items:center;justify-content:center;overflow:hidden;border:2px solid var(--line);
}
.id-card-photo img{width:100%;height:100%;object-fit:cover;}

/* Physical ID card: 2.2in x 3.2in (portrait) with a curved footer band showing school + phone */
.id-card-physical{
  width:2.2in;height:3.2in;border-radius:0.18in;overflow:hidden;position:relative;
  background:#fff;border:1px solid var(--line);box-shadow:var(--shadow-sm);
  display:flex;flex-direction:column;
  font-family:'Inter',sans-serif;
  break-inside:avoid;page-break-inside:avoid;
}
.id-card-physical .icp-head{
  background:var(--moss-deep);color:#fff;text-align:center;
  padding:0.1in 0.12in 0.08in;flex-shrink:0;
}
.id-card-physical .icp-head .icp-school{font-size:7.5pt;text-transform:uppercase;letter-spacing:0.05em;opacity:0.85;}
.id-card-physical .icp-head .icp-doctype{font-family:'Fraunces',serif;font-size:10.5pt;font-weight:600;margin-top:1px;}
.id-card-physical .icp-photo{
  width:0.85in;height:0.85in;border-radius:0.1in;overflow:hidden;margin:0.12in auto 0.06in;
  border:1.5px solid var(--line);background:var(--paper);
  display:flex;align-items:center;justify-content:center;
}
.id-card-physical .icp-photo img{width:100%;height:100%;object-fit:cover;}
.id-card-physical .icp-name{font-weight:700;font-size:9pt;text-align:center;padding:0 0.1in;}
.id-card-physical .icp-sub{font-size:7pt;color:var(--slate-soft);text-align:center;margin-bottom:0.06in;}
.id-card-physical .icp-body{flex:1;padding:0 0.14in;font-size:6.8pt;overflow:hidden;}
.id-card-physical .icp-footer{
  margin-top:auto;background:var(--gold);color:var(--moss-deep);
  padding:0.07in 0.12in;text-align:center;
  border-radius:0.5in 0.5in 0 0;
  font-size:6.8pt;font-weight:700;flex-shrink:0;
}
.id-card-physical .icp-footer .icp-phone{display:block;font-size:7.2pt;margin-top:1px;}

.field-row{display:flex;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line);font-size:12.5px;gap:6px;}
.field-row:last-child{border-bottom:none;}
.field-row .fr-name{flex:1;text-align:left;color:var(--slate-soft);}
.field-row .fr-colon{flex:0 0 14px;text-align:center;color:var(--slate-soft);}
.field-row .fr-value{flex:1.4;text-align:left;font-weight:600;}

.kv-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--slate-soft);}
.kv-row .v{font-weight:600;}

.link-btn{background:none;border:none;color:var(--moss);font-weight:600;font-size:12.5px;padding:0;}
.link-btn:hover{text-decoration:underline;}

.chip-row{display:flex;gap:6px;flex-wrap:wrap;}
.chip{padding:5px 11px;border-radius:20px;font-size:12px;font-weight:600;background:var(--paper);border:1px solid var(--line);cursor:pointer;}
.chip.active{background:var(--moss);color:#fff;border-color:var(--moss);}

.loading-screen{
  min-height:100vh;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:var(--paper);
}
.spinner{
  width:32px;height:32px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--moss);
  animation:spin 0.8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="root"></div>
<script>
  // Force classic JSX runtime (React.createElement) so Babel Standalone
  // never injects "import ... from react/jsx-runtime" into the output.
  Babel.registerPreset("react-classic", {
    presets: [[Babel.availablePresets["react"], { runtime: "classic" }]]
  });
</script>
<script type="text/babel" data-presets="react-classic">
const { useState, useEffect, useCallback, useMemo, useRef, createContext, useContext } = React;

/* =========================================================
   CONFIG / SETTINGS STORAGE (localStorage — client config only,

const CONFIG_KEY = "sms_config_v1";
function loadConfig() {
  const defaults = {
    sheetsUrl: DEFAULT_SHEETS_URL.startsWith("PASTE_") ? "" : DEFAULT_SHEETS_URL,
    schoolName: DEFAULT_SCHOOL_NAME,
    schoolAddress: "",
    schoolPhones: ["", "", ""],
    schoolLogo: "",
    facebookUrl: "",
    youtubeUrl: "",
  };
  try {
    const raw = localStorage.getItem(CONFIG_KEY);
    if (raw) {
      const saved = JSON.parse(raw);
      // if a URL was hardcoded above and nothing saved yet in this browser, prefer the hardcoded one
      if (!saved.sheetsUrl && DEFAULT_SHEETS_URL && !DEFAULT_SHEETS_URL.startsWith("PASTE_")) {
        saved.sheetsUrl = DEFAULT_SHEETS_URL;
      }
      // migrate legacy single-phone field
      if (!saved.schoolPhones && saved.schoolPhone) saved.schoolPhones = [saved.schoolPhone, "", ""];
      return { ...defaults, ...saved, schoolPhones: saved.schoolPhones || defaults.schoolPhones };
    }
  } catch (e) {}
  return defaults;
}
function saveConfig(cfg) {
  localStorage.setItem(CONFIG_KEY, JSON.stringify(cfg));
}

/* =========================================================
   GOOGLE SHEETS API CLIENT
   ========================================================= */
async function sheetsCall(config, payload) {
  if (!config.sheetsUrl) throw new Error("NO_URL");
  const res = await fetch(config.sheetsUrl, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) throw new Error("HTTP_" + res.status);
  const json = await res.json();
  if (json.error) throw new Error(json.error);
  return json;
}

const SheetsAPI = {
  list: (config, sheet) => sheetsCall(config, { action: "list", sheet }),
  bulkGet: (config, sheets) => sheetsCall(config, { action: "bulkGet", sheets: sheets.join(",") }),
  upsert: (config, sheet, row) => sheetsCall(config, { action: "upsert", sheet, row }),
  remove: (config, sheet, id) => sheetsCall(config, { action: "delete", sheet, id }),
};

/* =========================================================
   FILE HANDLING — simplified, no GitHub API/token required.
   Workflow: user uploads the file to their GitHub repo manually
   (drag & drop on github.com), then pastes the resulting link here.
   As a fallback, small images can be embedded directly (base64).
   ========================================================= */
function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result.split(",")[1]);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

const ToastContext = createContext(null);
function ToastProvider({ children }) {
  const [toasts, setToasts] = useState([]);
  const push = useCallback((message, type = "default") => {
    const id = Math.random().toString(36).slice(2);
    setToasts((t) => [...t, { id, message, type }]);
    setTimeout(() => setToasts((t) => t.filter((x) => x.id !== id)), 3400);
  }, []);
  return (
    <ToastContext.Provider value={push}>
      {children}
      <div className="toast-stack no-print">
        {toasts.map((t) => (
          <div key={t.id} className={`toast ${t.type}`}>{t.message}</div>
        ))}
      </div>
    </ToastContext.Provider>
  );
}
function useToast() { return useContext(ToastContext); }

/* =========================================================
   DATA STORE — central hook wrapping Google Sheets as DB
   Collections: students, teachers, finance, fees, committee, seatplans
   ========================================================= */
const COLLECTIONS = ["students", "teachers", "finance", "fees", "committee", "seatplans"];

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function useDataStore(config) {
  const [data, setData] = useState({ students: [], teachers: [], finance: [], fees: [], committee: [], seatplans: [] });
  const [status, setStatus] = useState("idle"); // idle | loading | ready | error | offline
  const toast = useToast();

  const refresh = useCallback(async () => {
    if (!config.sheetsUrl) { setStatus("offline"); return; }
    setStatus("loading");
    try {
      const res = await SheetsAPI.bulkGet(config, COLLECTIONS.map(c => SHEET_MAP[c]));
      const mapped = {};
      COLLECTIONS.forEach(c => { mapped[c] = res.data[SHEET_MAP[c]] || []; });
      setData(mapped);
      setStatus("ready");
    } catch (err) {
      console.error(err);
      setStatus("error");
      toast && toast("Couldn't reach Google Sheets. Check Settings.", "error");
    }
  }, [config.sheetsUrl]);

  useEffect(() => { refresh(); /* eslint-disable-next-line */ }, [config.sheetsUrl]);

  const save = useCallback(async (collection, record) => {
    const sheet = SHEET_MAP[collection];
    const withId = record.id ? record : { ...record, id: uid() };
    // optimistic update
    setData((d) => {
      const list = d[collection] || [];
      const idx = list.findIndex((r) => r.id === withId.id);
      const next = idx > -1 ? list.map((r, i) => (i === idx ? { ...r, ...withId } : r)) : [withId, ...list];
      return { ...d, [collection]: next };
    });
    if (!config.sheetsUrl) { toast && toast("Saved locally (offline mode)"); return withId; }
    try {
      await SheetsAPI.upsert(config, sheet, withId);
      toast && toast("Saved", "success");
    } catch (err) {
      toast && toast("Save failed — will retry on refresh", "error");
    }
    return withId;
  }, [config.sheetsUrl]);

  const remove = useCallback(async (collection, id) => {
    const sheet = SHEET_MAP[collection];
    setData((d) => ({ ...d, [collection]: (d[collection] || []).filter((r) => r.id !== id) }));
    if (!config.sheetsUrl) return;
    try {
      await SheetsAPI.remove(config, sheet, id);
      toast && toast("Deleted", "success");
    } catch (err) {
      toast && toast("Delete failed on server", "error");
    }
  }, [config.sheetsUrl]);

  return { data, status, refresh, save, remove };
}

  finance: "Finance",

function Modal({ title, onClose, children, footer, size }) {
  useEffect(() => {
    document.body.classList.add("modal-open");
    return () => document.body.classList.remove("modal-open");
  }, []);
  const overlay = (
    <div className="modal-overlay" onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div className={`modal ${size === "lg" ? "modal-lg" : ""}`}>
        <div className="modal-head no-print">
          <h3>{title}</h3>
          <button className="modal-close" onClick={onClose}><Icon.x /></button>
        </div>
        <div className="modal-body">{children}</div>
        {footer && <div className="modal-foot no-print">{footer}</div>}
      </div>
    </div>
  );
  // Render via portal so the modal is a sibling of .content in the DOM,
  // not a descendant — this lets print CSS hide the page behind it
  // without also hiding the modal (and its document) itself.
  return ReactDOM.createPortal(overlay, document.body);
}

function fmtDate(d) {
  if (!d) return "—";
  try {
    const dt = new Date(d);
    if (isNaN(dt.getTime())) return d;
    return dt.toLocaleDateString(undefined, { year: "numeric", month: "short", day: "numeric" });
  } catch (e) { return d; }
}

// Resizes an image client-side (max dimension) before upload, to keep Drive uploads fast
// and avoid huge base64 payloads over the wire.
function resizeImageFile(file, maxDim) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        let { width, height } = img;
        if (width > maxDim || height > maxDim) {
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width * scale);
          height = Math.round(height * scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL("image/jpeg", 0.85);
        resolve({ base64: dataUrl.split(",")[1], mimeType: "image/jpeg", dataUrl });
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function PhotoBox({ label, folder, config, onUploaded, existingUrl }) {
  const toast = useToast();
  const [preview, setPreview] = useState(existingUrl || "");
  const [busy, setBusy] = useState(false);
  const inputRef = useRef();

  async function handleFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    setBusy(true);
    try {
      const { base64, mimeType, dataUrl } = await resizeImageFile(file, 500);
      setPreview(dataUrl); // instant local preview while uploading
      if (config && config.sheetsUrl) {
        const filename = `${Date.now()}.jpg`;
        const res = await sheetsCall(config, { action: "uploadImage", folder: folder || "misc", filename, base64, mimeType });
        if (res && res.url) {
          setPreview(res.url);
          onUploaded(res.url);
        } else {
          throw new Error((res && res.error) || "Upload failed");
        }
      } else {
        // Offline mode — no backend configured, keep the (small, resized) data URL locally only.
        onUploaded(dataUrl);
        toast && toast("No Google Sheets connection — photo kept locally only", "error");
      }
    } catch (err) {
      console.error(err);
      toast && toast("Photo upload failed: " + err.message, "error");
    }
    setBusy(false);
  }

  return (
    <div className="form-field">
      <label>{label}</label>
      <div className="photo-box" onClick={() => !busy && inputRef.current.click()}>
        {busy ? (
          <div className="photo-box-placeholder"><div className="spinner" style={{ width: 20, height: 20 }} /></div>
        ) : preview ? <img src={preview} alt="" /> : (
          <div className="photo-box-placeholder">
            <Icon.students width={26} height={26} />
            <span>Click to select photo</span>
          </div>
        )}
      </div>
      <input ref={inputRef} type="file" style={{ display: "none" }} onChange={handleFile} accept="image/*" />
    </div>
  );
}

// Fixed metadata keys on a fee-scale row — every OTHER key on the row is a fee head/column.
const FEE_META_KEYS = ["id", "kind", "className", "section", "designation", "note", "createdAt", "updatedAt"];
function feeHeadsOf(row) {
  return Object.keys(row).filter(k => !FEE_META_KEYS.includes(k) && row[k] !== "" && row[k] !== null && row[k] !== undefined);
}

// Returns [{feeType, amount}] for a student's class, one row per class holds all heads as columns.
// A section-specific row overrides the "All Sections" row for the same class.
function applicableFeeHeads(student, feeRules) {
  const rulesForClass = (feeRules || []).filter(f => f.className === student.className);
  const allSectionsRow = rulesForClass.find(f => !f.section);
  const specificRow = rulesForClass.find(f => f.section === student.section);
  const map = {};
  if (allSectionsRow) feeHeadsOf(allSectionsRow).forEach(h => { map[h] = Number(allSectionsRow[h]) || 0; });
  if (specificRow) feeHeadsOf(specificRow).forEach(h => { map[h] = Number(specificRow[h]) || 0; });
  return Object.entries(map).map(([feeType, amount]) => ({ feeType, amount }));
}

// Per-head breakdown: [{ head, charged, paid, due }]
function studentFeeBreakdown(student, feeRules) {
  const heads = applicableFeeHeads(student, feeRules);
  const payments = student.payments || [];
  return heads.map(h => {
    const paid = sumBy(payments.filter(p => p.head === h.feeType), p => p.amount);
    const charged = Number(h.amount) || 0;
    return { head: h.feeType, charged, paid, due: Math.max(0, charged - paid) };
  });
}

function studentDueFromRules(student, feeRules) {
  return sumBy(studentFeeBreakdown(student, feeRules), r => r.due);
}

// Legacy fallback (kept for any old records without fee-rule linkage)
function studentDue(student) {
  const totalFee = Number(student.totalFee) || 0;
  const paid = Number(student.paidAmount) || 0;
  return Math.max(0, totalFee - paid);
}
function teacherDue(teacher) {
  const totalSalary = (Number(teacher.basicSalary) || 0) + (Number(teacher.allowance) || 0);
  const paid = Number(teacher.paidAmount) || 0;
  return Math.max(0, totalSalary - paid);
}

// Per-head breakdown for a teacher's payable amounts.
// Uses the Master Fee "Teacher Fee Scale" row matching their designation (heads as columns) when available;
// otherwise falls back to the two legacy components (Basic Salary, Allowance).
function teacherFeeBreakdown(teacher, teacherFeeRules) {
  const row = (teacherFeeRules || []).find(f => f.designation === teacher.designation);
  const payments = teacher.payments || [];

  if (row) {
    const heads = feeHeadsOf(row);
    if (heads.length > 0) {
      return heads.map(h => {
        const paid = sumBy(payments.filter(p => p.head === h), p => p.amount);
        const charged = Number(row[h]) || 0;
        return { head: h, charged, paid, due: Math.max(0, charged - paid) };
      });
    }
  }

  // Fallback: legacy basicSalary/allowance/paidAmount fields, paidAmount applied to Basic first.
  const basic = Number(teacher.basicSalary) || 0;
  const allowance = Number(teacher.allowance) || 0;
  const totalPaid = Number(teacher.paidAmount) || 0;
  const paidToBasic = Math.min(totalPaid, basic);
  const paidToAllowance = Math.min(Math.max(0, totalPaid - basic), allowance);
  return [
    { head: "Basic Salary", charged: basic, paid: paidToBasic, due: Math.max(0, basic - paidToBasic) },
    { head: "Allowance", charged: allowance, paid: paidToAllowance, due: Math.max(0, allowance - paidToAllowance) },
  ].filter(r => r.charged > 0);
}

function teacherDueFromRules(teacher, teacherFeeRules) {
  return sumBy(teacherFeeBreakdown(teacher, teacherFeeRules), r => r.due);
}

function sumBy(arr, fn) { return arr.reduce((s, x) => s + (Number(fn(x)) || 0), 0); }

function withinRange(dateStr, range) {
  if (!dateStr) return false;
  const d = new Date(dateStr);
  if (isNaN(d.getTime())) return false;
  const now = new Date();
  if (range === "daily") {
    return d.toDateString() === now.toDateString();
  }
  if (range === "monthly") {
    return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth();
  }
  if (range === "yearly") {
    return d.getFullYear() === now.getFullYear();
  }
  return true;
}

function generateStudentId(existingStudents) {
  const year = new Date().getFullYear();
  const nums = (existingStudents || [])
    .map(s => s.studentId || "")
    .filter(id => id.startsWith(`STU-${year}-`))
    .map(id => parseInt(id.split("-")[2], 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `STU-${year}-${String(next).padStart(4, "0")}`;
}

function generateFormNo(existingStudents) {
  const year = new Date().getFullYear();
  const nums = (existingStudents || [])
    .map(s => s.admissionFormNo || "")
    .filter(id => id.startsWith(`ADM-${year}-`))
    .map(id => parseInt(id.split("-")[2], 10))
    .filter(n => !isNaN(n));
  const next = (nums.length ? Math.max(...nums) : 0) + 1;
  return `ADM-${year}-${String(next).padStart(4, "0")}`;
}

function nextRollForClass(students, className, excludeId) {
  const rolls = (students || [])
    .filter(s => s.className === className && s.id !== excludeId)
    .map(s => parseInt(s.roll, 10))
    .filter(n => !isNaN(n));
  return rolls.length ? Math.max(...rolls) + 1 : 1;
}

function StudentInvoiceModal({ students, initialStudent, config, feeRules, onSave, onClose }) {
  const [selected, setSelected] = useState(initialStudent || null);
  const [query, setQuery] = useState("");
  const [payAmounts, setPayAmounts] = useState({}); // { head: amountString }
  const [saving, setSaving] = useState(false);
  const [showPrint, setShowPrint] = useState(false);
  const toast = useToast();

  const matches = query.trim() ? students.filter(s =>
    (s.name || "").toLowerCase().includes(query.toLowerCase())
    || (s.roll || "").toLowerCase().includes(query.toLowerCase())
    || (s.studentId || "").toLowerCase().includes(query.toLowerCase())
  ).slice(0, 20) : [];

  const breakdown = selected ? studentFeeBreakdown(selected, feeRules) : [];
  const totalCharged = sumBy(breakdown, r => r.charged);
  const totalPaid = sumBy(breakdown, r => r.paid);
  const totalDue = sumBy(breakdown, r => r.due);
  const invNo = selected ? "INV-" + (selected.studentId || selected.roll || selected.id.slice(0,6)).toUpperCase() : "";

  async function submitPayments() {
    const entries = Object.entries(payAmounts).filter(([head, amt]) => Number(amt) > 0);
    if (entries.length === 0) { toast && toast("Enter at least one payment amount", "error"); return; }
    setSaving(true);
    const newPayments = entries.map(([head, amt]) => ({ head, amount: Number(amt), date: new Date().toISOString().slice(0,10) }));
    const updated = { ...selected, payments: [...(selected.payments || []), ...newPayments] };
    const saved = await onSave(updated);
    setSelected(saved || updated);
    setPayAmounts({});
    setSaving(false);
    toast && toast("Payments submitted", "success");
  }

  function handlePrintInvoice() {
    setShowPrint(true);
  }

  return (
    <Modal title="Fee Invoice" onClose={onClose} size="lg"
      footer={selected && !showPrint ? (
        <>
          <button className="btn" onClick={() => { setSelected(null); setPayAmounts({}); }}>← Search Another Student</button>
          <button className="btn" onClick={handlePrintInvoice}><Icon.print />Print Invoice</button>
          <button className="btn btn-primary" disabled={saving} onClick={submitPayments}>Submit Payments</button>
        </>
      ) : showPrint ? (
        <>
          <button className="btn" onClick={() => setShowPrint(false)}>← Back to Invoice</button>
          <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print / Save as PDF</button>
        </>
      ) : (
        <button className="btn" onClick={onClose}>Close</button>
      )}>
      {selected && showPrint ? (
        <div className="doc-preview half-a4">
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", borderBottom: "2px solid var(--moss-deep)", paddingBottom: 10, marginBottom: 12 }}>
            <div>
              <h3 style={{ fontSize: 15 }}>{config.schoolName || "School Name"}</h3>
              <div style={{ fontSize: 10.5, color: "var(--slate-soft)" }}>Fee Invoice</div>
            </div>
            <div style={{ textAlign: "right", fontSize: 10.5 }}>
              <div>Invoice No: <strong className="mono">{invNo}</strong></div>
              <div>Date: {fmtDate(new Date().toISOString())}</div>
            </div>
          </div>
          <div style={{ marginBottom: 10 }}>
            <FieldRow name="Student ID" value={<span className="mono">{selected.studentId || "—"}</span>} />
            <FieldRow name="Student" value={selected.name} />
            <FieldRow name="Class / Section" value={`${selected.className} — ${selected.section}`} />
            <FieldRow name="Roll" value={selected.roll || "—"} />
          </div>
          <table style={{ width: "100%", marginBottom: 10, fontSize: 11 }}>
            <thead><tr><th style={{ fontSize: 9.5 }}>Fee Head</th><th style={{ textAlign: "right", fontSize: 9.5 }}>Charged</th><th style={{ textAlign: "right", fontSize: 9.5 }}>Paid</th><th style={{ textAlign: "right", fontSize: 9.5 }}>Due</th></tr></thead>
            <tbody>
              {breakdown.map(r => (
                <tr key={r.head}>
                  <td>{r.head}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.due)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <div style={{ minWidth: 200, fontSize: 11 }}>
              <FieldRow name="Total Charged" value={"৳" + money(totalCharged)} />
              <FieldRow name="Total Paid" value={"৳" + money(totalPaid)} />

            </div>
          </div>
          <div style={{ marginTop: 20, fontSize: 9.5, color: "var(--slate-soft)", textAlign: "center" }}>This is a system-generated invoice.</div>
        </div>
      ) : !selected ? (
        <div>
          <Field label="Search Student" hint="by name, roll, or Student ID">
            <input className="search-input" autoFocus value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Type to search…" />
          </Field>
          <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 6 }}>
            {matches.map(s => (
              <button key={s.id} className="btn" style={{ justifyContent: "flex-start", textAlign: "left" }} onClick={() => setSelected(s)}>

          </div>

      ) : (
        <div>
          <div className="grid grid-2" style={{ marginBottom: 18 }}>

          </div>

          {breakdown.length === 0 ? (
            <EmptyState title="No fee rules set for this class" sub={`Add fee heads for ${selected.className} in Master Fee first.`} />
          ) : (
            <div className="table-wrap">
              <table style={{ width: "100%", marginBottom: 16 }}>
                <thead><tr><th>Fee Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th><th>Pay Amount</th></tr></thead>
                <tbody>
                  {breakdown.map(r => (
                    <tr key={r.head}>
                      <td>{r.head}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                      <td style={{ textAlign: "right", color: r.due > 0 ? "var(--red)" : "var(--moss)" }} className="mono">৳{money(r.due)}</td>
                      <td>
                        {r.due > 0 ? (
                          <input type="number" placeholder="0" value={payAmounts[r.head] || ""} onChange={(e) => setPayAmounts(p => ({ ...p, [r.head]: e.target.value }))} style={{ width: 100, padding: "6px 9px", border: "1px solid var(--line)", borderRadius: 6, fontSize: 13 }} />
                        ) : <span style={{ color: "var(--slate-soft)", fontSize: 12 }}>—</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <div style={{ minWidth: 240 }}>
              <div className="kv-row"><span className="k">Total Charged</span><span className="v mono">৳{money(totalCharged)}</span></div>
              <div className="kv-row"><span className="k">Total Paid</span><span className="v mono">৳{money(totalPaid)}</span></div>
              <div className="kv-row" style={{ fontSize: 15 }}><span className="k">Balance Due</span><span className="v" style={{ color: totalDue > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(totalDue)}</span></div>
            </div>
          </div>
        </div>
      )}
    </Modal>
  );

            <Field label="Section"><select value={form.section} onChange={set("section")}><option value="">—</option>{SECTIONS.map(s => <option key={s}>{s}</option>)}</select></Field>

const emptyTeacher = () => ({

  function openNew() { setEditing(emptyTeacher()); }

        <button className={`tab ${tab === "idcard" ? "active" : ""}`} onClick={() => setTab("idcard")}>ID Card</button>

          <div style={{ padding: "16px 18px 0" }}>
            <div className="search-row">

              <button className="btn btn-sm no-print" onClick={handlePrint}><Icon.print />Print List</button>
            </div>
          </div>
          {filtered.length === 0 ? <EmptyState title="No staff records" sub="Add your first staff member." /> : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Designation</th><th>Subject</th><th>Phone</th><th>Salary Due</th><th>Status</th><th className="no-print"></th></tr></thead>

                    return (
                      <tr key={t.id}>

                        <td>{t.designation}</td>
                        <td>{t.subject || "—"}</td>

                            <button className="btn btn-sm btn-icon" title="Delete" onClick={() => { if (confirm(`Delete ${t.name}?`)) remove("teachers", t.id); }}><Icon.trash /></button>
                          </div>
                        </td>
                      </tr>
                    );
                  })}
                </tbody>
              </table>
            </div>

function TeacherSalaryInvoiceModal({ teacher, config, teacherFeeRules, onSave, onClose }) {
  const [payAmounts, setPayAmounts] = useState({});
  const [saving, setSaving] = useState(false);
  const [showPrint, setShowPrint] = useState(false);
  const toast = useToast();
  const breakdown = teacherFeeBreakdown(teacher, teacherFeeRules);
  const totalCharged = sumBy(breakdown, r => r.charged);
  const totalPaid = sumBy(breakdown, r => r.paid);
  const totalDue = sumBy(breakdown, r => r.due);

  async function submitPayments() {
    const entries = Object.entries(payAmounts).filter(([head, amt]) => Number(amt) > 0);
    if (entries.length === 0) { toast && toast("Enter at least one payment amount", "error"); return; }
    setSaving(true);
    const newPayments = entries.map(([head, amt]) => ({ head, amount: Number(amt), date: new Date().toISOString().slice(0,10) }));
    const updated = { ...teacher, payments: [...(teacher.payments || []), ...newPayments] };
    await onSave(updated);
    setPayAmounts({});
    setSaving(false);
    toast && toast("Payments submitted", "success");
  }

  return (
    <Modal title={`Salary Invoice — ${teacher.name}`} onClose={onClose} size="lg"
      footer={showPrint ? (
        <>
          <button className="btn" onClick={() => setShowPrint(false)}>← Back</button>
          <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print / Save as PDF</button>
        </>
      ) : (
        <>
          <button className="btn" onClick={onClose}>Close</button>
          <button className="btn" onClick={() => setShowPrint(true)}><Icon.print />Print Invoice</button>
          <button className="btn btn-primary" disabled={saving} onClick={submitPayments}>Submit Payments</button>
        </>
      )}>
      {showPrint ? (
        <div className="doc-preview">
          <div style={{ display: "flex", justifyContent: "space-between", borderBottom: "2px solid var(--moss-deep)", paddingBottom: 14, marginBottom: 18 }}>
            <div>
              <h3 style={{ fontSize: 20 }}>{config.schoolName || "School Name"}</h3>
              <div style={{ fontSize: 12, color: "var(--slate-soft)" }}>Salary & Allowance Invoice</div>
            </div>
            <div style={{ textAlign: "right", fontSize: 12.5 }}>Date: {fmtDate(new Date().toISOString())}</div>
          </div>
          <FieldRow name="Staff Name" value={teacher.name} />
          <FieldRow name="Designation" value={teacher.designation} />
          <table style={{ width: "100%", margin: "16px 0" }}>
            <thead><tr><th>Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th></tr></thead>
            <tbody>
              {breakdown.map(r => (
                <tr key={r.head}>
                  <td>{r.head}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                  <td style={{ textAlign: "right" }} className="mono">৳{money(r.due)}</td>
                </tr>
              ))}
            </tbody>
          </table>
          <div style={{ display: "flex", justifyContent: "flex-end" }}>
            <div style={{ minWidth: 220 }}>
              <FieldRow name="Total Payable" value={"৳" + money(totalCharged)} />
              <FieldRow name="Total Paid" value={"৳" + money(totalPaid)} />
              <FieldRow name="Balance Due" value={<strong>৳{money(totalDue)}</strong>} />
            </div>
          </div>
        </div>
      ) : (
        <div>
          <FieldRow name="Staff Name" value={teacher.name} />
          <FieldRow name="Designation" value={teacher.designation} />
          {breakdown.length === 0 ? (
            <EmptyState title="No fee scale set for this designation" sub={`Add salary components for ${teacher.designation} in Master Fee → Teacher Fee Scale.`} />
          ) : (
            <div className="table-wrap" style={{ marginTop: 14 }}>
              <table style={{ width: "100%" }}>
                <thead><tr><th>Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th><th>Pay Amount</th></tr></thead>
                <tbody>
                  {breakdown.map(r => (
                    <tr key={r.head}>
                      <td>{r.head}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                      <td style={{ textAlign: "right", color: r.due > 0 ? "var(--red)" : "var(--moss)" }} className="mono">৳{money(r.due)}</td>
                      <td>
                        {r.due > 0 ? (
                          <input type="number" placeholder="0" value={payAmounts[r.head] || ""} onChange={(e) => setPayAmounts(p => ({ ...p, [r.head]: e.target.value }))} style={{ width: 100, padding: "6px 9px", border: "1px solid var(--line)", borderRadius: 6, fontSize: 13 }} />
                        ) : <span style={{ color: "var(--slate-soft)", fontSize: 12 }}>—</span>}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
          <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 14 }}>
            <div style={{ minWidth: 220 }}>
              <FieldRow name="Total Payable" value={"৳" + money(totalCharged)} />
              <FieldRow name="Total Paid" value={"৳" + money(totalPaid)} />
              <FieldRow name="Balance Due" value={<strong style={{ color: totalDue > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(totalDue)}</strong>} />
            </div>
          </div>
        </div>
      )}
    </Modal>
  );
}

function DueModule({ data, config }) {
  const [tab, setTab] = useState("students");
  const students = data.students || [];
  const teachers = data.teachers || [];
  const classFeeRules = (data.fees || []).filter(f => f.kind === "class");
  const teacherFeeRules = (data.fees || []).filter(f => f.kind === "teacher");
  const [classFilter, setClassFilter] = useState("");

  const classStudents = students.filter(s => !classFilter || s.className === classFilter);
  const studentRows = classStudents.map(s => ({ ...s, breakdown: studentFeeBreakdown(s, classFeeRules), due: studentDueFromRules(s, classFeeRules) }));
  // union of all fee heads that appear for the selected class (as of today — i.e. current Master Fee setup)
  const allHeadsInView = [...new Set(studentRows.flatMap(s => s.breakdown.map(r => r.head)))];

  const teacherDues = teachers
    .map(t => ({ ...t, breakdown: teacherFeeBreakdown(t, teacherFeeRules), due: teacherDueFromRules(t, teacherFeeRules) }))
    .filter(t => t.due > 0);

  function handlePrint() { window.print(); }

  return (
    <div>
      <div className="section-head"><div><h2>Due List</h2><p>Track outstanding student fees, teacher salaries, and other dues.</p></div></div>
      <div className="tabs no-print">
        <button className={`tab ${tab === "students" ? "active" : ""}`} onClick={() => setTab("students")}>Student Dues</button>
        <button className={`tab ${tab === "teachers" ? "active" : ""}`} onClick={() => setTab("teachers")}>Teacher Dues</button>
        <button className={`tab ${tab === "others" ? "active" : ""}`} onClick={() => setTab("others")}>Other Dues</button>
      </div>

      {tab === "students" && (
        <div className="card card-flush print-landscape">
          <div style={{ padding: "16px 18px 0" }} className="search-row no-print">
            <select className="filter-select" value={classFilter} onChange={(e) => setClassFilter(e.target.value)}>
              <option value="">Select a Class</option>
              {CLASSES.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            {classFilter && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <div style={{ padding: "12px 18px 0" }}>
            <PrintDocHead config={config} headline={`Student Dues — ${classFilter || "All Classes"} (as of ${fmtDate(new Date().toISOString())})`} />
          </div>
          {!classFilter ? (
            <EmptyState title="Select a class" sub="Choose a class above to see every student's fee-head-wise dues, one row per student." />
          ) : studentRows.length === 0 ? (
            <EmptyState title="No students in this class" sub="Try a different class." />
          ) : allHeadsInView.length === 0 ? (
            <EmptyState title="No fee rules set for this class" sub="Add fee heads for this class in Master Fee first." />
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Student ID</th><th>Roll</th><th>Name</th><th>Section</th>
                    {allHeadsInView.map(h => <th key={h} style={{ textAlign: "right" }}>{h}</th>)}
                    <th style={{ textAlign: "right" }}>Total Due</th>
                  </tr>
                </thead>
                <tbody>
                  {studentRows.map(s => (
                    <tr key={s.id}>
                      <td className="mono">{s.studentId || "—"}</td>
                      <td className="mono">{s.roll || "—"}</td>
                      <td>{s.name}</td>
                      <td>{s.section}</td>
                      {allHeadsInView.map(h => {
                        const r = s.breakdown.find(b => b.head === h);
                        const due = r ? r.due : 0;
                        return <td key={h} style={{ textAlign: "right" }} className="mono">{due > 0 ? <span style={{ color: "var(--red)" }}>৳{money(due)}</span> : "—"}</td>;
                      })}
                      <td style={{ textAlign: "right" }} className="mono"><strong style={{ color: s.due > 0 ? "var(--red)" : "var(--moss)" }}>৳{money(s.due)}</strong></td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {tab === "teachers" && (
        <div className="card card-flush print-landscape">
          <div className="no-print" style={{ textAlign: "right", padding: "16px 18px 0" }}>
            {teacherDues.length > 0 && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <div style={{ padding: "12px 18px 0" }}>
            <PrintDocHead config={config} headline={`Teacher Dues (as of ${fmtDate(new Date().toISOString())})`} />
          </div>
          {teacherDues.length === 0 ? <EmptyState title="No outstanding teacher dues" sub="All salaries are cleared." /> : (
            <div className="table-wrap">
              <table>
                <thead><tr><th>Name</th><th>Designation</th><th>Head</th><th style={{ textAlign: "right" }}>Charged</th><th style={{ textAlign: "right" }}>Paid</th><th style={{ textAlign: "right" }}>Due</th></tr></thead>
                <tbody>
                  {teacherDues.flatMap(t => t.breakdown.filter(r => r.due > 0).map((r, i) => (
                    <tr key={t.id + r.head}>
                      {i === 0 ? <td rowSpan={t.breakdown.filter(x => x.due > 0).length}>{t.name}</td> : null}
                      {i === 0 ? <td rowSpan={t.breakdown.filter(x => x.due > 0).length}>{t.designation}</td> : null}
                      <td>{r.head}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.charged)}</td>
                      <td style={{ textAlign: "right" }} className="mono">৳{money(r.paid)}</td>
                      <td style={{ textAlign: "right", color: "var(--red)" }} className="mono">৳{money(r.due)}</td>
                    </tr>
                  )))}

              </table>
            </div>
          )}
        </div>
      )}

      {tab === "others" && (
        <div className="card">
          <EmptyState title="No other dues tracked" sub="Other dues (vendor bills, utilities pending) can be logged as Expense Vouchers in Finance and will appear once marked unpaid." />
        </div>
      )}
    </div>
  );
}

const emptyFeeRuleGroup = (kind) => ({
  kind, className: "One", section: "", designation: "Assistant Teacher",
  items: [{ feeType: kind === "class" ? INCOME_HEADS[0] : "Base Salary", amount: "" }],
  note: "",
});

function MasterFeeModule({ data, save, remove, config }) {
  const [tab, setTab] = useState("class");
  const [editingGroup, setEditingGroup] = useState(null); // { id, kind, className, section, designation, items:[{feeType,amount}], note }
  const fees = data.fees || [];
  const classRows = fees.filter(f => f.kind === "class");
  const teacherRows = fees.filter(f => f.kind === "teacher");

  function openNewGroup() {
    setEditingGroup({
      id: null, kind: tab,
      className: "One", section: "", designation: "Assistant Teacher",
      items: [{ feeType: tab === "class" ? INCOME_HEADS[0] : "Basic Salary", amount: "" }],
      note: "",
    });
  }

  function editGroup(row) {
    const heads = feeHeadsOf(row);
    setEditingGroup({
      id: row.id, kind: row.kind, className: row.className || "One", section: row.section || "", designation: row.designation || "Assistant Teacher",
      items: heads.length > 0 ? heads.map(h => ({ feeType: h, amount: row[h] })) : [{ feeType: row.kind === "class" ? INCOME_HEADS[0] : "Basic Salary", amount: "" }],
      note: row.note || "",
    });
  }

  async function deleteGroup(row) {
    if (!confirm("Delete this entire fee row?")) return;
    await remove("fees", row.id);
  }

  async function saveGroup(group) {
    const row = {
      id: group.id || undefined,
      kind: group.kind,
      className: group.kind === "class" ? group.className : undefined,
      section: group.kind === "class" ? group.section : undefined,
      designation: group.kind === "teacher" ? group.designation : undefined,
      note: group.note,
    };
    group.items.forEach(item => {
      if (item.feeType && item.amount !== "") row[item.feeType] = item.amount;
    });
    await save("fees", row);
    setEditingGroup(null);
  }

  function handlePrint() { window.print(); }

  const allClassHeads = [...new Set(classRows.flatMap(feeHeadsOf))];
  const allTeacherHeads = [...new Set(teacherRows.flatMap(feeHeadsOf))];

  return (
    <div>
      <div className="section-head">
        <div><h2>Master Fee Setup</h2><p>Determine class-wise (sector-based) fees and teacher-based salary scales — add multiple fee heads at once per class or designation.</p></div>
        <button className="btn btn-primary no-print" onClick={openNewGroup}><Icon.plus />New Fee Group</button>
      </div>
      <div className="tabs no-print">
        <button className={`tab ${tab === "class" ? "active" : ""}`} onClick={() => setTab("class")}>Class Fee Rules</button>
        <button className={`tab ${tab === "teacher" ? "active" : ""}`} onClick={() => setTab("teacher")}>Teacher Fee Scale</button>
      </div>

      {tab === "class" && (
        <div className="card card-flush print-landscape">
          <div className="no-print" style={{ textAlign: "right", padding: "16px 18px 0" }}>
            {classRows.length > 0 && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <PrintDocHead config={config} headline="Class-wise Fee Structure" />
          {classRows.length === 0 ? (
            <EmptyState title="No class fee rules yet" sub="Add a fee group with multiple heads (Tuition, Exam, etc.) per class." />
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Class</th><th>Section</th>
                    {allClassHeads.map(h => <th key={h} style={{ textAlign: "right" }}>{h}</th>)}
                    <th style={{ textAlign: "right" }}>Total</th>
                    <th className="no-print"></th>
                  </tr>
                </thead>
                <tbody>
                  {classRows.map(row => (
                    <tr key={row.id}>
                      <td>{row.className}</td>
                      <td>{row.section || "All"}</td>
                      {allClassHeads.map(h => (
                        <td key={h} style={{ textAlign: "right" }} className="mono">{row[h] ? "৳" + money(row[h]) : "—"}</td>
                      ))}
                      <td style={{ textAlign: "right" }} className="mono"><strong>৳{money(sumBy(feeHeadsOf(row), h => row[h]))}</strong></td>
                      <td className="no-print">
                        <div style={{ display: "flex", gap: 6 }}>
                          <button className="btn btn-sm btn-icon" onClick={() => editGroup(row)}><Icon.edit /></button>
                          <button className="btn btn-sm btn-icon" onClick={() => deleteGroup(row)}><Icon.trash /></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}
      {tab === "teacher" && (
        <div className="card card-flush print-landscape">
          <div className="no-print" style={{ textAlign: "right", padding: "16px 18px 0" }}>
            {teacherRows.length > 0 && <button className="btn btn-sm" onClick={handlePrint}><Icon.print />Print</button>}
          </div>
          <PrintDocHead config={config} headline="Designation-wise Salary Scale" />
          {teacherRows.length === 0 ? (
            <EmptyState title="No teacher fee scales yet" sub="Add a fee group with multiple components (Basic, Allowance, etc.) per designation." />
          ) : (
            <div className="table-wrap">
              <table>
                <thead>
                  <tr>
                    <th>Designation</th>
                    {allTeacherHeads.map(h => <th key={h} style={{ textAlign: "right" }}>{h}</th>)}
                    <th style={{ textAlign: "right" }}>Total</th>
                    <th className="no-print"></th>
                  </tr>
                </thead>
                <tbody>
                  {teacherRows.map(row => (
                    <tr key={row.id}>
                      <td>{row.designation}</td>
                      {allTeacherHeads.map(h => (
                        <td key={h} style={{ textAlign: "right" }} className="mono">{row[h] ? "৳" + money(row[h]) : "—"}</td>
                      ))}
                      <td style={{ textAlign: "right" }} className="mono"><strong>৳{money(sumBy(feeHeadsOf(row), h => row[h]))}</strong></td>
                      <td className="no-print">
                        <div style={{ display: "flex", gap: 6 }}>
                          <button className="btn btn-sm btn-icon" onClick={() => editGroup(row)}><Icon.edit /></button>
                          <button className="btn btn-sm btn-icon" onClick={() => deleteGroup(row)}><Icon.trash /></button>
                        </div>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}
        </div>
      )}

      {editingGroup && <FeeGroupModal group={editingGroup} onClose={() => setEditingGroup(null)} onSave={saveGroup} />}
    </div>
  );
}

function FeeGroupModal({ group, onClose, onSave }) {
  const [form, setForm] = useState(group);
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  function updateItem(i, key, val) {
    const items = [...form.items];
    items[i] = { ...items[i], [key]: val };
    setForm({ ...form, items });
  }
  function addItem() {
    setForm({ ...form, items: [...form.items, { feeType: form.kind === "class" ? INCOME_HEADS[0] : "", amount: "" }] });
  }
  function removeItem(i) {
    setForm({ ...form, items: form.items.filter((_, idx) => idx !== i) });
  }

  return (
    <Modal title={form.kind === "class" ? "Class Fee Group" : "Teacher Fee Scale Group"} onClose={onClose} size="lg"
      footer={<><button className="btn" onClick={onClose}>Cancel</button><button className="btn btn-primary" onClick={() => onSave(form)}>Save All</button></>}>
      <div className="form-grid" style={{ marginBottom: 16 }}>
        {form.kind === "class" ? (
          <>
            <Field label="Class"><select value={form.className} onChange={set("className")}>{CLASSES.map(c => <option key={c}>{c}</option>)}</select></Field>
            <Field label="Section (optional)"><select value={form.section} onChange={set("section")}><option value="">All Sections</option>{SECTIONS.map(s => <option key={s}>{s}</option>)}</select></Field>
          </>
        ) : (
          <Field label="Designation" span2><select value={form.designation} onChange={set("designation")}>{DESIGNATIONS.map(d => <option key={d}>{d}</option>)}</select></Field>
        )}
      </div>

      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
        <label style={{ fontSize: 12, fontWeight: 600, color: "var(--slate)" }}>Fee Heads &amp; Amounts</label>
        <button className="link-btn" onClick={addItem}>+ Add another fee head</button>
      </div>
      {form.items.map((item, i) => (
        <div key={i} className="form-grid cols-3" style={{ marginBottom: 10, alignItems: "end" }}>
          <Field label="Fee Type / Head">
            {form.kind === "class" ? (
              <select value={item.feeType} onChange={(e) => updateItem(i, "feeType", e.target.value)}>
                {INCOME_HEADS.map(h => <option key={h}>{h}</option>)}
              </select>
            ) : (
              <input type="text" value={item.feeType} onChange={(e) => updateItem(i, "feeType", e.target.value)} placeholder="e.g. Basic Salary, House Allowance" />
            )}
          </Field>
          <Field label="Amount"><input type="number" value={item.amount} onChange={(e) => updateItem(i, "amount", e.target.value)} /></Field>
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn btn-sm btn-icon" style={{ marginBottom: 1 }} onClick={() => removeItem(i)}><Icon.trash /></button>
          </div>
        </div>
      ))}
      <Field label="Note" span2><textarea value={form.note} onChange={set("note")} /></Field>
    </Modal>
  );
}

/* =========================================================
   REPORTS MODULE
   ========================================================= */
function ReportsModule({ data }) {
  const [range, setRange] = useState("monthly");
  const finance = data.finance || [];
  const students = data.students || [];
  const teachers = data.teachers || [];
  const feeRules = (data.fees || []).filter(f => f.kind === "class");
  const teacherFeeRules = (data.fees || []).filter(f => f.kind === "teacher");

  const filtered = finance.filter(f => withinRange(f.date, range));
  const income = sumBy(filtered.filter(f => f.type === "income"), f => f.amount);
  const expense = sumBy(filtered.filter(f => f.type === "expense"), f => f.amount);
  const net = income - expense;

  const studentDueTotal = sumBy(students, s => studentDueFromRules(s, feeRules));
  const teacherDueTotal = sumBy(teachers, t => teacherDueFromRules(t, teacherFeeRules));

  const headBreakdown = {};
  filtered.forEach(f => {
    const key = `${f.type}:${f.head}`;
    headBreakdown[key] = (headBreakdown[key] || 0) + (Number(f.amount) || 0);
  });

  return (
    <div>
      <div className="section-head"><div><h2>Reports</h2><p>Income, expense, and due summaries — daily, monthly, or yearly.</p></div></div>
      <div className="chip-row no-print" style={{ marginBottom: 18 }}>
        {["daily","monthly","yearly"].map(r => (
          <button key={r} className={`chip ${range === r ? "active" : ""}`} onClick={() => setRange(r)} style={{ textTransform: "capitalize" }}>{r}</button>
        ))}
      </div>

      <div className="grid grid-3" style={{ marginBottom: 20 }}>
        <StatCard label={`${range} Income`} value={"৳"+money(income)} accent="var(--moss)" />
        <StatCard label={`${range} Expense`} value={"৳"+money(expense)} accent="var(--red)" />
        <StatCard label="Net Balance" value={"৳"+money(net)} sub={net >= 0 ? "Surplus" : "Deficit"} accent={net >= 0 ? "var(--gold)" : "var(--red)"} />
      </div>

      <div className="grid grid-2">
        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 12 }}>Breakdown by Head ({range})</h3>
          {Object.keys(headBreakdown).length === 0 ? <EmptyState title="No transactions in this range" sub="Add finance entries to see breakdowns." /> : (
            Object.entries(headBreakdown).map(([key, val]) => {
              const [type, head] = key.split(":");
              return <div className="kv-row" key={key}><span className="k">{head} <span className={`badge ${type === "income" ? "badge-green" : "badge-red"}`} style={{ marginLeft: 6 }}>{type}</span></span><span className="v">৳{money(val)}</span></div>;
            })
          )}
        </div>
        <div className="card">
          <h3 style={{ fontSize: 15, marginBottom: 12 }}>Total Outstanding Dues</h3>
          <div className="kv-row"><span className="k">Student fee dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(studentDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Teacher salary dues</span><span className="v" style={{ color: "var(--red)" }}>৳{money(teacherDueTotal)}</span></div>
          <div className="kv-row"><span className="k">Combined</span><span className="v">৳{money(studentDueTotal + teacherDueTotal)}</span></div>
        </div>
      </div>

      <div className="no-print" style={{ marginTop: 18, display: "flex", justifyContent: "flex-end" }}>
        <button className="btn btn-primary" onClick={() => window.print()}><Icon.print />Print Report</button>
      </div>
    </div>
  );
}

/* =========================================================
   SETTINGS MODULE
   ========================================================= */
function SettingsModule({ config, setConfig }) {
  const [form, setForm] = useState({ ...config, schoolPhones: config.schoolPhones && config.schoolPhones.length ? config.schoolPhones : ["", "", ""] });
  const toast = useToast();
  const set = (k) => (e) => setForm({ ...form, [k]: e.target.value });

  function setPhone(i, val) {
    const phones = [...form.schoolPhones];
    phones[i] = val;
    setForm({ ...form, schoolPhones: phones });
  }

  function handleSave() {
    setConfig(form);
    saveConfig(form);
    toast("Settings saved");
  }

  return (
    <div>
      <div className="section-head"><div><h2>Settings</h2><p>Institution profile shown on ID cards, invoices, and documents.</p></div></div>

      <div className="card" style={{ maxWidth: 560 }}>
        <div className="form-grid" style={{ gridTemplateColumns: "1fr" }}>
          <Field label="Institution Name"><input type="text" value={form.schoolName} onChange={set("schoolName")} /></Field>
          <Field label="Address"><textarea value={form.schoolAddress || ""} onChange={set("schoolAddress")} placeholder="Full address" /></Field>
          <Field label="Mobile Number 1"><input type="tel" value={form.schoolPhones[0] || ""} onChange={(e) => setPhone(0, e.target.value)} placeholder="e.g. 01XXXXXXXXX" /></Field>
          <Field label="Mobile Number 2" hint="optional"><input type="tel" value={form.schoolPhones[1] || ""} onChange={(e) => setPhone(1, e.target.value)} /></Field>
          <Field label="Mobile Number 3" hint="optional"><input type="tel" value={form.schoolPhones[2] || ""} onChange={(e) => setPhone(2, e.target.value)} /></Field>
          <PhotoBox label="Logo" folder="logo" config={form} existingUrl={form.schoolLogo} onUploaded={(url) => setForm(f => ({ ...f, schoolLogo: url }))} />
          <Field label="Facebook Page URL"><input type="text" value={form.facebookUrl || ""} onChange={set("facebookUrl")} placeholder="https://facebook.com/…" /></Field>
          <Field label="YouTube Channel URL"><input type="text" value={form.youtubeUrl || ""} onChange={set("youtubeUrl")} placeholder="https://youtube.com/…" /></Field>
        </div>
        <button className="btn btn-primary" style={{ marginTop: 16 }} onClick={handleSave}>Save Settings</button>
      </div>
    </div>
  );
}

/* =========================================================
   APP SHELL
   ========================================================= */
const NAV_GROUPS = [
  { label: "Overview", items: [{ key: "dashboard", label: "Dashboard", icon: "dashboard" }] },
  { label: "People", items: [
    { key: "students", label: "Students", icon: "students" },
    { key: "teachers", label: "Teachers", icon: "teachers" },
  ]},
  { label: "Money", items: [
    { key: "finance", label: "Finance", icon: "finance" },
    { key: "due", label: "Due List", icon: "due" },
    { key: "fees", label: "Master Fee", icon: "fee" },
  ]},
  { label: "Organization", items: [
    { key: "committee", label: "Committee", icon: "committee" },
    { key: "reports", label: "Reports", icon: "reports" },
  ]},
  { label: "System", items: [{ key: "settings", label: "Settings", icon: "settings" }] },
];

const MODULE_TITLES = {
  dashboard: "Dashboard", students: "Students", teachers: "Teachers", finance: "Finance",
  due: "Due List", fees: "Master Fee", committee: "Committee", reports: "Reports", settings: "Settings",
};

function MenuBar({ active, setActive, config, store }) {
  const [mobileOpen, setMobileOpen] = useState(false);
  const flatItems = NAV_GROUPS.flatMap(g => g.items);

  function pick(key) {
    setActive(key);
    setMobileOpen(false);
  }

  return (
    <div className="menubar no-print">
      <div className="menubar-row">
        <div className="menubar-brand">
          {config.schoolLogo ? (
            <img src={config.schoolLogo} alt="" className="menubar-brand-logo" />
          ) : (
            <div className="menubar-brand-mark">V</div>
          )}
          <div>
            <div className="menubar-brand-text">Vidyalaya</div>
            <div className="menubar-brand-sub">{config.schoolName || "School Manager"}</div>
          </div>
        </div>

        <nav className="menubar-nav desktop-nav">
          {flatItems.map(item => (
            <button key={item.key} className={`menubar-item ${active === item.key ? "active" : ""}`} onClick={() => pick(item.key)}>
              <IconWrap name={item.icon} />
              {item.label}
            </button>
          ))}
        </nav>

        <button className="menubar-toggle" onClick={() => setMobileOpen(o => !o)} aria-label="Menu">
          <IconWrap name={mobileOpen ? "x" : "menu"} />
        </button>
      </div>

      <div className={`menubar-mobile-panel ${mobileOpen ? "open" : ""}`}>
        {NAV_GROUPS.map(group => (
          <div key={group.label}>
            <div className="menubar-group-label">{group.label}</div>
            {group.items.map(item => (
              <button key={item.key} className={`menubar-item ${active === item.key ? "active" : ""}`} onClick={() => pick(item.key)}>
                <IconWrap name={item.icon} />
                {item.label}
              </button>
            ))}
          </div>
        ))}
      </div>
    </div>
  );
}

function AppShell() {
  const [config, setConfigState] = useState(loadConfig());
  const [active, setActive] = useState("dashboard");
  const store = useDataStore(config);

  function setConfig(c) { setConfigState(c); }

  // Update favicon and document title when the logo/school name changes
  useEffect(() => {
    if (config.schoolLogo) {
      let link = document.querySelector("link[rel~='icon']");
      if (!link) {
        link = document.createElement("link");
        link.rel = "icon";
        document.head.appendChild(link);
      }
      link.href = config.schoolLogo;
    }
    if (config.schoolName) {
      document.title = config.schoolName + " — Vidyalaya";
    }
  }, [config.schoolLogo, config.schoolName]);

  return (
    <div className="app-shell">
      <MenuBar active={active} setActive={setActive} config={config} store={store} />

      <div className="main-col">
        <div className="topbar no-print">
          <div className="topbar-title">{MODULE_TITLES[active]}</div>
          <div className="topbar-actions">
            <div className="sync-pill">
              <span className={`sync-dot ${store.status === "loading" ? "pending" : store.status === "error" ? "error" : ""}`}></span>
              {store.status === "loading" ? "Syncing…" : store.status === "error" ? "Sync error" : store.status === "offline" ? "Offline mode" : "Synced"}
            </div>
            <button className="btn btn-sm btn-icon" title="Sync now" onClick={store.refresh}><IconWrap name="refresh" /></button>
          </div>
        </div>
        <div className="content">
          <ConnectionBanner config={config} onOpenSettings={() => setActive("settings")} />
          {active === "dashboard" && <Dashboard data={store.data} setActiveModule={setActive} />}
          {active === "students" && <StudentsModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "teachers" && <TeachersModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "finance" && <FinanceModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "due" && <DueModule data={store.data} config={config} />}
          {active === "fees" && <MasterFeeModule data={store.data} save={store.save} remove={store.remove} config={config} />}
          {active === "committee" && <CommitteeModule data={store.data} save={store.save} remove={store.remove} />}
          {active === "reports" && <ReportsModule data={store.data} />}
          {active === "settings" && <SettingsModule config={config} setConfig={setConfig} />}
        </div>
      </div>
    </div>
  );
}

function Root() {
  return (
    <ToastProvider>
      <AppShell />
    </ToastProvider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);

</script>
</body>
</html>
